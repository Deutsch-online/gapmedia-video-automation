name: Prepare and test the private cached Aryana lip-sync worker
on:
  push:
    branches: [delivery/aryana-hf-20261029]
    paths: [aryana-hosting/lipsync-worker-request.json]
permissions:
  contents: write
concurrency:
  group: aryana-lipsync-worker-deployment
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1' gradio_client==2.0.0 edge-tts==7.3.1
      - name: Provision only ZeroGPU and test two fresh off-air sentences
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python aryana-hosting/deploy-lipsync-worker.py
      - name: Save private-worker test results on delivery branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add aryana-hosting/lipsync-worker-trial
          if ! git diff --cached --quiet; then
            git commit -m 'Record private cached lip-sync worker readiness and fresh reply timings'
            git pull --rebase origin delivery/aryana-hf-20261029
            git push origin HEAD:delivery/aryana-hf-20261029
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aryana-private-lipsync-worker
          path: aryana-hosting/lipsync-worker-trial
          retention-days: 3

name: Deploy Crown52 private control and public screen
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - crown52-hosting/request.json
      - .github/workflows/deploy-crown52.yml
permissions:
  contents: read
concurrency:
  group: crown52-free-hosting
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[recovery]') }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=0.36,<2' cryptography
      - name: Deploy using existing Hugging Face connection on free CPU-basic
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python crown52-hosting/deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown52-private-delivery
          path: hosting-delivery
          if-no-files-found: warn
          retention-days: 14

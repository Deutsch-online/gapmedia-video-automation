name: Review cached doctor voices and app graphics
on:
  push:
    branches: [codex/doctor-appointment-45s]
    paths: [.doctor-voice-review-request.json]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only review tools
        run: |
          python -m pip install 'pillow>=11,<13'
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: doctor-voice-review-${{ github.run_id }}
          restore-keys: doctor-45s-native-v1-
          fail-on-cache-miss: true
      - name: Render actual cached voices and designed app steps, without GPU
        env:
          CINEMATIC_CACHED_ONLY: 'on'
        run: |
          python ai-cast/doctor-story-preview.py --audio-cache renders/cinematic-series-cache/e0014 --output /tmp/doctor-voice-review
          cp renders/cinematic-series-cache/e0014/00.png /tmp/doctor-voice-review/first-scene-reference.png
          cp renders/cinematic-series-cache/e0014/narration-timing.json /tmp/doctor-voice-review/narration-timing.json
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-voiced-review-45s
          path: |
            /tmp/doctor-voice-review/doctor-voiced-review-45s.mp4
            /tmp/doctor-voice-review/first-scene-reference.png
            /tmp/doctor-voice-review/narration-timing.json
            /tmp/doctor-voice-review/preview-report.json
            /tmp/doctor-voice-review/contact.jpg
          retention-days: 14

name: Daily cinematic German Persian serial
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main, codex/cinematic-series-daily]
    paths:
      - .cinematic-series-request.json
      - .cinematic-series.json
      - .github/workflows/cinematic-series.yml
      - ai-cast/cinematic-series.py
      - ai-cast/cinematic_music.py
      - ai-cast/cinematic_speech.py
      - ai-cast/comedy-pilot.json
      - ai-cast/everyday-pilot.json
      - public/ai-cast/wg-chaos/**
      - ai-cast/cinematic-series-bot.mjs
      - tests/test_cinematic_series.py
  workflow_dispatch:
    inputs:
      force:
        description: Build today's next episode now (never resend a delivered day)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check schedule, continuity and delivery safeguards
        run: |
          python -m py_compile ai-cast/cinematic-series.py
          python -m unittest discover -s tests -p test_cinematic_series.py -v
          python ai-cast/cinematic-series.py check
          node --check ai-cast/cinematic-series-bot.mjs
      - name: Select one undelivered Berlin day
        id: gate
        env:
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          force=false
          if [[ "${INPUT_FORCE:-false}" == true ]]; then force=true; fi
          if [[ "$GITHUB_EVENT_NAME" == push ]] && git diff --name-only HEAD~1 HEAD | grep -Fxq .cinematic-series-request.json; then
            force=true
          fi
          echo "force=$force" >> "$GITHUB_OUTPUT"
          if [[ "$force" == true ]]; then
            python ai-cast/cinematic-series.py gate --force
          else
            python ai-cast/cinematic-series.py gate
          fi
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        with:
          node-version: '22'
      - name: Install production media tools
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts>=7.2,<8' gradio_client pillow 'huggingface_hub>=0.34'
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Restore completed cinematic scenes
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-${{ github.run_id }}
          restore-keys: |
            cinematic-series-v2-
            comedy-preview-
            cinematic-series-v1-
      - name: Make, check and deliver the next 60-second episode
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAID_FALLBACK: 'off'
          REQUIRE_VOICE: 'on'
          FORCE_TODAY: ${{ steps.gate.outputs.force }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [[ "$FORCE_TODAY" == true ]]; then
            python ai-cast/cinematic-series.py run --force
          else
            python ai-cast/cinematic-series.py run
          fi
      - name: Save completed scenes for bounded recovery
        if: always() && github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-${{ github.run_id }}
      - name: Keep final episodes and quality evidence
        if: always() && github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-series-${{ github.run_id }}
          path: |
            renders/cinematic-series/**/e*-cinematic-fa-de.mp4
            renders/cinematic-series/**/*-60s.mp4
            renders/cinematic-series/**/delivery-*.json
            renders/cinematic-series/**/quality.json
            renders/cinematic-series/**/episode.json
            renders/cinematic-series/**/contact.jpg
          if-no-files-found: warn
          retention-days: 14

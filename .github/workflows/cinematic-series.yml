name: Daily cinematic German Persian serial
on:
  schedule:
    # 07:30 Europe/Berlin: the date gate admits one production start across both DST offsets.
    - cron: '30 5,6 * * *'
  push:
    branches: [main, codex/cinematic-series-daily]
    paths:
      - .cinematic-series-request.json
      - .cinematic-series.json
      - .github/workflows/cinematic-series.yml
      - ai-cast/cinematic-series.py
      - ai-cast/cinematic_music.py
      - ai-cast/cinematic_speech.py
      - ai-cast/cinematic_graphics.py
      - ai-cast/doctor-appointment-45s.json
      - ai-cast/comedy-pilot.json
      - ai-cast/everyday-pilot.json
      - public/ai-cast/wg-chaos/**
      - public/ai-cast/storybook-duo/**
      - ai-cast/cinematic-series-bot.mjs
      - tests/test_cinematic_series.py
      - ai-cast/cinematic_daily.py
      - ai-cast/cinematic_story_bank.py
      - ai-cast/cinematic_design.py
      - ai-cast/cinematic_ltx2.py
      - ai-cast/cinematic_longcat.py
      - ai-cast/cinematic_social.py
      - ai-cast/story-bank.json
      - ai-cast/cinematic_time_budget.py
      - ai-cast/cinematic_budget.py
      - tests/test_cinematic_daily.py
      - tests/test_cinematic_time_budget.py
  workflow_dispatch:
    inputs:
      force:
        description: Build today's next episode now (never resend a delivered day)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check free planning provider configuration
        env:
          BEATAPI_API_KEY: ${{ secrets.BEATAPI_API_KEY }}
          BEAT_API_KEY: ${{ secrets.BEAT_API_KEY }}
          BEATAPI_KEY: ${{ secrets.BEATAPI_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util, json, os, urllib.request
          if os.getenv('BEATAPI_API_KEY') or os.getenv('BEAT_API_KEY') or os.getenv('BEATAPI_KEY'):
              spec = importlib.util.spec_from_file_location('series', 'ai-cast/cinematic-series.py')
              series = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(series)
              try:
                  models = series.beatapi_free_models()
                  print('BeatAPI eligible zero-price text candidates: ' + ', '.join(models))
                  # Catalog-only preflight: a ping consumes the free request/minute.
              except Exception as exc:
                  print('BeatAPI free text: unavailable (' + series.provider_error(exc) + ')')
          else:
              print('BeatAPI free text: no GitHub Actions key configured')
          print('MiniMax key: configured' if os.getenv('MINIMAX_API_KEY') else 'MiniMax key: absent')
          if os.getenv('MINIMAX_API_KEY') and os.getenv('GITHUB_EVENT_NAME') == 'push':
              try:
                  req = urllib.request.Request('https://www.minimax.io/v1/token_plan/remains',
                      headers={'Authorization': 'Bearer ' + os.environ['MINIMAX_API_KEY']})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      balance = json.load(response)
                  subscription = balance.get('base_resp', {}).get('status_code') == 0
                  print('MiniMax subscription allowance: readable' if subscription else
                        'MiniMax subscription allowance: could not verify')
              except Exception:
                  print('MiniMax subscription allowance: could not verify')
          print('MiniMax paid-key use: disabled until included allowance and request pricing are proven')
          PY
      - name: Check schedule, continuity and delivery safeguards
        run: |
          python -m py_compile ai-cast/cinematic-series.py
          python -m unittest discover -s tests -p test_cinematic_series.py -v
          python -m unittest discover -s tests -p test_wan2gp_backend.py -v
          python -m unittest discover -s tests -p test_cinematic_budget.py -v
          python -m unittest discover -s tests -p test_cinematic_story_bank.py -v
          python -m unittest discover -s tests -p test_cinematic_daily.py -v
          python -m unittest discover -s tests -p test_cinematic_time_budget.py -v
          python -m py_compile ai-cast/wan2gp_worker.py
          python ai-cast/cinematic-series.py check
          node --check ai-cast/cinematic-series-bot.mjs
          node --test tests/test-cinematic-credit.mjs
      - name: Select one undelivered Berlin day
        id: gate
        env:
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          force=false
          if [[ "${INPUT_FORCE:-false}" == true ]]; then force=true; fi
          if [[ "$GITHUB_EVENT_NAME" == push ]] && git diff --name-only HEAD~1 HEAD | grep -Fxq .cinematic-series-request.json; then
            force=true
          fi
          echo "force=$force" >> "$GITHUB_OUTPUT"
          # Code/config pushes validate only; an explicit production request may start a run.
          if [[ "$GITHUB_EVENT_NAME" == push && "$force" == false ]]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$force" == true ]]; then
            python ai-cast/cinematic-series.py gate --force
          else
            python ai-cast/cinematic-series.py gate
          fi
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        with:
          node-version: '22'
      - name: Install production media tools
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts>=7.2,<8' gradio_client pillow 'huggingface_hub>=0.34'
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          python -m unittest discover -s tests -p test_cinematic_graphics.py -v
          python -m unittest discover -s tests -p test_cinematic_design.py -v
          python -m unittest discover -s tests -p test_cinematic_longcat.py -v
      - name: Restore completed cinematic scenes
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cinematic-series-v2-
            comedy-preview-
            cinematic-series-v1-
      - name: Select the verified recovery artifact only for its exact pending episode
        id: recovery
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          config=json.loads(Path('.cinematic-series.json').read_text())
          state=json.loads(Path('.cinematic-series-state.json').read_text())
          artifact=config.get('visual_profile',{}).get('recovery_artifact',{})
          plan=(state.get('pending') or {}).get('plan',{})
          if artifact.get('episode')==state['next_episode'] and artifact.get('story_id')==plan.get('story_id'):
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:
                  output.write('run_id='+str(artifact['run_id'])+'\n')
                  output.write('artifact_name='+artifact['name']+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true' && steps.recovery.outputs.run_id != ''
        with:
          name: ${{ steps.recovery.outputs.artifact_name }}
          run-id: ${{ steps.recovery.outputs.run_id }}
          github-token: ${{ github.token }}
          path: renders/cinematic-series-cache
      - name: Make, check and deliver the next exact-duration episode
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BEATAPI_API_KEY: ${{ secrets.BEATAPI_API_KEY }}
          BEAT_API_KEY: ${{ secrets.BEAT_API_KEY }}
          BEATAPI_KEY: ${{ secrets.BEATAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CINEMATIC_FREE_PLANNING_ONLY: 'on'
          PAID_FALLBACK: 'off'
          REQUIRE_VOICE: 'on'
          FORCE_TODAY: ${{ steps.gate.outputs.force }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [[ "$FORCE_TODAY" == true ]]; then
            python ai-cast/cinematic-series.py run --force
          else
            python ai-cast/cinematic-series.py run
          fi
      - name: Save completed scenes for bounded recovery
        if: always() && github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep final episodes and quality evidence
        if: always() && github.ref == 'refs/heads/main' && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-series-${{ github.run_id }}
          path: |
            renders/cinematic-series/**/e*-cinematic-fa-de.mp4
            renders/cinematic-series/**/*-60s.mp4
            renders/cinematic-series/**/*-45s.mp4
            renders/cinematic-series/**/*-65s.mp4
            renders/cinematic-series/**/delivery-*.json
            renders/cinematic-series/**/quality.json
            renders/cinematic-series/**/episode.json
            renders/cinematic-series/**/graphics-report.json
            renders/cinematic-series/**/caption-design.json
            renders/cinematic-series/**/contact.jpg
            renders/cinematic-series-cache/**/narration-timing.json
            renders/cinematic-series-cache/budgets/*.json
          if-no-files-found: warn
          retention-days: 14

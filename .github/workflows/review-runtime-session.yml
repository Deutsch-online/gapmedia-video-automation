name: Review public Runtime sandbox documentation
on:
  push:
    branches: [codex/read-social-feedback-20261029]
    paths: [.github/workflows/review-runtime-session.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read public vendor documentation without account credentials
        run: |
          node --input-type=module <<'NODE'
          const urls=['https://withruntime.com/','https://withruntime.com/llms.txt'];
          for(const url of urls){
          try{
           const r=await fetch(url,{headers:{accept:'text/markdown'},signal:AbortSignal.timeout(20000)});
           const body=await r.text();
           console.log('PUBLIC_RUNTIME_PAGE='+JSON.stringify({url,final_url:r.url,status:r.status,content_type:r.headers.get('content-type'),text:body.slice(0,42000)}));
          }catch(e){console.log(JSON.stringify({url,error:e.name}));}
          }
          NODE

name: Verify Runtime pricing and hardware
on:
  push:
    branches: [codex/read-social-feedback-20261029]
    paths: [.github/workflows/review-runtime-session.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read public pricing and hardware specifications
        run: |
          node --input-type=module <<'NODE'
          for(const url of ["https://withruntime.com/pricing.md","https://withruntime.com/docs/included-usage","https://withruntime.com/docs/choosing-agent-sandbox"]){try{const r=await fetch(url,{headers:{accept:'text/markdown'},signal:AbortSignal.timeout(20000)});const body=await r.text();console.log('RUNTIME_FACTS='+JSON.stringify({url,status:r.status,text:body.slice(0,60000)}));}catch(e){console.log(JSON.stringify({url,error:e.name}));}}
          NODE

name: Compose requested happy football stadium music and paper card foley
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths: [.github/workflows/crown-stadium-audio.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: crown52-stadium45-audio
  cancel-in-progress: false
jobs:
  generate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crown52-stadium45-generated-audio
          path: crown52-hosting/audio
          run-id: 41579735410
          github-token: ${{ github.token }}
      - name: Install audio encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify all already-generated assets are present
        run: |
          test -s crown52-hosting/audio/football-stadium-happy-v45.mp3
          test -s crown52-hosting/audio/card-paper-flutter-a-v45.mp3
          test -s crown52-hosting/audio/card-paper-flutter-b-v45.mp3
      - name: Encode already-generated audio without further paid generation
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          GENERATION_REUSE_ONLY: '1'
        run: python .github/scripts/crown-stadium-audio.py
      - name: Preserve generated assets and embedded audio
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crown52-hosting/audio/football-stadium-happy-v45.* crown52-hosting/audio/card-paper-flutter-*-v45.* crown52-hosting/audio/stadium45-receipt.json crown52-hosting/league-audio.json
          git diff --cached --quiet && exit 0
          git commit -m 'Save original joyful stadium music and flowing paper-card foley from ElevenLabs'
          git push origin HEAD:codex/live-crown52-hosting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown52-stadium45-generated-audio
          path: crown52-hosting/audio
          if-no-files-found: warn

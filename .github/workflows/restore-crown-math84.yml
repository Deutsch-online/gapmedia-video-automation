name: Publish gift-free quiz with answer avatars and highlighted leaders
on:
  push:
    branches: [main]
    paths: [".github/workflows/restore-crown-math84.yml"]
permissions:
  contents: read
concurrency:
  group: crown52-math81-update
  cancel-in-progress: false
jobs:
  update:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install 'huggingface_hub>=0.34,<2'
      - name: Unpack tested game update
        run: |
          mkdir -p /tmp/crown-update
          python3 - <<'PY'
          import base64,tarfile,io
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode('')),mode='r:gz') as t:
              t.extractall('/tmp/crown-update',filter='data')
          PY
          cd /tmp/crown-update
          node --check server.mjs
          node --check public/math-duel-ui.mjs
          node --test tests/math-duel.mjs
      - name: Update existing Hugging Face Space and verify live panel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,time,json,urllib.request,pathlib
          from huggingface_hub import HfApi,CommitOperationAdd
          api=HfApi(token=os.environ['HF_TOKEN'])
          repo='afgtakrun/live-crown-52'
          info=api.repo_info(repo,repo_type='space')
          if info.sha!='1e306823609a0400f88198838a6d1fbf187b2a65':
              raise SystemExit('Space source changed; rebase required before deployment')
          root=pathlib.Path('/tmp/crown-update')
          files=['server.mjs','public/math-duel.mjs','public/math-duel-ui.mjs','public/math-duel.html','public/math-duel.css','tests/math-duel.mjs']
          result=api.create_commit(repo_id=repo,repo_type='space',parent_commit=info.sha,commit_message='Restore live math duel with authenticated panel and shared ranking',operations=[CommitOperationAdd(path_in_repo=f,path_or_fileobj=str(root/f)) for f in files])
          print('CROWN_MATH_COMMIT '+result.oid,flush=True)
          origin='https://afgtakrun-live-crown-52.hf.space'
          ready=False
          for attempt in range(60):
              try:
                  health=json.load(urllib.request.urlopen(origin+'/health',timeout=15))
                  if health.get('mathVersion')==84:
                      page=urllib.request.urlopen(origin+'/fun/control?v=84',timeout=15).read().decode()
                      state=json.load(urllib.request.urlopen(origin+'/api/state',timeout=15))
                      if 'math-duel-ui.mjs?v=84' in page and state['state']['fun']['math81']['version']==84:
                          if 'answer' in state['state']['fun']['math81']:raise SystemExit('Private answer leaked')
                          ready=True
                          break
              except Exception:
                  pass
              time.sleep(10)
          if not ready:raise SystemExit('Update uploaded, but live math readiness was not confirmed; Telegram link not sent')
          print('CROWN_MATH_LIVE_VERIFIED',flush=True)
          PY
      - name: Send updated panel link to owner private Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          token=os.environ['TELEGRAM_BOT_TOKEN']
          chat=str(json.load(open('.telegram-bot-chat.json'))['id'])
          def call(method,payload):
              request=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  result=json.load(urllib.request.urlopen(request,timeout=30))
              except Exception:
                  raise SystemExit('Telegram outcome unknown; do not automatically retry')
              if not result.get('ok'):raise SystemExit('Telegram did not confirm request')
              return result['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':raise SystemExit('Private chat required')
          text='پنل و خروجی لایو به‌روز شدند:\n\nپنل بدون رمز:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=84\n\nخروجی OBS / LIVE Studio:\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?v=84\n\nنمایش، درخواست و امتیاز هدیه از این بازی حذف شده است. فقط پاسخ درست ۱۰ امتیاز دارد.\nبیشتر سؤال‌ها چهارگزینه‌ای‌اند. عکس هر کاربر زیر گزینهٔ انتخاب‌شده دیده می‌شود، حتی اگر جواب اشتباه باشد. عکس نفر اول جدول امتیاز با قاب طلایی برجسته می‌شود.\nچیدمان عمودی با فاصلهٔ امن برای رابط تیک‌تاک بازتنظیم شد. زبان پنل و خروجی جداگانه English / فارسی هستند؛ سابقهٔ سؤال‌ها و گفتار متنوع حفظ شده‌اند.\n\nStart / شروع را بزنید و حساب در حال لایو را متصل کنید. در صورت مسدودشدن پخش خودکار صدا، Enable live voice را یک بار بزنید.'
          result=call('sendMessage',{'chat_id':chat,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN_MATH_PANEL_DELIVERED message_id='+str(result['message_id']))
          PY

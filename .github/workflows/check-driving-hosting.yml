name: Check free CPU hosting permission for driving LIVE
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-driving-hosting.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read identity permissions only; no hosting or GPU request
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          token=os.getenv('HF_TOKEN')
          if not token:
              print('HOSTING_CHECK: Hugging Face token is not configured')
              raise SystemExit(0)
          req=urllib.request.Request('https://huggingface.co/api/whoami-v2',headers={'Authorization':'Bearer '+token})
          try:
              with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
              role=(data.get('auth',{}).get('accessToken') or {}).get('role','unknown')
              print('HOSTING_CHECK: '+json.dumps({'username':data.get('name'),'token_role':role,'free_cpu_create_candidate':role in ('write','fineGrained'),'gpu_requested':False,'paid_requested':False}))
          except Exception as exc:
              print('HOSTING_CHECK: could not verify permission ('+type(exc).__name__+')')
          PY

name: Check free CPU hosting permission for driving LIVE
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-driving-hosting.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read identity permissions only; no hosting or GPU request
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          token=os.getenv('HF_TOKEN')
          if not token:
              print('HOSTING_CHECK: Hugging Face token is not configured')
              raise SystemExit(0)
          req=urllib.request.Request('https://huggingface.co/api/whoami-v2',headers={'Authorization':'Bearer '+token})
          try:
              with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
              role=(data.get('auth',{}).get('accessToken') or {}).get('role','unknown')
              print('HOSTING_CHECK: '+json.dumps({'username':data.get('name'),'token_role':role,'free_cpu_create_candidate':role in ('write','fineGrained'),'gpu_requested':False,'paid_requested':False}))
          except Exception as exc:
              print('HOSTING_CHECK: could not verify permission ('+type(exc).__name__+')')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the official hosting client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
      - name: Prepare only explicitly free CPU-basic hosting
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json
          from huggingface_hub import HfApi,SpaceHardware
          from huggingface_hub.errors import RepositoryNotFoundError,HfHubHTTPError
          api=HfApi(token=os.environ['HF_TOKEN'])
          owner=api.whoami()['name']; repo=owner+'/fahrfit-driving-live'
          try:
              try:
                  info=api.space_info(repo)
              except RepositoryNotFoundError:
                  api.create_repo(repo,repo_type='space',space_sdk='docker',space_hardware=SpaceHardware.CPU_BASIC,private=False)
                  info=api.space_info(repo)
              runtime=api.get_space_runtime(repo)
              if runtime.hardware not in (None,'cpu-basic') or runtime.requested_hardware not in (None,'cpu-basic'):
                  raise RuntimeError('Refusing hosting with non-free hardware')
              print('HOSTING_PREPARED: '+json.dumps({'repo':repo,'url':info.host,'hardware':runtime.hardware,'requested_hardware':runtime.requested_hardware,'gpu_requested':False,'paid_requested':False}))
          except HfHubHTTPError as exc:
              print('HOSTING_BLOCKED: HTTP '+str(exc.response.status_code)+'; current HF_TOKEN cannot prepare this free Space; no paid fallback')
              raise SystemExit(1)
          PY

name: Validate Telegram chatbot
on:
  push:
    branches: [main]
    paths: [worker/src/credit.js, worker/src/index.js, worker/src/assistant-tools.js, worker/set-commands.mjs, worker/test-chatbot.mjs, worker/test-tools.mjs, .github/workflows/deploy-credit-webhook.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: worker
      - name: Check root Worker build
        run: worker/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/gapmedia-worker-dry-run
      - name: Verify Telegram command and chat behavior
        run: |
          node worker/test-commands.mjs
          node worker/test-chatbot.mjs
          node worker/test-tools.mjs

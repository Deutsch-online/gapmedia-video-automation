name: Deploy Telegram chatbot to active webhook
on:
  push:
    branches: [main]
    paths: [worker/src/credit.js, worker/src/index.js, worker/set-commands.mjs, worker/test-chatbot.mjs, .github/workflows/deploy-credit-webhook.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: worker
      - name: Select valid Cloudflare credential
        working-directory: worker
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_FALLBACK: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          for candidate in "$CF_TOKEN_PRIMARY" "$CF_TOKEN_FALLBACK"; do
            if [ -z "$candidate" ]; then continue; fi
            if CLOUDFLARE_API_TOKEN="$candidate" npx wrangler whoami >/dev/null 2>&1; then
              printf 'CLOUDFLARE_API_TOKEN=%s\n' "$candidate" >> "$GITHUB_ENV"
              echo "A valid Cloudflare credential was selected."
              exit 0
            fi
          done
          echo "::error::Neither GitHub Cloudflare token is accepted by Cloudflare."
          exit 1
      - name: Verify Telegram command and chat behavior
        run: |
          node worker/test-commands.mjs
          node worker/test-chatbot.mjs
      - name: Deploy existing worker
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Update Telegram command menu
        run: node worker/set-commands.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

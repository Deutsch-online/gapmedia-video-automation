name: Validate Telegram chatbot
on:
  push:
    branches: [main]
    paths: ['worker/src/**', worker/set-commands.mjs, 'worker/test-*.mjs', scripts/social-watchdog.mjs, scripts/test-social-watchdog.mjs, .github/workflows/deploy-credit-webhook.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: worker
      - name: Check root Worker build
        run: worker/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/gapmedia-worker-dry-run
      - name: Verify Telegram command and chat behavior
        run: |
          node worker/test-commands.mjs
          node worker/test-chatbot.mjs
          node worker/test-tools.mjs
          node worker/test-research-agent.mjs
          node worker/test-free-diagnostics.mjs
          node worker/test-project-diagnostics.mjs
          node worker/test-credit-simple.mjs
          node worker/test-project-memory.mjs
          node worker/test-venice.mjs
          node worker/test-mcp.mjs
          node worker/test-command-registry.mjs
          node worker/test-series-assistant.mjs
          node worker/test-social-monitor.mjs
          node scripts/test-social-watchdog.mjs

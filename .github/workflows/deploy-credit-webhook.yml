name: Deploy Telegram chatbot to active webhook
on:
  push:
    branches: [main]
    paths: [worker/src/credit.js, worker/src/index.js, worker/set-commands.mjs, worker/test-chatbot.mjs]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare deployment token is not configured; webhook code cannot be deployed."
            exit 1
          fi
      - run: npm ci
        working-directory: worker
      - name: Verify Telegram command and chat behavior
        run: |
          node worker/test-commands.mjs
          node worker/test-chatbot.mjs
      - name: Deploy existing worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Update Telegram command menu
        run: node worker/set-commands.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

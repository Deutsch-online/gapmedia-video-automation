name: Oma sagt voice sample (manual)

# Owner request 2026-10-05: a short free sample. Three 3-scene videos, the same picture, three voices, sent to the owner's bot chat only:
# A = Edge Katja (as in the full video), B = OmniVoice (k2-fsa, free, CPU) choosing its own voice, C = OmniVoice speaking like Katja.
# The renderer is hyperframes@0.8.134 (the owner asked to try the new version). No Hugging Face GPU, no paid service.
# OmniVoice's weights are CC-BY-NC: this is a listening sample, not a production voice.
on:
  workflow_dispatch:

concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMA_SAMPLE: "1"
      OMA_HF: "npx --yes hyperframes@0.8.134"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation
      - name: Sample A, Edge voice Katja
        env:
          OMA_VOICE: edge
        run: node oma-build.mjs
      - name: Install OmniVoice (CPU)
        if: always()
        run: |
          python -m pip install --disable-pip-version-check --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet omnivoice soundfile
      - name: Sample B, OmniVoice chooses its voice
        if: always()
        env:
          OMA_VOICE: omni-auto
        run: node oma-build.mjs
      - name: Sample C, OmniVoice speaks like Katja
        if: always()
        env:
          OMA_VOICE: omni-clone
        run: node oma-build.mjs

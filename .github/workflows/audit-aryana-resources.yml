name: Audit Aryana available compute without generation or billing
on:
  push:
    branches: [delivery/aryana-hf-20261029]
    paths: [aryana-hosting/resources-request.json, .github/workflows/audit-aryana-resources.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read account allowance and existing hardware only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python aryana-hosting/audit-resources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aryana-resource-audit
          path: /tmp/aryana-resource-audit.json
          retention-days: 3

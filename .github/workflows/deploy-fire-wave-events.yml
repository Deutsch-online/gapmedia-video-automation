name: Deploy Fire Wave username event transport
on:
  push:
    branches: [main]
    paths: [fire-wave-bridge/**, .github/workflows/deploy-fire-wave-events.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fire-wave-events-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check authored event server syntax
        run: node --check fire-wave-bridge/server.mjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install official hosting client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
      - name: Deploy on free CPU-basic
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ.get('HF_TOKEN')
          if not token:raise SystemExit('HF_TOKEN is not configured')
          api=HfApi(token=token)
          owner=api.whoami()['name']
          repo=owner+'/fire-wave-events'
          api.create_repo(repo,repo_type='space',space_sdk='docker',space_hardware='cpu-basic',private=False,exist_ok=True)
          api.upload_folder(repo_id=repo,repo_type='space',folder_path='fire-wave-bridge',commit_message='Deploy Fire Wave signed username event transport')
          print('FIRE_WAVE_EVENTS_URL=https://'+owner+'-fire-wave-events.hf.space')
          print('Hardware requested: cpu-basic; no GPU or paid-provider fallback.')
          PY

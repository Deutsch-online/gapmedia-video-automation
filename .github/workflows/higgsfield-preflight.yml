name: Check Higgsfield skills CLI access without generation or billing
on:
  push:
    branches: [delivery/aryana-hf-20261029]
    paths: [aryana-hosting/higgsfield-request.json]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify CLI and inspect account and model access only
        env:
          HIGGSFIELD_TOKEN: ${{ secrets.HIGGSFIELD_TOKEN }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
        run: python aryana-hosting/higgsfield-preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aryana-higgsfield-preflight
          path: |
            /tmp/aryana-higgsfield/report.json
            /tmp/aryana-higgsfield/auth-login-help.txt
            /tmp/aryana-higgsfield/model-catalog.json
            /tmp/aryana-higgsfield/seedance-schema.json
          retention-days: 3

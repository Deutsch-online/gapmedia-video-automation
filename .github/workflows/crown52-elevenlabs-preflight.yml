name: Crown52 ElevenLabs connection preflight
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths: [.github/workflows/crown52-elevenlabs-preflight.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configured ElevenLabs access without generating audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          ELEVENLABS_TOKEN: ${{ secrets.ELEVENLABS_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          names=['ELEVENLABS_API_KEY','ELEVEN_API_KEY','ELEVEN_LABS_API_KEY','ELEVENLABS_KEY','ELEVENLABS_TOKEN']
          selected=next((name for name in names if os.getenv(name)),None)
          if not selected:
              print('CROWN52_ELEVENLABS_PREFLIGHT '+json.dumps({'configured':False,'audioGenerated':False,'creditsSpent':0}))
          else:
              key=os.environ[selected]
              report={'configured':True,'binding':selected,'audioGenerated':False,'creditsSpent':0}
              for path,label in [('/v1/user/subscription','subscription'),('/v1/models','models')]:
                  req=urllib.request.Request('https://api.elevenlabs.io'+path,headers={'xi-api-key':key})
                  try:
                      with urllib.request.urlopen(req,timeout=20) as response:data=json.load(response)
                      report[label+'Status']=200
                      if label=='subscription':
                          report['remainingCharacters']=max(0,int(data.get('character_limit',0))-int(data.get('character_count',0)))
                          report['tier']=data.get('tier')
                      else:report['modelCount']=len(data)
                  except urllib.error.HTTPError as error:report[label+'Status']=error.code
                  except Exception:report[label+'Status']='request-failed'
              print('CROWN52_ELEVENLABS_PREFLIGHT '+json.dumps(report))
          PY

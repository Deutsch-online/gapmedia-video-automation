name: Read existing social analytics privately
on:
  push:
    branches: [codex/read-social-feedback-20261029]
    paths: [.github/workflows/read-social-feedback-session.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install encryption dependency
        run: python -m pip install --quiet 'cryptography>=44,<51'
      - name: Read existing project statistics without publishing private data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, json, base64, hashlib, urllib.request, datetime, zlib
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          pub = serialization.load_pem_public_key("-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuT1kzdICo05YsfHniEuF\nZ8cpNyHP4jmFhdWV6rlWxx/IwLFmjPiU10JgMgdQD03nFvbhfhELz1SjFTUOT3mE\n5EwtHC+T0vpMv96IZU25N3StROANe8zIVMXlt4daMeZFRn8fELG/OKsAPdFF28/i\ncxEx0f4swWXn5XLPV4wcAi+o4Tgg1ECjaOKfRDUiYk7SJXUGXf3v4uvqxxgwdTY2\nRsWOOyehXpWDHB8x4W0JhRYP4q/Lf7YayQMSNmFxkqqJBJqPQfYX2GSWl342n9DJ\nN8VYyIYu6XOWt7rjCGr9HPUKhcbL7N46UW2GYR2WzYousL/gw92GVel02W3l1yLq\nncxniu/QQUJ9N9ILZvE9deFkwqqzPPzut+hVUfLA9c/kv2rkYPSAIatmP8vYfwxE\nJEYQBxE4OVqYoXoYRVN6+qQwFbc+UyzfrHUw7qgbH/YPCNzLjTYmqv9j0RJOch5X\njZnCQnNxtm4o6gNE0ZguiJyFt+EGbIMxu39vm/0A2lP3AgMBAAE=\n-----END PUBLIC KEY-----".encode())
          result = {"observed_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          def get_json(url, headers):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = response.read(2000001)
              if len(data) > 2000000:
                  raise ValueError("response_too_large")
              return json.loads(data)
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if token:
              try:
                  signature = hashlib.sha256(("gapmedia-monitor-v1:" + token).encode()).hexdigest()
                  result["creative_feedback"] = get_json("https://afghanfollowers-telegram.afghan-video-bot.workers.dev/internal/creative-feedback", {"X-Project-Authorization": signature})
              except Exception as exc:
                  result["creative_feedback_error"] = {"kind": type(exc).__name__, "http_status": getattr(exc, "code", None)}
          else:
              result["creative_feedback_error"] = "configured_authentication_unavailable"
          cf_token, account = os.environ.get("CLOUDFLARE_API_TOKEN", ""), os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          if cf_token and account:
              result["stored_analytics"] = {}
              for key in ("dataset", "report", "health"):
                  try:
                      url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/storage/kv/namespaces/b9d8cdbf80af49b7987f59b7a9b09c01/values/social%3A" + key
                      result["stored_analytics"][key] = get_json(url, {"Authorization": "Bearer " + cf_token})
                  except Exception as exc:
                      result["stored_analytics"][key] = {"read_error": type(exc).__name__, "http_status": getattr(exc, "code", None)}
          else:
              result["stored_analytics_status"] = "configured_cloudflare_read_credentials_unavailable"
          key, nonce = os.urandom(32), os.urandom(12)
          plain = zlib.compress(json.dumps(result).encode())
          cipher = AESGCM(key).encrypt(nonce, plain, b"gapmedia-private-analytics-20261029")
          sealed = pub.encrypt(key, padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          envelope = {k: base64.b64encode(v).decode() for k,v in {"key": sealed, "nonce": nonce, "cipher": cipher}.items()}
          print("PRIVATE_ANALYTICS_ENVELOPE=" + json.dumps(envelope))
          
          PY

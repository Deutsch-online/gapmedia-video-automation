name: Gemini account check (manual, read-only)
# Owner request 2026-10-10: "check my Gemini account". Lists the models the GEMINI_API_KEY secret can see (Veo, image, text).
# No generation, no cost. The key is read from the repository secret and never printed.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: List the models (the list is not secret; the key is never printed)
        run: node scripts/gemini-check.mjs | tee ai-cast/gemini-models.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Keep the list in the repository so it can be read without the logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ai-cast/gemini-models.txt
          git diff --staged --quiet || git commit -m "gemini: model list"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

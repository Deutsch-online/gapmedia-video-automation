name: Inspect free driving host build errors
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/driving-build-diagnostics.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
      - name: Read owner-only build diagnostics
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/read-driving-build-errors.py

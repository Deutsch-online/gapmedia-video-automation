name: Read current Hugging Face free GPU allowance
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-gpu-quota.yml, .gpu-quota-request.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read quota only; no generation or billing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'ai-cast')
          from cinematic_budget import preflight
          print(json.dumps(preflight()))
          PY

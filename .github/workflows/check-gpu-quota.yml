name: Read current Hugging Face free GPU allowance
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-gpu-quota.yml, .gpu-quota-request.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read quota only; no generation or billing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import sys,json,os,urllib.request
          sys.path.insert(0,'ai-cast')
          from cinematic_budget import preflight
          print(json.dumps(preflight()))
          req=urllib.request.Request('https://huggingface.co/api/spaces/zero-gpu/quota',
              headers={'Authorization':'Bearer '+os.environ['HF_TOKEN']})
          with urllib.request.urlopen(req,timeout=20) as response: data=json.load(response)
          safe={k:v for k,v in data.items() if any(word in k.lower() for word in ('reset','current','limit','grant','period','expire'))}
          print('QUOTA_RESET_METADATA='+json.dumps(safe))
          PY

name: Check Fire Wave Telegram connection without sending
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-fire-wave-link.yml
permissions:
  contents: read
concurrency:
  group: send-fire-wave-link
  cancel-in-progress: false
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configured Telegram bot and owner destination without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat=os.environ.get('TELEGRAM_REVIEW_CHAT_ID') or os.environ.get('TELEGRAM_CHAT_ID','')
          if not token or not chat:
              raise SystemExit('Telegram bot or private owner chat is not configured')
          def check(method,payload):
              request=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      data=json.load(response)
              except urllib.error.HTTPError as error:
                  print(json.dumps({'method':method,'http_status':error.code,'ok':False}))
                  return None
              except Exception as error:
                  print(json.dumps({'method':method,'network_error':type(error).__name__,'ok':False}))
                  return None
              if not data.get('ok'):
                  print(json.dumps({'method':method,'ok':False,'error_code':data.get('error_code')}))
                  return None
              print(json.dumps({'method':method,'ok':True,'chat_type':data.get('result',{}).get('type')}))
              return data.get('result')
          me=check('getMe',{})
          if me:
              check('getChat',{'chat_id':chat})
          print('DIAGNOSTIC_ONLY_NO_MESSAGE_SENT')
          PY

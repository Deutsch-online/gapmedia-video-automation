# Answers one question with evidence instead of argument: can the free,
# local pocket-tts pipeline actually replace paid MiniMax TTS for this
# project's Persian narration, and does it need HF_TOKEN to do it?
#
# It exists as a separate workflow because that question could not be
# answered from the agent sandbox: `pip install pocket-tts` succeeds there,
# but huggingface.co answers 403 to CONNECT under the sandbox egress policy,
# so the model weights can never be fetched and nothing can be synthesised.
# A GitHub runner has open internet. This is the place the test can be real.
#
# Deliberately isolated from production:
#   · its own concurrency group, so it never competes with daily.yml,
#     news-scan.yml or telegram.yml for the single pending slot in
#     "gapmedia-production"
#   · it renders nothing, sends nothing to Telegram, and touches no
#     delivery state, ledger or marker
#   · it is allowed to fail. A failure here is the answer, not an incident.
name: TTS fallback probe

on:
  push:
    paths:
      - ".trigger-tts-probe"

concurrency:
  group: tts-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # OmniVoice audition (owner request 2026-09-14, https://github.com/k2-fsa/OmniVoice).
  #
  # Its own job, not another step in `probe`, for two measured reasons: the
  # weights are 2.45 GB and inference is a 612 M-parameter diffusion LM on a
  # CPU runner, so it would not fit inside probe's 25-minute budget; and if it
  # turns out to be too slow to be usable, that answer should not cost the
  # pocket-tts probe its own result.
  #
  # What is already known without running it, from the repo and the model card:
  #   · Persian IS supported — 366 hours of training data, rank 455 of the 600+
  #     languages, so it is a low-resource language for this model, not a
  #     headline one.
  #   · The CODE is Apache-2.0. The model card carries NO licence field at all,
  #     so the weights' terms are unstated — that is a question for the owner
  #     before anything ships, not an assumption to make here.
  #   · It clones from a 3-10 s reference. This job clones the voice this
  #     project actually publishes with: a reference generated by Edge TTS in
  #     the approved fa-IR-FaridNeural, whose transcript is therefore known
  #     exactly and passed as ref_text instead of being guessed by Whisper.
  #
  # Audition only: nothing here is adopted, no approved voice setting changes,
  # and no production path is touched.
  omnivoice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OmniVoice (CPU torch — the runner has no GPU)
        id: install
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --quiet \
            torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet omnivoice soundfile
          python -c "import omnivoice, torch; print('omnivoice', omnivoice.__version__, '| torch', torch.__version__)"

      - name: A 5-second reference in this project's own approved voice
        if: steps.install.outcome == 'success'
        id: reference
        continue-on-error: true
        # music/edge-tts.mjs defaults to de-DE-KatjaNeural (it was written for
        # the German-lesson word clips), so Persian text sent without this env
        # comes back as 0 bytes — measured in run #5, where this step failed
        # with "Edge TTS returned no usable audio (0 bytes)" and took the whole
        # audition with it. The production Persian path sets the same variable
        # the same way (music/make-voice.mjs, music/plan-voice.mjs).
        env:
          EDGE_TTS_VOICE: fa-IR-FaridNeural
        run: |
          npm ci --omit=dev --silent || npm install --silent
          node music/edge-tts.mjs "سلام. این صدای روایت گپ مدیا است و برای نمونه ضبط شده." -o ref-farid.mp3
          ffmpeg -y -loglevel error -i ref-farid.mp3 -t 5 -ar 24000 -ac 1 ref-farid.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 ref-farid.wav

      - name: Speak real project lines, cloned from that reference
        if: steps.reference.outcome == 'success'
        id: speak
        continue-on-error: true
        run: |
          python - <<'PY'
          import time, torch, soundfile as sf
          from omnivoice import OmniVoice

          t0 = time.time()
          model = OmniVoice.from_pretrained("k2-fsa/OmniVoice", device_map="cpu", dtype=torch.float32)
          print(f"model loaded in {time.time() - t0:.0f}s")

          # The exact text of ref-farid.wav, so ref_text is known rather than
          # transcribed by a second model whose errors would be invisible here.
          REF_TEXT = "سلام. این صدای روایت گپ مدیا است و برای نمونه ضبط شده."

          # The same three lines the pocket-tts v2 audition used, so all three
          # engines can be compared on identical copy: two from
          # lib/narration.mjs (episode 19's reworded step line and its outro),
          # and the mixed Persian+English line that both pocket-tts models
          # drop the Latin span from.
          LINES = {
              "step": "این کلمه مستقیم رفتن را نشان می‌دهد.",
              "outro": "با همین چهار جمله، مسیرت را به آلمانی پیدا می‌کنی.",
              "mixed": "با اپلیکیشن Second Space دو حساب داشته باش.",
          }
          for key, text in LINES.items():
              t = time.time()
              audio = model.generate(text=text, ref_audio="ref-farid.wav", ref_text=REF_TEXT)
              out = f"omnivoice-{key}.wav"
              sf.write(out, audio[0], 24000)
              secs = len(audio[0]) / 24000
              took = time.time() - t
              print(f"[{key}] {secs:.2f}s of audio in {took:.0f}s (RTF {took / max(secs, 0.01):.1f}) -> {out}")
          PY
          echo "--- what came out ---"
          for f in omnivoice-*.wav; do
            printf "%s  " "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      - name: Keep the takes so the owner can judge by ear
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-audition
          path: |
            omnivoice-*.wav
            ref-farid.wav
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          echo "install:   ${{ steps.install.outcome }}"
          echo "reference: ${{ steps.reference.outcome }}"
          echo "synthesis: ${{ steps.speak.outcome }}"
          echo
          echo "Read the per-line RTF above before anything else: a CPU runner"
          echo "is what this project renders on, so a model that needs a GPU to"
          echo "keep up is not a candidate however good it sounds."
          echo
          echo "Nothing is adopted here. Before OmniVoice could replace any"
          echo "engine this project uses, three separate answers are needed:"
          echo "the owner judging these clips by ear, the weights' licence"
          echo "(the code is Apache-2.0, the model card states no licence at"
          echo "all), and whether the Latin span in the mixed line survived —"
          echo "both pocket-tts models drop it."

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pocket-tts
        run: |
          python -m pip install --disable-pip-version-check --quiet pocket-tts
          python -c "import pocket_tts; print('pocket_tts at', pocket_tts.__file__)"

      # The load-bearing question. music/pocket-tts.mjs refuses to run at all
      # without HF_TOKEN, but its own comment says the token is for the
      # GATED kyutai weights that only the ENGLISH half needs. If the Farsi
      # repo is ungated, Persian-only narration needs no token — and that
      # guard is refusing a case that would have worked.
      - name: Can the Farsi model be fetched with NO token?
        id: fetch
        continue-on-error: true
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          import os, pathlib
          assert not os.environ.get("HF_TOKEN"), "this step must prove the UNAUTHENTICATED case"
          p = snapshot_download("mehdi-hf/pocket-tts-farsi")
          print("downloaded to:", p)
          for f in sorted(pathlib.Path(p).rglob("*")):
              if f.is_file():
                  print(f"  {f.relative_to(p)}  {f.stat().st_size/1e6:.1f} MB")
          PY

      - name: Synthesise one real Persian line
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          from huggingface_hub import snapshot_download
          import pathlib, subprocess, sys
          root = pathlib.Path(snapshot_download("mehdi-hf/pocket-tts-farsi"))
          cfg = next(root.rglob("farsi.yaml"), None)
          voice = next(root.rglob("example_voice.wav"), None)
          print("config:", cfg, "voice:", voice)
          if not cfg or not voice:
              sys.exit("expected farsi.yaml and example_voice.wav in the snapshot")
          # A real line from this project's own narration, not a lorem-ipsum
          # string: lib/narration.mjs a1-18-shopping, the sentence rewritten
          # today. Pure Persian, so the English half is never reached.
          text = "و با این سؤال رسمی، از فروشنده بپرس که چیزی را دارد یا نه."
          subprocess.run([sys.executable, "-m", "pocket_tts", "generate",
                          "--config", str(cfg), "--voice", str(voice),
                          "--text", text, "--temperature", "0.3",
                          "--eos-threshold", "-2", "--frames-after-eos", "0",
                          "--output-path", "probe.wav"], check=True)
          PY
          echo "--- what came out ---"
          ls -la probe.wav
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 probe.wav

      # music/pocket-tts.mjs reads the model paths from these and otherwise
      # falls back to a developer's Windows cache, so without them the wrapper
      # steps below would exit "model files not found" and prove nothing about
      # the wrapper itself. Exported exactly as the production workflows do.
      - name: Point the wrapper at the downloaded model
        if: steps.fetch.outcome == 'success'
        run: |
          python - <<'PYEOF'
          import os, pathlib
          from huggingface_hub import snapshot_download
          root = pathlib.Path(snapshot_download("mehdi-hf/pocket-tts-farsi"))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"POCKET_TTS_FARSI_CONFIG={next(root.rglob('farsi.yaml'))}\n")
              fh.write(f"POCKET_TTS_VOICE={next(root.rglob('example_voice.wav'))}\n")
          PYEOF

      # The one link the earlier probe did NOT cover. It ran `python -m
      # pocket_tts generate` directly; production never does that. It runs
      # music/pocket-tts.mjs, which additionally segments Persian from Latin,
      # applies lib/pronounce.mjs's pocketSpeakable, concatenates segments with
      # ffmpeg and trims dead air. As of 13:45 UTC pocket-tts had still never
      # spoken a line in a real run — Visual QC stopped every render before
      # narration — so this is the only way to test the wrapper without waiting
      # for a production slot.
      - name: The REAL production wrapper, end to end
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          node music/pocket-tts.mjs "و با این سؤال رسمی، از فروشنده بپرس که چیزی را دارد یا نه." -o wrapper.mp3
          echo "--- what the wrapper produced ---"
          ls -la wrapper.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 wrapper.mp3

      # A line with an English app name takes the OTHER path: it needs the
      # gated kyutai weights, so with no HF_TOKEN it must refuse cleanly and
      # name the offending span — never crash, and never silently drop the
      # English word the way pocket-tts-farsi does on its own.
      - name: A mixed Persian+English line refuses cleanly without a token
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        id: mixed
        run: |
          if node music/pocket-tts.mjs "با اپلیکیشن Second Space دو حساب داشته باش." -o mixed.mp3; then
            echo "unexpected: it produced audio for an English span with no token"
          else
            echo "refused as designed (exit non-zero) — see the message above"
          fi


      # The blocker episode 18 has been dying on all day. pocket-tts has no
      # German model, MiniMax has no credit, and the owner rejected an
      # English-accented reading on 2026-09-10 — so the question is whether
      # Edge's neural service, which lib/edge-tts.mjs already speaks and which
      # needs no key at all, gives a real NATIVE German voice for the exact
      # word that keeps failing. It cannot be answered from the agent sandbox:
      # speech.platform.bing.com is not in that egress allowlist (403 "Host not
      # in allowlist", measured 2026-09-13 19:0x). A runner has open internet.
      - name: A real German voice, keyless — the exact clip episode 18 dies on
        continue-on-error: true
        id: german
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          node music/edge-tts.mjs "Was kostet das?" -o de-katja.mp3
          echo "--- what came out ---"
          ls -la de-katja.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 de-katja.mp3

      # A second German voice, so a rejected audition has somewhere to go
      # without another probe cycle.
      - name: The same line in the alternate German voice
        if: steps.german.outcome == 'success'
        continue-on-error: true
        env:
          EDGE_TTS_VOICE: de-DE-ConradNeural
        run: |
          node music/edge-tts.mjs "Was kostet das?" -o de-conrad.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 de-conrad.mp3

      - name: Keep both German takes so the owner can listen
        if: steps.german.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: german-voice-audition
          path: de-*.mp3
          if-no-files-found: warn


      # ---------------------------------------------------------------
      # pocket-tts-farsi v2 audition (owner request 2026-09-14)
      #
      # v2 is NOT a drop-in for v1 in this project, for three reasons that
      # are facts about the model, not opinions:
      #
      #  1. It takes ROMANISED PHONEMES, not Persian script. Persian text
      #     passed straight in produces silence, with no error — every
      #     Persian character maps to the unknown token. A separate G2P
      #     stage (mehdi-hf/Homo-GE2PE-Persian-HF, a small T5) has to run
      #     first, so adopting v2 means adding transformers + a second
      #     model to every narration path, not swapping a repo id.
      #  2. Its licence is cc-by-nc-4.0 (NON-COMMERCIAL). v1 is MIT. That
      #     is an owner decision about this channel, not a technical one.
      #  3. The released pocket-tts package REJECTS v2's model.yaml
      #     (`capitalize_first_letter` — Extra inputs are not permitted),
      #     and the three flags it rejects are the ones that stop the Latin
      #     text frontend from mangling phonemes. Measured in the agent
      #     sandbox 2026-09-14: pocket-tts 3.1.0 from PyPI does not carry
      #     that key; the git fork does. `pip install "pocket-tts @ git+..."`
      #     alone is NOT enough when 3.1.0 is already present — pip treats
      #     the requirement as satisfied and silently keeps the old package,
      #     so --force-reinstall is load-bearing here.
      #
      # This step does not adopt anything and changes no approved voice
      # setting. It produces audio the owner can judge by ear, which is what
      # NARRATION_STANDARD.md and VOICE-LOG.md require before any change.
      - name: pocket-tts-farsi v2 — install the fork the model needs
        id: v2install
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            --force-reinstall --no-deps \
            "pocket-tts @ git+https://github.com/mallahyari/pocket-tts@main"
          python -m pip install --disable-pip-version-check --quiet transformers sentencepiece
          python - <<'PY'
          import pocket_tts.utils.config as cfg
          assert "capitalize_first_letter" in cfg.Config.model_fields, (
              "the installed package still rejects v2's model.yaml — the fork did not take")
          print("fork installed: model.yaml's three phoneme flags are accepted")
          PY

      - name: pocket-tts-farsi v2 — phonemise and speak real project lines
        if: steps.v2install.outcome == 'success'
        id: v2speak
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          import pathlib, subprocess, sys, importlib.util
          from huggingface_hub import snapshot_download
          import torch
          from transformers import AutoTokenizer, T5ForConditionalGeneration

          v2 = pathlib.Path(snapshot_download("mehdi-hf/pocket-tts-farsi-v2"))
          print("v2 snapshot:", v2)

          # normalize_fa.py ships INSIDE the model repo — the README is explicit
          # that G2P has no reading for digits and drops them silently without it.
          spec = importlib.util.spec_from_file_location("normalize_fa", v2 / "normalize_fa.py")
          normalize_fa = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(normalize_fa)

          tok = AutoTokenizer.from_pretrained("mehdi-hf/Homo-GE2PE-Persian-HF")
          g2p = T5ForConditionalGeneration.from_pretrained("mehdi-hf/Homo-GE2PE-Persian-HF").eval()
          TO_PHONEMES = str.maketrans({"/": "a", "a": "A", "@": "?", "$": "S", "c": "C"})

          def phonemise(text):
              text = normalize_fa.normalize_for_model(text)
              text = text.replace("؟", "").replace("?", "")
              enc = tok([text], add_special_tokens=False, return_tensors="pt")
              with torch.no_grad():
                  out = g2p.generate(**enc, num_beams=5, max_length=512, early_stopping=True)
              raw = tok.batch_decode(out, skip_special_tokens=True)[0].strip()
              # The "1" marks the ezafe for the repo's own chunker; driving the
              # package directly, it must be stripped or it is read as a token.
              return raw.translate(TO_PHONEMES).replace("1", "")

          # Real lines from lib/narration.mjs, not lorem ipsum:
          #   1. episode 19's reworded step line (plain Persian)
          #   2. its outro — digits + ezafe chain, what v2 claims to fix
          #   3. a mixed Persian+English line: v1 drops Latin words silently,
          #      and v2's phoneme vocabulary has no Latin either. This is the
          #      case music/pocket-tts.mjs splits out to the English model, so
          #      it shows whether v2 changes that problem at all.
          LINES = {
              "step": "این کلمه مستقیم رفتن را نشان می‌دهد.",
              "outro": "با همین چهار جمله، مسیرت را به آلمانی پیدا می‌کنی.",
              "mixed": "با اپلیکیشن Second Space دو حساب داشته باش.",
          }

          # The voice prompt MUST be <= 5s: the README measures 0/4 correct
          # first words at 6.1s against 4/4 at 5s, same recording. The package
          # CLI has no --voice-sec (that lives in the repo's own synthesize.py),
          # so the trim happens here.
          v1 = pathlib.Path(snapshot_download("mehdi-hf/pocket-tts-farsi"))
          prompts = {
              # the project's OWN current pocket voice, so the comparison is on
              # the voice these videos actually use
              "projectvoice": next(v1.rglob("example_voice.wav")),
              # and the model's own held-out male sample, as a control
              "modelvoice": v2 / "samples" / "prompt_news_paragraph.wav",
          }
          for name, src in prompts.items():
              cut = pathlib.Path(f"prompt-{name}.wav")
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", str(src),
                              "-t", "5", "-ar", "24000", "-ac", "1", str(cut)], check=True)
              prompts[name] = cut

          for key, text in LINES.items():
              ph = phonemise(text)
              print(f"\n[{key}] {text}\n   -> {ph!r}")
              if not ph:
                  print("   G2P returned NOTHING — this line cannot be spoken by v2")
                  continue
              for vname, prompt in prompts.items():
                  out = f"v2-{key}-{vname}.wav"
                  subprocess.run([sys.executable, "-m", "pocket_tts", "generate",
                                  "--config", str(v2 / "model.yaml"),
                                  "--voice", str(prompt),
                                  "--text", ph,
                                  "--temperature", "0.3",
                                  "--max-tokens", "18",
                                  "--output-path", out], check=True)
                  print("   wrote", out)
          PY
          echo "--- v2 output ---"
          for f in v2-*.wav; do
            printf "%s  " "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      # The same lines on v1, generated in the same job, so the owner compares
      # like with like instead of against memory.
      - name: The same lines on v1, for an A/B by ear
        if: steps.v2speak.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          from huggingface_hub import snapshot_download
          v1 = pathlib.Path(snapshot_download("mehdi-hf/pocket-tts-farsi"))
          cfg = next(v1.rglob("farsi.yaml"))
          voice = next(v1.rglob("example_voice.wav"))
          LINES = {
              "step": "این کلمه مستقیم رفتن را نشان می‌دهد.",
              "outro": "با همین چهار جمله، مسیرت را به آلمانی پیدا می‌کنی.",
              "mixed": "با اپلیکیشن Second Space دو حساب داشته باش.",
          }
          for key, text in LINES.items():
              subprocess.run([sys.executable, "-m", "pocket_tts", "generate",
                              "--config", str(cfg), "--voice", str(voice),
                              "--text", text, "--temperature", "0.3",
                              "--eos-threshold", "-2", "--frames-after-eos", "0",
                              "--output-path", f"v1-{key}.wav"], check=True)
          PY
          for f in v1-*.wav; do
            printf "%s  " "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      - name: Keep every take so the owner can judge by ear
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-v2-audition
          path: |
            v2-*.wav
            v1-*.wav
            prompt-*.wav
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          echo "fetch-without-token: ${{ steps.fetch.outcome }}"
          echo
          echo "If fetch-without-token SUCCEEDED and a probe.wav of a plausible"
          echo "length was produced, then music/pocket-tts.mjs's unconditional"
          echo "HF_TOKEN exit is refusing Persian-only lines that would work,"
          echo "and TTS_ENGINE=pocket is a real free replacement for MiniMax."
          echo "If the fetch FAILED, the Farsi repo is gated too and HF_TOKEN"
          echo "is genuinely required before any of this can be used."
          echo
          echo "pocket-tts v2 fork install: ${{ steps.v2install.outcome }}"
          echo "pocket-tts v2 synthesis:    ${{ steps.v2speak.outcome }}"
          echo
          echo "v2 is an AUDITION only. Nothing here adopts it: no approved"
          echo "voice setting changed, and lib/, music/ and the production"
          echo "workflows still point at v1. Adoption needs three separate"
          echo "answers first — the owner judging these clips by ear, a"
          echo "decision on v2's NON-COMMERCIAL licence (v1 is MIT), and a"
          echo "G2P stage added to every narration path, since v2 is silent"
          echo "on Persian script."

  # Episode-19 investigation (owner request 2026-09-15): "مستقیم" and "جا"
  # in a1-19-directions have rejected narration QC on every take today
  # (3/3 full recovery-chain attempts, twice), always as the same two words
  # ("مستقیم"→"مسترین"/"مستریم", "جا"→"جان") no matter how the surrounding
  # sentence was reworded. Before touching lib/hear.mjs on a guess, or
  # asking the owner to spend their own time listening, get real evidence:
  # does a stronger Whisper model actually transcribe these two words
  # correctly, or is medium's mistake a genuine, model-independent reading?
  #
  # Cannot be answered from the agent sandbox — same reason as the rest of
  # this file: Edge TTS's speech.platform.bing.com 403s under the sandbox's
  # egress allowlist, confirmed live 2026-09-15 trying exactly this. A
  # GitHub runner has open internet, so this is the place the test is real.
  #
  # Synthesises the EXACT two lines from lib/narration.mjs's current
  # a1-19-directions with the EXACT same call the real pipeline makes
  # (fa-IR-FaridNeural, +0%/+0%), then transcribes each with both the
  # production model (medium) and the candidate (large-v3) and prints both
  # transcripts. Evidence only: read-only permissions (workflow-level,
  # above), its own concurrency group, no Telegram, no delivery state, no
  # production file touched — nothing here changes ASR_MODEL anywhere or
  # adopts anything. That decision is the owner's, after seeing this.
  asr-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-medium-and-large-v3-v1
      - name: Install Whisper
        run: python -m pip install --disable-pip-version-check --quiet openai-whisper

      - name: Synthesize the two real failing lines (exact pipeline call)
        env:
          EDGE_TTS_VOICE: fa-IR-FaridNeural
        run: |
          node music/edge-tts.mjs "این کلمه مستقیم را نشان می‌دهد؛ بدون پیچیدن به چپ یا راست." -o /tmp/a1-19-line3.mp3
          node music/edge-tts.mjs "و این جمله نشان می‌دهد که یک جا نزدیک است." -o /tmp/a1-19-line5.mp3
          ls -la /tmp/a1-19-line3.mp3 /tmp/a1-19-line5.mp3

      - name: Transcribe with medium — today's production model
        run: |
          python3 - <<'PYEOF'
          import whisper
          model = whisper.load_model("medium")
          for f in ["/tmp/a1-19-line3.mp3", "/tmp/a1-19-line5.mp3"]:
              out = model.transcribe(f, language="fa", word_timestamps=False,
                                      condition_on_previous_text=False, fp16=False, temperature=0)
              print(f"MEDIUM  {f}: {out['text']}")
          PYEOF

      - name: Transcribe with large-v3 — the candidate model
        run: |
          python3 - <<'PYEOF'
          import whisper
          model = whisper.load_model("large-v3")
          for f in ["/tmp/a1-19-line3.mp3", "/tmp/a1-19-line5.mp3"]:
              out = model.transcribe(f, language="fa", word_timestamps=False,
                                      condition_on_previous_text=False, fp16=False, temperature=0)
              print(f"LARGE-V3  {f}: {out['text']}")
          PYEOF

      - name: How to read this
        if: always()
        run: |
          echo "Reference line 3: این کلمه مستقیم را نشان می‌دهد؛ بدون پیچیدن به چپ یا راست."
          echo "Reference line 5: و این جمله نشان می‌دهد که یک جا نزدیک است."
          echo
          echo "If large-v3 transcribes «مستقیم» and «جا» correctly where medium"
          echo "did not: the words ARE said correctly, medium's accuracy is the"
          echo "real bottleneck, and switching ASR_MODEL is the fix — not a"
          echo "lib/hear.mjs fold. If large-v3 makes the SAME mistake: it is not"
          echo "a model-accuracy problem, and the words need a human ear."

name: Diagnose and recover the approved comedy
on:
  push:
    branches: [codex/finish-breath-comedy]
    paths: [.github/workflows/breath-recovery.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovery media tools
        run: |
          pip install pillow gradio_client 'huggingface_hub>=0.34'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-42599892804-1
          fail-on-cache-miss: true
      - name: Test one native 720p take with verified included credit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAID_FALLBACK: 'off'
          PYTHONUNBUFFERED: '1'
        run: |
          PYTHONPATH=ai-cast python - <<'PY'
          import json,subprocess,base64,os
          from pathlib import Path
          import cinematic_budget as budget,cinematic_speech as speech
          state=json.loads(Path('.cinematic-series-state.json').read_text())
          plan=state['pending']['plan'];assert plan['episode']==20
          root=Path('renders/cinematic-series-cache/e0020-original-cast-realistic-v1')
          print('RECOVERY_START_QUOTA='+json.dumps(budget.preflight()),flush=True)
          budget.set_scene(20,0)
          try:
              speech.ensure_clip(root/'00.png',root/'00.aligned.wav',root/'00.mp4',
                  plan['scenes'][0]['motion'],20*1009,backend_name='longcat-hq')
              print('FIRST_NATIVE_TAKE_PASSED='+json.dumps(speech.probe(root/'00.mp4')),flush=True)
              subprocess.run(['ffmpeg','-v','error','-y','-ss','2','-i',str(root/'00.mp4'),'-frames:v','1','-vf','scale=540:-1','/tmp/proof.jpg'],check=True)
              print('PROOF_FRAME_BASE64='+base64.b64encode(Path('/tmp/proof.jpg').read_bytes()).decode(),flush=True)
          finally:
              print('RECOVERY_END_QUOTA='+json.dumps(budget.preflight()),flush=True)
              journal=Path('renders/cinematic-series-cache/budgets')/(os.environ['GITHUB_RUN_ID']+'-1.json')
              if journal.exists():print('RECOVERY_LEDGER='+journal.read_text().replace('\n',''),flush=True)
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-recovery-first-take
          path: |
            renders/cinematic-series-cache/e0020-original-cast-realistic-v1/
            renders/cinematic-series-cache/budgets/
          retention-days: 7

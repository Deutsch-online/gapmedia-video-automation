name: Diagnose and recover the approved comedy
on:
  push:
    branches: [codex/finish-breath-comedy]
    paths: [.github/workflows/breath-recovery.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-42599892804-1
          fail-on-cache-miss: true
      - name: Read fresh quota and inspect saved evidence without generation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import sys,json,urllib.request,ast,base64
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'ai-cast')
          from cinematic_budget import preflight
          print('CURRENT_QUOTA='+json.dumps(preflight()))
          path=Path('renders/cinematic-series-cache/budgets/42599892804-1.json')
          print('FAILED_GPU_LEDGER='+path.read_text().replace('\n',''))
          root=Path('renders/cinematic-series-cache/e0020-original-cast-realistic-v1')
          print('SAVED_ASSETS='+json.dumps([p.name for p in root.glob('*')]))
          still=root/'00.png'
          if still.exists():
              image=Image.open(still);print('STILL_SIZE='+str(image.size));image.thumbnail((540,960))
              image.convert('RGB').save('/tmp/first-still.jpg',quality=75)
              print('FIRST_STILL_BASE64='+base64.b64encode(Path('/tmp/first-still.jpg').read_bytes()).decode())
          for url in ['https://huggingface.co/api/spaces/victor/LongCat-Video-Avatar-1.5/runtime','https://huggingface.co/spaces/victor/LongCat-Video-Avatar-1.5/raw/main/app.py']:
              req=urllib.request.Request(url,headers={'User-Agent':'GapMedia-Recovery/1.0'})
              with urllib.request.urlopen(req,timeout=30) as response: value=response.read().decode()
              if '/runtime' in url: print('PROVIDER_RUNTIME='+value)
              else:
                  tree=ast.parse(value)
                  for n in tree.body:
                      if isinstance(n,ast.FunctionDef) and n.name in ('_check_duration','_configure_dit_acceleration'):
                          print('PUBLISHED_PROVIDER_FUNCTION='+ast.get_source_segment(value,n).replace('\n',' | '))
          PY

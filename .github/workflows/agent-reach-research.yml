name: Topic research (Agent Reach)

# Separate from the video builds (owner, 2026-10-04): reads YouTube and the web through Agent Reach, with channels that need
# no login, for the live-research rule of CLAUDE.md. Manual only. It writes research/agent-reach/<date>-<topic>.md and sends a
# digest to the owner's bot chat. It never logs in, never uses cookies, never posts.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "What to research (a topic, an app, a trend)"
        required: true
        type: string
      days:
        description: "How many days back (YouTube results older than this are dropped)"
        required: false
        default: "7"
        type: string

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Agent Reach (pinned, check only) and mcporter
        run: |
          bash scripts/install-agent-reach.sh || true
          npm install -g mcporter
      - name: Research
        env:
          QUERY: ${{ inputs.query }}
          DAYS: ${{ inputs.days }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/agent-reach-research.mjs "$QUERY" "$DAYS"
      - name: Keep the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/agent-reach
          git diff --staged --quiet || git commit -m "research: agent-reach report"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

name: Verify approved storybook duo and bold glass subtitles
on:
  push:
    branches: [codex/storybook-duo-bold-glass]
  pull_request:
    paths:
      - .cinematic-series.json
      - .github/workflows/storybook-design-check.yml
      - ai-cast/cinematic_design.py
      - ai-cast/cinematic_ltx2.py
      - ai-cast/cinematic_longcat.py
      - ai-cast/cinematic_social.py
      - tests/test_cinematic_series.py
      - tests/test_cinematic_longcat.py
      - ai-cast/cinematic_speech.py
      - ai-cast/cinematic-series.py
      - tests/test_cinematic_design.py
      - public/ai-cast/storybook-duo/**
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU-only verification tools
        run: |
          pip install 'pillow>=11,<13' 'edge-tts>=7,<8'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Verify layout, both speakers, actual muxing and provider reservation units
        run: |
          python -m unittest discover -s tests -p test_cinematic_design.py -v
          python -m unittest discover -s tests -p test_cinematic_longcat.py -v
          python -m unittest discover -s tests -p test_cinematic_story_bank.py -v
          python -m unittest discover -s tests -p test_cinematic_graphics.py -v
      - name: Verify live provider maximum without requesting GPU
        run: |
          PYTHONPATH=ai-cast python - <<'PY'
          from cinematic_longcat import verify_live_contract, QUOTA_MAXIMUM
          verify_live_contract()
          print('Verified charged GPU reservation:', QUOTA_MAXIMUM, 'quota units; no generation requested')
          PY
      - name: Verify the next real story with live official research and no GPU
        run: python ai-cast/cinematic-series.py plan-only --file renders/realistic-next-plan.json
      - name: Measure the actual new German voices without requesting GPU
        run: |
          PYTHONPATH=ai-cast python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          plan=json.loads(Path('renders/realistic-next-plan.json').read_text())
          if plan.get('cast_profile')!='lina-oma-v1':
              print('Legacy story: no new-cast voice proof required')
              raise SystemExit(0)
          spec=importlib.util.spec_from_file_location('voice_series','ai-cast/cinematic-series.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          folder=Path('renders/lina-voice-proof');folder.mkdir(parents=True,exist_ok=True)
          rows=[]
          for i,scene in enumerate(plan['scenes']):
              duration=module.measured_narration(scene,folder/f'{i:02}.mp3')
              row={'scene':i,'voice':module.VOICES[scene['speaker']],'duration':duration}
              print(json.dumps(row),flush=True);rows.append(row)
              if not .4<duration<=4.5:
                  raise RuntimeError(f'Actual scene {i} narration exceeds unchanged 4.5s ceiling')
          (folder/'timing.json').write_text(json.dumps({'gpu_requested':False,'scenes':rows},indent=2))
          PY
      - name: Keep a reproducible typography sample
        run: |
          PYTHONPATH=ai-cast python - <<'PY'
          import json
          from pathlib import Path
          from cinematic_design import prepare_captions
          plan={'scenes':[{'de':'Seit Tagen schiebe ich den Anruf auf. Am Telefon verstehe ich zu wenig.',
                           'fa':'چند روز است تماس را عقب می‌اندازم؛ پشت تلفن کم می‌فهمم.'}]}
          folder=Path('renders/bold-glass-design')
          prepare_captions(plan,folder)
          import subprocess
          from cinematic_design import full_frame_layout,glass_filters
          graph='[0:v]'+full_frame_layout()+'[v];'+glass_filters('v',1,2)
          subprocess.run(['ffmpeg','-v','error','-y','-i','public/ai-cast/storybook-duo/reference.png',
              '-i',str(folder/'caption-00.png'),'-i',str(folder/'glass-mask.png'),
              '-filter_complex_threads','1','-filter_complex',graph,'-map','[captioned]',
              '-frames:v','1',str(folder/'preview.jpg')],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-bold-glass-typography
          path: |
            renders/bold-glass-design/
            renders/realistic-next-plan.json
            renders/lina-voice-proof/
          retention-days: 14

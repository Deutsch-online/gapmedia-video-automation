name: Deliver episode 2 TikTok and Instagram exports
on:
  push:
    branches: [main]
    paths: [ai-cast/export-cinematic-episode2.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: recovered-episode2
          run-id: 38894118779
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: renders/cinematic-series
      - name: Export both platforms and deliver once each
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: python ai-cast/export-cinematic-episode2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode2-platforms
          path: |
            renders/cinematic-series/**/*-60s.mp4
            renders/cinematic-series/**/quality.json
            renders/cinematic-series/**/delivery-*.json
          retention-days: 14

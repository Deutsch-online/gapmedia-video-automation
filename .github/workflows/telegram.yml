name: Telegram video runner

# Receives explicit render jobs from the real-time Telegram Worker and acts in
# the cloud — so videos can be ordered from the phone with the PC switched off.
#
# Every action the command parser can return must be handled here. It was not
# once: an earlier listener returned an action this workflow passed straight
# to `--only`, which is a category flag, not an action name. Twelve runs in a
# row failed on "unknown category" before anyone looked.
on:
  push:
    paths:
      - ".video-request.json"
      # A reliable poll trigger, same reasoning and mechanism as daily.yml's
      # .trigger-daily-dispatch — confirmed live 2026-09-08 that this
      # workflow's own "*/5 * * * *" schedule does not fire anywhere near
      # every 5 minutes (real gaps of hours between runs), and workflow_
      # dispatch needs "actions: write" on the GitHub App connected to this
      # repo, which it does not have (git push works, the Actions API
      # 403s). A push here just needs "contents: write", which does work.
      - ".trigger-telegram-poll"
  # No Cloudflare Worker is deployed for this bot right now, so nothing else
  # reads new Telegram messages. This polls instead: every 5 minutes it asks
  # Telegram for updates since the last run (cloud-listen.mjs, the same path
  # workflow_dispatch falls back to below) and acts on the newest command.
  schedule:
    # Hourly, not every five minutes. Measured 2026-09-13: this cron was the
    # main thing starving the other production workflows. GitHub keeps exactly
    # ONE pending run per concurrency group, and daily.yml shares
    # "gapmedia-production" with this file — so during a 30-minute evening
    # render, a run arriving every 5 minutes evicted whatever was queued behind
    # it, six times over. Three separate lesson builds and daily.yml #239 (which
    # carried the image-rescue fix) were cancelled that way in one hour, each
    # having never executed a single step.
    #
    # Nothing is lost by slowing it down: this cron was never the thing that
    # made the listener responsive. Its own header records that it "does not
    # fire anywhere near every 5 minutes (real gaps of hours)", which is
    # precisely why the hourly .trigger-telegram-poll push mechanism exists —
    # and a real Telegram command arrives through that push, not by waiting for
    # this. Slowing the unreliable half removes ~11 of every 12 evictions and
    # changes no delivery state or serialization.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Command sent by the real-time Telegram Worker"
        required: false
        default: ""
        type: string
      pick:
        description: "Approved news item number"
        required: false
        default: "1"
        type: string
      payload:
        description: "Sanitized feature id or user-supplied news text"
        required: false
        default: ""
        type: string
      voice_id:
        description: "Optional MiniMax voice ID selected in Telegram"
        required: false
        default: ""
        type: string
      voice_mode:
        description: "on by default; off only when a Telegram order asks for it"
        required: false
        default: "on"
        type: string

concurrency:
  # Shared with daily.yml: only one path can render while it updates the
  # editorial ledger, preventing a scheduler/Telegram duplicate race.
  group: gapmedia-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    # Includes first-run Whisper download plus a real narrated render.
    timeout-minutes: 75
    steps:
      # Explicit ref, not the implicit github.sha — see news-scan.yml's
      # checkout step for the full real-incident writeup (2026-09-12): a
      # queued run in this same "gapmedia-production" concurrency group can
      # sit waiting long enough that main advances past the commit its
      # trigger event was frozen at, and the default checkout would silently
      # re-check-out that stale commit once it finally runs.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Manual Telegram builds use the same mandatory Persian narration gate
      # as scheduled videos. Model cache keeps repeated commands practical.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-medium-v1
      - name: Install Persian narration quality gate
        run: python -m pip install --disable-pip-version-check --quiet openai-whisper

      # remembers the last message id so one order never runs twice
      - name: Restore command cursor
        uses: actions/cache@v4
        with:
          # Cache the confirmed Telegram delivery history beside the update
          # cursor. Each run has its own key and restores the most recent
          # prior state, so no repository-wide write permission is needed.
          path: |
            .telegram-offset
            .content-history.json
            .content-search-queue.json
            # These are short-lived editorial state files.  Persisting them in
            # the Actions cache avoids requiring `contents: write` just to
            # move from a Telegram preview to an approval.
            .content-draft.json
            # Repeat suppression lives in these two. Without them in the
            # cache each run starts blank: nothing remembers what was
            # offered yesterday or sent today, and the same topic comes
            # back — which is what it did.
            .topic-proposals.json
            .topic-rejected.json
            .topic-offered.json
            .content-search-offered.json
            .content-search-backlog.json
            .content-registry.json
            .content-radar.json
          key: tg-offset-${{ github.run_id }}
          restore-keys: tg-offset-

      - name: Read commands
        id: cmd
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_PICK: ${{ inputs.pick }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
          INPUT_VOICE_ID: ${{ inputs.voice_id }}
          INPUT_VOICE_MODE: ${{ inputs.voice_mode }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # `-f .video-request.json` alone used to gate this branch, which
          # only worked because that was the ONLY push path this workflow
          # listened on — the file being present (which it always is; it is
          # a normal tracked file, not written-then-deleted) was a stand-in
          # for "this push was actually a fresh video request." Adding the
          # .trigger-telegram-poll path above broke that assumption: a poll
          # push would have been misread as a stale video-request replay,
          # so "did THIS commit actually touch that file" became the real
          # signal — first tried via github.event.head_commit.modified/added,
          # but confirmed live 2026-09-08 that field is unreliable (GitHub's
          # push-webhook payload does not guarantee it's populated/accurate):
          # a commit that genuinely, solely modified .video-request.json
          # (verified after the fact via the commits API) still evaluated
          # false. The commits API itself was reliable in that same check,
          # so use it directly instead of trusting the webhook payload.
          IS_VIDEO_REQUEST_PUSH=false
          if [ "$EVENT_NAME" = "push" ]; then
            changed=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$SHA" | jq -r '.files[]?.filename // empty')
            if printf '%s\n' "$changed" | grep -qx '\.video-request\.json'; then IS_VIDEO_REQUEST_PUSH=true; fi
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$IS_VIDEO_REQUEST_PUSH" = "true" ]; then
            request_action=$(jq -r '.action // "none"' .video-request.json)
            # jq emits a final newline.  Trim after flattening it, otherwise
            # a catalogue id such as "tts-voice" reaches the renderer as
            # "tts-voice " and an edit fails before it can start.
            request_payload=$(jq -r '.payload // ""' .video-request.json | tr '\r\n' ' ' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | cut -c1-900)
            request_voice=$(jq -r '.voice_mode // "on"' .video-request.json)
            # content-radar is read-only research (scored shortlist sent to
            # Telegram, nothing built or published) — safe to allow from this
            # push path alongside custom-content. approved-feature builds one
            # specific, already-known bank id (the same action a real
            # "تأیید <id>" Telegram command triggers) — no different in kind
            # from custom-content, which already builds arbitrary content.
            case "$request_action" in custom-content|content-radar|approved-feature|rerender-feature) ;; *) request_action="none" ;; esac
            case "$request_voice" in on|off) ;; *) request_voice="on" ;; esac
            printf 'ACTION=%s\nPICK=1\nPAYLOAD=%s\nVOICE_ID=\nVOICE_MODE=%s\n' "$request_action" "$request_payload" "$request_voice" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_ACTION" ]; then
            case "$INPUT_ACTION" in
              approved-feature|rerender-feature|approved-screen|user-photo|topic-pick|topic-reject|topic-unreject|topic-rejected-list|search-topic-pick|content-preview|content-edit-hook|content-edit-steps|content-approve|content-source-pick|content-topic-preview|build-tiktok|build-instagram|build-tools|build-all|build-tomorrow|build-app-pair|resend|research|content-radar|demand-research|content-search|content-search-live|custom-content|custom-content-media|voice-list|undo|plan-today|plan-tomorrow|plan-week|plan-tiktok|plan-instagram|plan-tools) ;;
              *) echo "ACTION=none" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            safe_pick=$(printf '%s' "$INPUT_PICK" | tr -cd '0-9' | cut -c1-1)
            safe_payload=$(printf '%s' "$INPUT_PAYLOAD" | tr '\r\n' ' ' | cut -c1-900)
            safe_voice=$(printf '%s' "$INPUT_VOICE_ID" | tr -cd 'A-Za-z0-9_.-' | cut -c1-120)
            case "$INPUT_VOICE_MODE" in on|off) safe_voice_mode="$INPUT_VOICE_MODE" ;; *) safe_voice_mode="on" ;; esac
            printf 'ACTION=%s\nPICK=%s\nPAYLOAD=%s\nVOICE_ID=%s\nVOICE_MODE=%s\n' "$INPUT_ACTION" "${safe_pick:-1}" "$safe_payload" "$safe_voice" "$safe_voice_mode" >> "$GITHUB_OUTPUT"
          else
            cl_out=$(node cloud-listen.mjs)
            echo "$cl_out"
            printf '%s\n' "$cl_out" >> "$GITHUB_OUTPUT"
            cl_action=$(printf '%s\n' "$cl_out" | sed -n 's/^ACTION=//p' | tail -1)
            # Opportunistic auto-research: an idle poll (no real Telegram
            # command pending) doubles as the "keep researching, every couple
            # of days" cadence the owner asked for 2026-09-08 — GitHub's own
            # schedule cron is too unreliable (see this file's header) to
            # trust for a bare "every 2 days" cron on its own, but polls
            # already arrive often via the hourly reliability trigger and
            # the */5 schedule, so piggybacking is more reliable than a
            # dedicated cron would be. .content-radar.json (cache-persisted)
            # already carries a timestamp from its last real run — reused as
            # the "last researched" marker instead of a second file. A real
            # pending command always wins; this never overrides one.
            if [ "$cl_action" = "none" ] || [ -z "$cl_action" ]; then
              stale=true
              if [ -f .content-radar.json ]; then
                last=$(jq -r '.at // empty' .content-radar.json)
                if [ -n "$last" ]; then
                  last_epoch=$(date -d "$last" +%s 2>/dev/null || echo 0)
                  now_epoch=$(date -u +%s)
                  age_days=$(( (now_epoch - last_epoch) / 86400 ))
                  [ "$age_days" -lt 2 ] && stale=false
                fi
              fi
              if [ "$stale" = "true" ]; then
                echo "auto content-radar: last run 2+ days ago (or never) — researching now"
                echo "ACTION=content-radar" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      # Only the actions that actually render a video need ffmpeg and a headless
      # browser. Listing news or deleting a message does not.
      - name: System packages (ffmpeg + headless Chrome libs)
        if: contains(fromJSON('["approved-feature","rerender-feature","content-approve","build-tiktok","build-instagram","build-tools","build-all","build-tomorrow","build-app-pair","resend","custom-content","custom-content-media"]'), steps.cmd.outputs.ACTION)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation

      # ---- tutorials -------------------------------------------------------
      - name: Send the fixed daily/weekly schedule for approval
        if: contains(fromJSON('["plan-today","plan-tomorrow","plan-week","plan-tiktok","plan-instagram","plan-tools"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            plan-today)     node topic-plan.mjs --today ;;
            plan-week)      node topic-plan.mjs --week ;;
            plan-tiktok)    node topic-plan.mjs --tomorrow --category=tiktok ;;
            plan-instagram) node topic-plan.mjs --tomorrow --category=instagram ;;
            plan-tools)     node topic-plan.mjs --tomorrow --category=tools ;;
            *)              node topic-plan.mjs --tomorrow ;;
          esac

      # «جستجوی محتوا» (bare) and «جستجوی جدید: X» — the live-search-first
      # discovery engine from the 2026-09-03 content-search rules. Deliberately
      # a separate script from topic-plan.mjs above: that one proposes from the
      # fixed catalogue for the daily/weekly schedule, this one searches live,
      # scores three lanes (income/reach/trend) and reports 5+ real, dated,
      # gated topics every time.
      - name: Live content-search discovery
        if: contains(fromJSON('["content-search","content-search-live"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            content-search-live) node content-search.mjs --query "$PAYLOAD" ;;
            *)                   node content-search.mjs ;;
          esac

      # A bare "۱".."۵" after content-search — routed here by the Worker's own
      # selection-kind check (worker/src/index.js bareTopicPick), not by any
      # allowlist gymnastics here. Builds ONLY a draft (rule 8), never a video.
      - name: Build a draft from a picked content-search topic
        if: steps.cmd.outputs.ACTION == 'search-topic-pick'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: node content-search.mjs --pick "${PICK:-1}"

      - name: Verify content-search draft for cache
        if: steps.cmd.outputs.ACTION == 'search-topic-pick'
        # A missing file here isn't always a real fault: content-search.mjs's
        # own replyOnFailure() already sends the operator a clear Telegram
        # message and exits 0 when the picked number was invalid/stale — that
        # is a correct, graceful decline, not something this step should turn
        # into a red X. A genuine crash still fails earlier steps normally.
        run: |
          if [ -f .content-draft.json ]; then
            echo "content-search draft will be retained by the Actions cache."
          else
            echo "::warning::No draft file — the previous step likely already explained why in Telegram."
          fi

      - name: Free local TTS (pocket-tts)
        if: contains(fromJSON('["approved-feature","rerender-feature","content-approve","build-tiktok","build-instagram","build-tools","build-all","build-tomorrow","build-app-pair","resend","custom-content","custom-content-media"]'), steps.cmd.outputs.ACTION) && steps.cmd.outputs.VOICE_MODE != 'off'
        run: |
          python -m pip install --disable-pip-version-check --quiet pocket-tts
          python - <<'PYEOF'
          import os, pathlib
          from huggingface_hub import snapshot_download
          root = pathlib.Path(snapshot_download("mehdi-hf/pocket-tts-farsi"))
          cfg = next(root.rglob("farsi.yaml"))
          voice = next(root.rglob("example_voice.wav"))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"POCKET_TTS_FARSI_CONFIG={cfg}\n")
              fh.write(f"POCKET_TTS_VOICE={voice}\n")
          print("pocket-tts model ready:", cfg)
          PYEOF

      - name: Build a requested tutorial
        id: tutorial_build
        continue-on-error: true
        if: contains(fromJSON('["approved-feature","rerender-feature","content-approve","build-tiktok","build-instagram","build-tools","build-all","build-tomorrow","build-app-pair","resend","custom-content","custom-content-media"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          PICK: ${{ steps.cmd.outputs.PICK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ steps.cmd.outputs.VOICE_ID || secrets.MINIMAX_VOICE_ID }}
          VOICE_MODE: ${{ steps.cmd.outputs.VOICE_MODE }}
          NARRATION_QC: "on"
          # Same free engine daily.yml and news-scan.yml now use. Without it a
          # Telegram-triggered rebuild would still call MiniMax and die on
          # "insufficient credit" while the scheduled pipeline succeeded —
          # the two paths render the same packs and must not diverge.
          # Persian narration engine. Free, and NOT pocket-tts: pocket failed
          # every narration line of episode 18 against music/voice-qc.mjs on
          # 2026-09-13 («جمله»→«جمعه», «وقتی»→«اختی», «سؤال»→«سهل» — different
          # words, not spellings). Edge is free and keyless too, and is what
          # this repo already used for Persian in render-ai-education-voice.mjs.
          # MiniMax stays reachable with TTS_ENGINE=minimax if its credit
          # returns; it is never the default, because its running out is what
          # stopped delivery.
          TTS_ENGINE: "edge"
          # The offline engine speaks Persian with no credentials at all
          # (proven on a runner, tts-probe.yml run #2, 2026-09-13). It needs
          # this FREE HuggingFace token only for spans written in Latin
          # script — an app name inside an otherwise Persian line — which use
          # the gated kyutai voice-cloning weights. Unset it is an empty
          # string, which behaves exactly as before: pure-Persian lines still
          # synthesise, a Latin span still refuses with a named reason.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ASR_MODEL: "medium"
          RENDER_DIAGNOSTIC_FILE: ".last-render-stage.json"
          # custom-content.mjs's lib/auto-image.mjs needs these to search and
          # relevance-check a real image when the Telegram message was plain
          # text with no attached photo/video.
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "$VOICE_MODE" = "off" ]; then export VOICE="off" REQUIRE_VOICE="off"; else export VOICE="on" REQUIRE_VOICE="on"; fi
          case "${{ steps.cmd.outputs.ACTION }}" in
            approved-feature) node approve-feature.mjs "$PAYLOAD" ;;
            rerender-feature) node daily-render.mjs --feature "$PAYLOAD" --rerender ;;
            content-approve)  node content-draft.mjs --build ;;
            custom-content|custom-content-media) node custom-content.mjs "$PAYLOAD" ;;
            build-app-pair)  node build-current-app-pair.mjs ;;
            build-instagram)  node daily-render.mjs --only instagram ;;
            build-tools)      node daily-render.mjs --only ai-tiktok ;;
            build-all|resend) node daily-render.mjs ;;
            build-tomorrow)   TZ=Europe/Berlin node daily-render.mjs "$(TZ=Europe/Berlin date -d tomorrow +%F)" ;;
            *)                node daily-render.mjs --only tiktok ;;
          esac

      # Keep only a non-sensitive stage label, never raw logs or user text.
      # It makes an opaque cloud failure actionable without exporting runner
      # output or credentials into the repository.
      - name: Record safe build failure stage
        if: steps.tutorial_build.outcome == 'failure'
        run: |
          node -e '
            const fs = require("fs");
            let x = { stage: "unknown-before-render" };
            try { x = JSON.parse(fs.readFileSync(".last-render-stage.json", "utf8")); } catch {}
            // featureId is a public catalogue identifier (not a user message
            // or credential). Keeping it tells us whether the dispatch lost
            // the requested id before daily-render could resolve it.
            fs.writeFileSync(".last-render-stage.json", JSON.stringify({ stage: String(x.stage || "unknown"), featureId: x.featureId || null, reason: x.reason || null, timing: x.timing || null, line: Number.isInteger(x.line) ? x.line : null, faultKind: x.faultKind || null, wordIndex: Number.isInteger(x.wordIndex) ? x.wordIndex : null, at: new Date().toISOString() }, null, 2));
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .last-render-stage.json
          git diff --staged --quiet || git commit -m "diagnostic: record safe render stage"
          git push || { git pull --rebase --autostash && git push; }

      - name: Mark failed tutorial build as failed
        if: steps.tutorial_build.outcome == 'failure'
        run: exit 1

      - name: Preview or edit tutorial draft
        if: contains(fromJSON('["topic-pick","content-preview","content-edit-hook","content-edit-steps"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PICK: ${{ steps.cmd.outputs.PICK }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            topic-pick)          node topic-plan.mjs --preview "${PICK:-1}" ;;
            content-edit-hook)   node content-draft.mjs --edit-hook "$PAYLOAD" ;;
            content-edit-steps)  node content-draft.mjs --edit-steps "$PAYLOAD" ;;
            *)                   node content-draft.mjs --preview ;;
          esac

      - name: Preview selected content source
        if: steps.cmd.outputs.ACTION == 'content-source-pick'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: node source-draft.mjs "${PICK:-1}"

      - name: Analyse creator-supplied tutorial topic
        if: steps.cmd.outputs.ACTION == 'content-topic-preview'
        env:
          # A raw creator topic is expanded into a reviewable draft only.  It
          # never reaches the renderer until the separate content-approve action.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: node custom-draft.mjs "$PAYLOAD"

      - name: Verify tutorial draft for cache
        if: contains(fromJSON('["topic-pick","content-edit-hook","content-edit-steps"]'), steps.cmd.outputs.ACTION)
        # A missing file isn't always a real fault: content-draft.mjs's own
        # replyOnFailure() sends a clear Telegram explanation and exits 0
        # when the picked topic id is invalid/stale (e.g. an offer cached
        # from an earlier run) — a correct decline, not a red X here.
        run: |
          if [ -f .content-draft.json ]; then
            echo "Tutorial draft will be retained by the Actions cache."
          else
            echo "::warning::No draft file — the previous step likely already explained why in Telegram."
          fi

      # ---- real screenshot / broll approval --------------------------------
      # fetch-screens.mjs / fetch-broll.mjs only ever run ahead of time (local
      # or a manual dispatch), never as part of a render — "a person looks" is
      # this step: approve-screen.mjs marks one candidate verified on
      # "تأیید تصویر <id> <شماره>" from Telegram, and content.mjs's
      # verifiedScreenFor() picks it up automatically on the next render.
      # candidates.json is real git-tracked data (not ephemeral state), so the
      # change is committed back the same way news-scan.yml commits its queue
      # — the Actions cache above is for short-lived editorial state only.
      - name: Approve a real screenshot candidate
        if: steps.cmd.outputs.ACTION == 'approved-screen'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          node approve-screen.mjs "$PAYLOAD"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/screens/candidates.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "screens: approve candidate from Telegram"
          git pull --rebase --autostash || true
          git push || true

      # A real screenshot sent straight from the phone (caption = the feature
      # id), for when no official source has the image at all — the direct
      # route PROJECT_RULES §14-د/14-ه calls for. save-user-photo.mjs does its
      # own real-image + minimum-size check (same floor as everything else)
      # and reports the result to Telegram itself; this step only needs to
      # commit whatever it saved, same as the screenshot-approval step above.
      - name: Save an owner-submitted photo
        if: steps.cmd.outputs.ACTION == 'user-photo'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          PHOTO_FILE_ID: ${{ steps.cmd.outputs.PHOTO_FILE_ID }}
        run: |
          node save-user-photo.mjs "$PAYLOAD" "$PHOTO_FILE_ID"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/user-photos/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "photos: save owner-submitted screenshot from Telegram"
          git pull --rebase --autostash || true
          git push || true

      - name: Research digest
        if: steps.cmd.outputs.ACTION == 'research'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node research.mjs

      - name: Content radar — daily scored shortlist
        if: steps.cmd.outputs.ACTION == 'content-radar'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node content-radar.mjs

      # Temporary — content-radar.json is cache-only (never committed), and
      # the owner needs its candidates read from outside Telegram right now.
      # Remove once no longer needed.
      - name: Push content-radar.json for review
        if: steps.cmd.outputs.ACTION == 'content-radar'
        run: |
          if [ -f .content-radar.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f .content-radar.json
            git diff --staged --quiet || git commit -m "debug: publish content-radar.json for review"
            git pull --rebase --autostash || true
            git push || true
          fi

      - name: Send MiniMax voice IDs
        if: steps.cmd.outputs.ACTION == 'voice-list'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Reuses the existing PAYLOAD output — "صداها" alone (PAYLOAD empty)
          # keeps the original Persian-only behaviour; a workflow_dispatch
          # payload like "German" lists that language's voices instead
          # (music/minimax-voices.mjs --lang).
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          if [ -n "$PAYLOAD" ]; then
            node music/minimax-voices.mjs --telegram --lang "$PAYLOAD"
          else
            node music/minimax-voices.mjs --telegram
          fi

      - name: Real search demand for a topic
        if: steps.cmd.outputs.ACTION == 'demand-research'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: node demand.mjs "$PAYLOAD"

      - name: Reject or restore a topic
        if: contains(fromJSON('["topic-reject","topic-unreject","topic-rejected-list"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            topic-reject)        node reject-topic.mjs "${PAYLOAD:-${PICK:-1}}" ;;
            topic-unreject)      node reject-topic.mjs --undo "$PAYLOAD" ;;
            topic-rejected-list) node reject-topic.mjs --list ;;
          esac

      # ---- deleting --------------------------------------------------------
      - name: Undo the last send
        if: steps.cmd.outputs.ACTION == 'undo'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node undo-send.mjs 3 --daily

name: Deliver direct Ludo panel link to owner Telegram
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-ludo-panel-link.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send requested private panel link and comment-mode instructions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,hmac,hashlib,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or os.environ['TELEGRAM_CHAT_ID']
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          admin=hmac.new(os.environ['HF_TOKEN'].encode(),b'ludo-admin-v1:afgtakrun/ludo-live-nations',hashlib.sha256).hexdigest()
          url='https://afgtakrun-ludo-live-nations.hf.space/?panel=1#'+admin
          text='لینک ورود مستقیم به پنل مدیریت لدو:\n\n'+url+'\n\nصفحه را تازه کنید. بالای پنل، بخش «تبدیل گیفت به عدد کامنت» سه دکمهٔ بزرگ دارد:\n\n123 — عدد کامنت: بازی رایگان با کامنت 1، 2، 3 و 4\n🌹 — فقط گیفت\n123 + 🌹 — عدد و گیفت: هر دو فعال\n\nبرای تبدیل به عدد، «عدد کامنت» را بزنید. این لینک خصوصی مدیریت است؛ در لایو نمایش ندهید.\n\nلینک مخصوص نمایش بازی در لایو:\nhttps://afgtakrun-ludo-live-nations.hf.space/screen'
          result=call('sendMessage',{'chat_id':chat,'text':text,'link_preview_options':{'is_disabled':True}})
          print('LUDO_PANEL_LINK_DELIVERED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

name: Publish Crown Panel profile and question timing update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/crown-live106.yml"]
permissions:
  contents: read
concurrency:
  group: crown52-math81-update
  cancel-in-progress: false
jobs:
  update:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CROWN_SPACE: afgtakrun/live-crown-52
      CROWN_ORIGIN: https://afgtakrun-live-crown-52.hf.space
      CROWN_PARENT: 8f884dcdba85ca0020d22eae84e7bae576f7059a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and verify the Space update
        run: |
          pip install 'huggingface_hub>=0.34,<2' cryptography
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          git clone --quiet --depth 1 "https://huggingface.co/spaces/$CROWN_SPACE" /tmp/crown-app
          cd /tmp/crown-app
          test "$(git rev-parse HEAD)" = "$CROWN_PARENT"
          base64 -d "$GITHUB_WORKSPACE/crown-live/update106.patch.gz.b64" | gzip -d > /tmp/crown106.patch
          git apply --check /tmp/crown106.patch
          git apply /tmp/crown106.patch
          git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --check public/math-duel-ui.mjs
          node --check public/quiz-show-view.mjs
          npm test
      - name: Publish and verify the running panel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CROWN_ADMIN_TOKEN: ${{ secrets.CROWN_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, hmac, json, os, pathlib, subprocess, time, urllib.error, urllib.request
          from huggingface_hub import HfApi, CommitOperationAdd
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo, origin, parent = (os.environ[k] for k in ('CROWN_SPACE','CROWN_ORIGIN','CROWN_PARENT'))
          root = pathlib.Path('/tmp/crown-app')
          if api.repo_info(repo, repo_type='space').sha != parent:
              raise SystemExit('Space changed since the patch was verified.')
          # Match the credential derivation used by crown52-hosting/deploy.py at initial provisioning.
          admin = os.environ.get('CROWN_ADMIN_TOKEN') or hmac.new(
              os.environ['HF_TOKEN'].encode(), ('live-crown52-admin-v1:'+repo).encode(), hashlib.sha256).hexdigest()
          request = urllib.request.Request(origin+'/api/admin/state', headers={'Authorization':'Bearer '+admin})
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  current = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'The live Space rejected the recovery request (HTTP {error.code}). No deployment was attempted.') from None
          print('Authenticated and captured the live game state.', flush=True)
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          history_repo='afgtakrun/crown52-question-history-private'
          history=api.repo_info(history_repo,repo_type='dataset')
          if not history.private:
              raise SystemExit('Recovery storage must be private.')
          backup=gzip.compress(json.dumps({'state':current['state'],'revision':current['revision']}).encode())
          nonce=os.urandom(12)
          key=hashlib.sha256(('crown52-deploy-recovery:'+admin).encode()).digest()
          encrypted=nonce+AESGCM(key).encrypt(nonce,backup,None)
          filename='deploy-recovery/'+os.environ['GITHUB_RUN_ID']+'.bin'
          saved=api.create_commit(repo_id=history_repo,repo_type='dataset',commit_message='Save encrypted Crown deployment recovery',
              operations=[CommitOperationAdd(path_in_repo=filename,path_or_fileobj=encrypted)])
          descriptor=json.dumps({'repo':history_repo,'commit':saved.oid,'filename':filename,'revision':current['revision']})
          server=root/'server.mjs'
          source=server.read_text()
          helper=pathlib.Path('crown-live/deployment-recovery106.txt').read_text()
          anchor='try{const data=existsSync(file)?JSON.parse(readFileSync(file)):'
          if source.count(anchor)!=1 or source.count('mathVersion:105')!=1:
              raise SystemExit('Recovery anchors changed in Space source.')
          source=source.replace(anchor,helper.replace('DEPLOYMENT_RECOVERY_DESCRIPTOR',descriptor)+anchor.replace('data=','data=recoveryData||('),1)
          source=source.replace(':null;if(data){game.restore(data.state);revision=data.revision||0}',':null);if(data){game.restore(data.state);revision=data.revision||0;if(recoveryData)restoredDeploymentRevision=revision;}',1)
          source=source.replace('mathVersion:105','mathVersion:105,restoredDeploymentRevision',1)
          source=source.replace("catch{console.log('No valid saved game; starting an empty lobby')}","catch(error){if(recoveryData)throw error;console.log('No valid saved game; starting an empty lobby')}",1)
          server.write_text(source)
          subprocess.run(['node','--check','server.mjs'],cwd=root,check=True)
          tracked = subprocess.check_output(['git','diff','--name-only'], cwd=root, text=True).splitlines()
          files = tracked + ['tests/profile-timing.mjs']
          commit = api.create_commit(repo_id=repo, repo_type='space', parent_commit=parent,
              commit_message='Update quiz profiles, question timing and live closing screen',
              operations=[CommitOperationAdd(path_in_repo=f,path_or_fileobj=str(root/f)) for f in files])
          print('Published Space commit:', commit.oid, flush=True)
          for _ in range(65):
              try:
                  with urllib.request.urlopen(origin+'/fun/control?v=107', timeout=15) as response:
                      html = response.read().decode()
                  with urllib.request.urlopen(origin+'/api/state', timeout=15) as response:
                      state = json.load(response)['state']['fun']['math81']
                  with urllib.request.urlopen(origin+'/health', timeout=15) as response:
                      health = json.load(response)
                  if health.get('restoredDeploymentRevision') == current['revision'] and 'id="liveOutro"' in html and 'data-action="endLive"' in html and 'liveEnded' in state and 'id="settings-profiles"' in html and 'math-duel-ui.mjs?v=107' in html and 'questionBreak' in state and state.get('historyStatus')=='synced':
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Published runtime could not be verified.')
          PY
      - name: Send verified links to the existing private Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat = str(json.load(open('.telegram-bot-chat.json'))['id'])
          def call(method, payload):
              req = urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,
                  data=json.dumps(payload).encode(), headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      reply = json.load(response)
              except Exception:
                  raise SystemExit('Telegram outcome unknown; check the chat before retrying.') from None
              if not reply.get('ok'):
                  raise SystemExit('Telegram delivery was not confirmed.')
              return reply['result']
          if call('getChat', {'chat_id':chat}).get('type') != 'private':
              raise SystemExit('The saved owner chat must be private.')
          origin = os.environ['CROWN_ORIGIN']
          message = ('آپدیت پنل Crown منتشر شد. تنظیم پروفایل‌ها، جشن سه نفر اول، وقفهٔ سؤال‌ها و دکمهٔ ختم لایو فعال است.\n\n'
                     + 'پنل: '+origin+'/fun/control?v=107\n'+'خروجی: '+origin+'/fun/screen?v=107')
          sent = call('sendMessage', {'chat_id':chat,'text':message,'link_preview_options':{'is_disabled':True}})
          print('Telegram message ID:', sent['message_id'])
          PY

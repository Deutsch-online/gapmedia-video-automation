name: Prepare grounded Arzt-anruf story dialogue
on:
  push:
    branches: [codex/arzt-anruf-story-60s]
    paths: [.arzt-anruf-audio.json]
permissions:
  contents: read
concurrency:
  group: arzt-anruf-voice
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache/restore@v4
        with:
          path: renders/arzt-anruf/cache
          key: arzt-anruf-audio-v1-${{ github.run_id }}
          restore-keys: arzt-anruf-audio-v1-
      - name: Generate bounded included-capacity German ElevenLabs dialogue
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
        run: node ai-cast/arzt-anruf/audio.mjs
      - name: Mix the actual full dialogue and separate visible-speaker conditioning
        run: python ai-cast/arzt-anruf/mix.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: renders/arzt-anruf/cache
          key: arzt-anruf-audio-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arzt-anruf-actual-audio
          path: |
            renders/arzt-anruf/story.m4a
            renders/arzt-anruf/conditioning.wav
            renders/arzt-anruf/timing.json
            renders/arzt-anruf/audio-report.json
          retention-days: 14

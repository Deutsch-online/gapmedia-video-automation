name: Fetch the TypeSafe docs

# Manual only, and it uses NO secret. This container's egress policy blocks
# docs.typesafe.ai, so the runner fetches the pages and prints them. Read the
# job log to learn the real API shape, then delete this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the documentation index and the API page
        run: |
          for page in llms.txt api.md primitives.md sdk/javascript.md; do
            echo "=============================================================="
            echo "=== https://docs.typesafe.ai/$page"
            echo "=============================================================="
            curl -sS -L --max-time 30 -w "\n[HTTP %{http_code}]\n" \
              "https://docs.typesafe.ai/$page" | head -c 20000 || echo "(fetch failed)"
            echo
          done

name: Send Ludo LIVE screen link to owner Telegram
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-ludo-live-screen.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested LIVE screen link to private owner chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or os.environ['TELEGRAM_CHAT_ID']
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text='لینک مخصوص نمایش لدو در لایو — نسخهٔ آبی نفتی و بنفش:\n\nhttps://afgtakrun-ludo-live-nations.hf.space/screen\n\nدر TikTok LIVE Studio یا OBS این لینک را در منبع Browser / Website قرار بدهید.\n\nWidth: 1080\nHeight: 1920\nCrop: 0\nFit / Contain — نمایش کامل، بدون برش\n\nپس از جایگزینی لینک، منبع Browser را Refresh کنید. این صفحه فقط بازی را نشان می‌دهد و کلید مدیریت لازم ندارد.'
          result=call('sendMessage',{'chat_id':chat,'text':text,'link_preview_options':{'is_disabled':True}})
          print('LUDO_SCREEN_LINK_DELIVERED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

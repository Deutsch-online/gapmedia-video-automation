name: Read the owner-provided public video reference
on:
  push:
    branches: [codex/reference-zgdx8afme]
    paths: [.reference-read-request.json]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the public link without credentials or generation
        run: |
          mkdir -p /tmp/reference
          node --input-type=module - <<'JS'
          import fs from 'node:fs/promises';
          const requested='https://vm.tiktok.com/ZGdX8AFME/';
          const report={requested,generation_requested:false,credentials_used:false};
          try{
            const r=await fetch(requested,{signal:AbortSignal.timeout(30000)});
            report.http=r.status;report.resolved=r.url;
            const html=await r.text();
            report.page_bytes=html.length;
            const scripts=[...html.matchAll(/<script[^>]*id="(__UNIVERSAL_DATA_FOR_REHYDRATION__|SIGI_STATE)"[^>]*>([\s\S]*?)<\/script>/g)];
            let item=null;
            for(const match of scripts){
              const data=JSON.parse(match[2]);
              item=data.__DEFAULT_SCOPE__?.['webapp.video-detail']?.itemInfo?.itemStruct||Object.values(data.ItemModule||{})[0]||item;
            }
            if(item?.video){
              report.video={id:item.id,description:item.desc,duration:item.video.duration,author:item.author?.uniqueId};
              const cover=item.video.originCover||item.video.cover;
              if(typeof cover==='string'){const c=await fetch(cover,{signal:AbortSignal.timeout(20000)});report.cover_http=c.status;if(c.ok)await fs.writeFile('/tmp/reference/cover.jpg',Buffer.from(await c.arrayBuffer()));}
              for(const track of item.video.subtitleInfos||[]){if(['deu-DE','eng-US'].includes(track.LanguageCodeName)&&typeof track.Url==='string'){const s=await fetch(track.Url,{signal:AbortSignal.timeout(20000)});report['subtitle_'+track.LanguageCodeName]=s.status;if(s.ok)await fs.writeFile('/tmp/reference/'+track.LanguageCodeName+'.vtt',(await s.text()).slice(0,100000));}}
              const media=item.video.playAddr||item.video.downloadAddr;
              if(typeof media==='string'&&media.startsWith('https://')){
                const response=await fetch(media,{signal:AbortSignal.timeout(60000)});
                report.media_http=response.status;
                if(response.ok){
                  const chunks=[];let size=0;
                  for await(const part of response.body){size+=part.length;if(size>28*1024*1024)throw Error('Public reference exceeds the bounded 28MiB download');chunks.push(part);}
                  await fs.writeFile('/tmp/reference/reference.mp4',Buffer.concat(chunks));
                  report.media_bytes=size;
                }
              }
              report.subtitle_tracks=item.video.subtitleInfos?.map(s=>({language:s.LanguageCodeName,format:s.Format}))||[];
            }else{
              report.result='No playable public video metadata returned; no login or access restriction was bypassed';
              if(r.ok){
                try{
                  const embed=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(r.url),{signal:AbortSignal.timeout(20000)});
                  report.oembed_http=embed.status;
                  if(embed.ok){const m=await embed.json();report.public_embed={title:m.title,author_name:m.author_name,author_url:m.author_url,thumbnail_url:m.thumbnail_url};}
                }catch(e){report.oembed_error=e.name;}
              }
            }
          }catch(e){report.error=e.message;}
          await fs.writeFile('/tmp/reference/access-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({http:report.http,media_downloaded:!!report.media_bytes,error:report.error||report.result||null}));
          JS
      - name: Extract visual evidence when the public video was available
        run: |
          if test -f /tmp/reference/reference.mp4; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('/tmp/reference')
          p=root/'reference.mp4'
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(p)]))
          (root/'media-info.json').write_text(json.dumps(info))
          duration=float(info['format']['duration'])
          for i in range(12):
              t=min(duration-.1,i*duration/12)
              subprocess.run(['ffmpeg','-v','error','-ss',str(max(0,t)),'-i',str(p),'-frames:v','1','-q:v','3',str(root/f'frame-{i:02}.jpg')],check=True)
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-reference-read
          path: /tmp/reference
          retention-days: 3

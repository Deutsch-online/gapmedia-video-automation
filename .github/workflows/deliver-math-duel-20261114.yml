name: Deliver requested math duel file
on:
  push:
    paths: [".github/workflows/deliver-math-duel-20261114.yml"]
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send file to owner private bot chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,uuid
          token=os.environ.get('TELEGRAM_BOT_TOKEN')
          if not token: raise SystemExit('Telegram bot is not configured')
          chat=str(json.load(open('.telegram-bot-chat.json'))['id'])
          try:
              info=json.load(urllib.request.urlopen('https://api.telegram.org/bot'+token+'/getChat?chat_id='+chat,timeout=20))
          except Exception:
              raise SystemExit('Cannot verify private Telegram destination')
          if not info.get('ok') or info['result'].get('type')!='private': raise SystemExit('Owner private chat required')
          data=base64.b64decode('')
          boundary='math'+uuid.uuid4().hex
          parts=[]
          caption='نسخه مستقل بازی ریاضی مطابق نمونه: زمان‌سنج، امتیاز و رتبه‌بندی. پاسخ‌ها و هدایا دستی هستند؛ هنوز به تیک‌تاک متصل یا روی Hugging Face نصب نشده است.'
          for key,value in [('chat_id',chat),('caption',caption)]:
              parts.append(('--'+boundary+'\r\nContent-Disposition: form-data; name="'+key+'"\r\n\r\n'+value+'\r\n').encode())
          parts.append(('--'+boundary+'\r\nContent-Disposition: form-data; name="document"; filename="math-duel.html"\r\nContent-Type: text/html\r\n\r\n').encode()+data+b'\r\n')
          parts.append(('--'+boundary+'--\r\n').encode())
          request=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendDocument',data=b''.join(parts),headers={'Content-Type':'multipart/form-data; boundary='+boundary})
          try:
              result=json.load(urllib.request.urlopen(request,timeout=60))
          except Exception:
              raise SystemExit('Telegram delivery outcome unknown; do not automatically retry')
          if not result.get('ok'): raise SystemExit('Telegram did not confirm delivery')
          print('MATH_DUEL_DELIVERED message_id='+str(result['result']['message_id']))
          PY

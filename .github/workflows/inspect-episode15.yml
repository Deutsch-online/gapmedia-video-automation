name: Inspect delivered episode 15
on:
  push:
    branches: [codex/rental-story-45s]
    paths: [.review-episode15-request.json]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13037168409'
          run-id: '41186540110'
          github-token: ${{ github.token }}
          path: /tmp/episode-review
      - uses: actions/upload-artifact@v4
        with:
          name: episode15-visual-evidence
          path: |
            /tmp/episode-review/**/contact.jpg
            /tmp/episode-review/**/quality.json
            /tmp/episode-review/**/episode.json
            /tmp/episode-review/**/graphics-report.json
          retention-days: 3

name: Short 3D comedy preview
on:
  push:
    branches: [main]
    paths: [ai-cast/comedy-preview.py]
permissions:
  contents: write
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check preview code
        run: |
          python -m py_compile ai-cast/cinematic-series.py ai-cast/comedy-preview.py
          node --check ai-cast/send-comedy-preview.mjs
      - name: Install media tools
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts>=7.2,<8' gradio_client pillow 'huggingface_hub>=0.34'
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: comedy-preview-${{ github.run_id }}
          restore-keys: comedy-preview-
      - name: Animate three scenes and send both preview files privately
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          PAID_FALLBACK: 'off'
          PYTHONUNBUFFERED: '1'
        run: python ai-cast/comedy-preview.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: renders/cinematic-series-cache
          key: comedy-preview-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wg-chaos-short-preview
          path: |
            renders/cinematic-series/preview-*/**/*.mp4
            renders/cinematic-series/preview-*/quality.json
            renders/cinematic-series/preview-*/contact.jpg
          retention-days: 14

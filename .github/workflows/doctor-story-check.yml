name: Check 45-second doctor story
on:
  pull_request:
    paths:
      - 'ai-cast/cinematic-series.py'
      - 'ai-cast/cinematic_graphics.py'
      - 'ai-cast/doctor-appointment-45s.json'
      - 'ai-cast/doctor-story-preview.py'
      - 'tests/test_cinematic_graphics.py'
      - '.github/workflows/doctor-story-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only preview tools
        run: |
          python -m pip install 'pillow>=11,<13'
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Check story, mux, lip-sync timing and speech protection
        run: |
          python -m unittest discover -s tests -p 'test_cinematic_*.py' -v
      - name: Render an exact 45-second motion storyboard
        run: python ai-cast/doctor-story-preview.py --output /tmp/doctor-preview
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-storyboard-45s
          path: |
            /tmp/doctor-preview/doctor-storyboard-45s.mp4
            /tmp/doctor-preview/contact.jpg
            /tmp/doctor-preview/preview-report.json
          retention-days: 14

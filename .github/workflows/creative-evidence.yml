name: Read actual creative evidence without generation
on:
  push:
    branches: [main]
    paths: [.github/workflows/creative-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh and read sanitized account evidence without rendering
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const signature=createHash('sha256').update('gapmedia-monitor-v1:'+process.env.TELEGRAM_BOT_TOKEN).digest('hex');
          const root='https://afghanfollowers-telegram.afghan-video-bot.workers.dev';
          const headers={'X-Project-Authorization':signature,'Content-Type':'application/json'};
          const refresh=await fetch(root+'/internal/social-run',{method:'POST',headers,body:'{}',signal:AbortSignal.timeout(150000)});
          console.log('REFRESH_HTTP='+refresh.status);
          const response=await fetch(root+'/internal/creative-feedback',{headers,signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Evidence HTTP '+response.status);
          console.log('ACTUAL_CREATIVE_EVIDENCE='+JSON.stringify(await response.json()));
          JS

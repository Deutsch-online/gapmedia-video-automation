name: Read cached voice for a no-generation cost check
on:
  push:
    branches: [codex/finish-breath-comedy]
    paths: [.github/workflows/breath-cost-evidence.yml]
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-42606624191-1
          fail-on-cache-miss: true
      - name: Read the existing synthetic German speech, no GPU or TTS request
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('renders/cinematic-series-cache/e0020-original-cast-realistic-v1/00.mp3')
          print('CACHED_GERMAN_VOICE_BASE64='+base64.b64encode(p.read_bytes()).decode())
          PY

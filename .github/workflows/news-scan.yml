name: German A1 lesson series

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".trigger-lesson-dispatch"
      - ".german-correction-request.json"
      - ".german-manual-build-request.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Build one episode now, outside the two Berlin slots"
        required: false
        default: "false"
        type: string
      retry_date:
        description: "Berlin date of the scheduled slot to retry (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      retry_batch:
        description: "Scheduled slot to retry: 0500 or 1730"
        required: false
        default: ""
        type: string

concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Select one valid Berlin lesson slot
        id: gate
        shell: bash
        env:
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RETRY_DATE: ${{ inputs.retry_date }}
          INPUT_RETRY_BATCH: ${{ inputs.retry_batch }}
        run: |
          set -euo pipefail
          local_date="$(TZ=Europe/Berlin date '+%Y-%m-%d')"
          local_hm="$(TZ=Europe/Berlin date '+%H:%M')"
          already_sent() {
            test -f .german-lesson-batch-sent.json && grep -Fq "\"$1\"" .german-lesson-batch-sent.json
          }
          # Only the files THIS push carried may start a build.  A request left
          # on disk from an earlier cycle must never be replayed by an
          # unrelated commit.
          changed=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed="$(jq -r '[.commits[]? | .added[]?, .modified[]?] | unique[]?' "$GITHUB_EVENT_PATH" || true)"
          fi
          pushed() { printf '%s\n' "$changed" | grep -Fxq "$1"; }
          go=no
          batch=""
          scheduled=no
          # The owner-approved programme is two Berlin slots a day: 05:00 and
          # 17:30.  A due slot claims the run whatever woke the workflow, so a
          # Worker trigger push and the */15 cron can never both deliver it.
          if [[ "${INPUT_RETRY_BATCH:-}" == "0500" || "${INPUT_RETRY_BATCH:-}" == "1730" ]]; then
            local_date="${INPUT_RETRY_DATE:-$local_date}"
            go=yes; batch="$INPUT_RETRY_BATCH"; scheduled=yes
            echo "Auto Fix is retrying one scheduled slot"
          elif pushed ".german-correction-request.json"; then
            go=yes; batch="correction-$(TZ=Europe/Berlin date '+%H%M')"
            echo "Correction request: rebuilding the episode now"
          elif pushed ".german-manual-build-request.json"; then
            go=yes; batch="manual-$(TZ=Europe/Berlin date '+%H%M')"
            echo "Manual build request: building the next episode now"
          elif [[ "$local_hm" > "05:00" || "$local_hm" == "05:00" ]] && ! already_sent "$local_date-0500"; then
            go=yes; batch=0500; scheduled=yes
          elif [[ "$local_hm" > "17:30" || "$local_hm" == "17:30" ]] && ! already_sent "$local_date-1730"; then
            go=yes; batch=1730; scheduled=yes
          elif [[ "${INPUT_FORCE:-false}" == "true" ]]; then
            go=yes; batch="manual-$(TZ=Europe/Berlin date '+%H%M')"
            echo "Forced build outside the two Berlin slots"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "date=$local_date" >> "$GITHUB_OUTPUT"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "LESSON_MARKER=$local_date-$batch" >> "$GITHUB_ENV"
          echo "Berlin local time: $local_date $local_hm"
          # Auto Fix may only re-dispatch a real slot, never a manual or
          # correction build, so it reads this one line and nothing else.
          if [[ "$scheduled" == "yes" ]]; then
            echo "Selected scheduled slot: $local_date-$batch"
          fi
          echo "Berlin slot decision: $go $local_date $batch"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
      - name: Install video and narration dependencies
        if: steps.gate.outputs.go == 'yes'
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --quiet openai-whisper pocket-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation
      - name: Build, quality-check and deliver one lesson
        if: steps.gate.outputs.go == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "minimax"
          # Owner directive 2026-09-21: "نریشن نباید هیچگاه خاموش باشد".
          # With "off", german-lesson-build.mjs swallowed a TTS failure and
          # shipped the episode music-only — a silent lesson, delivered as if
          # it were finished. german-cycle.mjs's own comment already said this
          # workflow runs with REQUIRE_VOICE=on, and PROJECT_RULES already
          # calls a missing audio file a build error. Now it actually is one.
          REQUIRE_VOICE: "on"
          NARRATION_QC: "off"
          TTS_ENGINE: "minimax"
          GERMAN_WORD_ENGINE: "edge"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ASR_MODEL: "medium"
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Owner directive 2026-09-21: Jev judges vocabulary images first.
          # An unset secret arrives empty and the judge chain simply skips it.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CYCLE_DEADLINE_MINUTES: "44"
        run: node german-cycle.mjs
      - name: Remember the bot chat the preflight learned
        if: always() && steps.gate.outputs.go == 'yes'
        run: |
          if [ -f .telegram-bot-chat.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f .telegram-bot-chat.json
            git diff --staged --quiet || git commit -m "telegram: remember the bot chat"
            git pull --rebase --autostash || true
            git push || true
          fi

      - name: Preserve recovery evidence for the next automatic attempt
        if: failure() && steps.gate.outputs.go == 'yes'
        run: node lib/recovery-chain.mjs
      - name: Record successful delivery and advance lesson state
        if: success() && steps.gate.outputs.go == 'yes'
        run: |
          node -e 'const fs=require("fs");let x=[];try{x=JSON.parse(fs.readFileSync(".german-lesson-batch-sent.json","utf8"))}catch{};const m=process.env.LESSON_MARKER;fs.writeFileSync(".german-lesson-batch-sent.json",JSON.stringify([...new Set([...x,m])].slice(-60),null,2))'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .german-lesson-progress.json .german-lesson-batch-sent.json .german-recovery-exhausted.json lib/narration.mjs lib/german-a1.mjs lib/pronounce.mjs
          git diff --staged --quiet || git commit -m "german-lesson: record delivered episode"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
 

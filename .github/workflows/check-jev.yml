name: Check the Jev API key

# Manual only. It never builds or sends a video, and it never prints the key.
# Run it from the Actions tab to find out whether the stored TypeSafe key
# authenticates and whether Jev can tell a matching image from a wrong one.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the TypeSafe SDK
        run: npm install --no-save @typesafe-ai/sdk@0.6.0
      - name: Ask Jev two image-relevance questions
        env:
          # The SDK's own default variable name, and the secret this
          # repository already holds.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node check-jev.mjs
      - name: Measure Jev on this project's own A1 items
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node test-jev-image-qc.mjs
      - name: Judge this project's own hooks against its own rules
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node test-jev-hook-gate.mjs

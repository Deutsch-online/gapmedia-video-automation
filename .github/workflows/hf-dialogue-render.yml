name: Hugging Face original dialogue animation sample
on:
  push:
    branches: [codex/hf-dialogue-60s]
    paths: [.hf-dialogue-render.json]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gradio_client==2.5.0 huggingface_hub
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download existing authorized ElevenLabs audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dialogue renders/hf-dialogue
          gh api repos/Deutsch-online/gapmedia-video-automation/actions/artifacts/13056352509/zip > /tmp/dialogue/audio.zip
          unzip -q /tmp/dialogue/audio.zip -d /tmp/dialogue/audio
          find /tmp/dialogue/audio -type f -name '*.m4a' -exec cp {} /tmp/dialogue/input.m4a \;
          gh api repos/Deutsch-online/gapmedia-video-automation/actions/artifacts/13088535498/zip > /tmp/dialogue/first.zip
          unzip -q /tmp/dialogue/first.zip -d renders/hf-dialogue
      - name: Generate one genuine audio-conditioned take using included quota only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,shutil,subprocess
          from gradio_client import Client,handle_file
          token=os.environ['HF_TOKEN']
          client=Client('multimodalart/ltx2-audio-to-video',token=token)
          records=[]
          for n in range(4,5):
              req=urllib.request.Request('https://huggingface.co/api/spaces/zero-gpu/quota',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as r:q=json.load(r)
              remaining=q.get('current')
              if not isinstance(remaining,(int,float)) or remaining<115:raise RuntimeError('Included quota insufficient; no paid fallback')
              audio=f'/tmp/dialogue/round-{n+1}.wav'
              subprocess.run(['ffmpeg','-v','error','-y','-ss','55','-i','/tmp/dialogue/input.m4a','-t','5','-ar','24000','-ac','1',audio],check=True)
              prompt='Continuous warm hand-painted 2D animation, fixed camera. The same two adult friends stay on the detailed sunny European street outside a medical practice. LEFT woman in yellow finishes a phrase at the start, both listen quietly, RIGHT man in blue speaks briefly during the last second. All buildings, clinic door, plants and pavement remain clearly visible for the entire clip. Gentle movements, natural expressions, modest lip movements. The shot continues without any transition; the final frame looks like the middle of the same scene.'
              rec={'round':n+1,'model':'multimodalart/ltx2-audio-to-video','declared_gpu_seconds':85,'included_quota_before':remaining,'paid_route':False,'seed':2391+n,'status':'started'}
              records.append(rec)
              try:
                  result=client.predict(handle_file('ai-cast/hf-dialogue/duo.png'),handle_file(audio),prompt,'fade out, fade to white, fade to black, white screen, blank screen, ending, background disappearing, subtitles, captions, text, letters, typography, writing, watermark, logos, lower thirds, garbled symbols, deformed eyes, flicker, face distortion, huge mouth, simultaneous speaking, scene cuts, extra fingers',5.0,2391+n,api_name='/generate')
                  video=result[0]
                  if isinstance(video,dict):video=video.get('video',video).get('path') if isinstance(video.get('video',video),dict) else video.get('video')
                  shutil.copyfile(video,'renders/hf-dialogue/ending-05.mp4')
                  rec['status']='generated'
              except Exception as e:
                  rec['status']='failed';rec['error']=str(e)[:1800];raise
              finally:open('renders/hf-dialogue/receipts.json','w').write(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-original-dialogue-five-scenes
          path: renders/hf-dialogue/
          retention-days: 7

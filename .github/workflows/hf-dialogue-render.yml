name: Hugging Face original dialogue animation sample
on:
  push:
    branches: [codex/hf-dialogue-60s]
    paths: [.hf-dialogue-render.json]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gradio_client==2.5.0 huggingface_hub
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download existing authorized ElevenLabs audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dialogue renders/hf-dialogue
          gh api repos/Deutsch-online/gapmedia-video-automation/actions/artifacts/13056352509/zip > /tmp/dialogue/audio.zip
          unzip -q /tmp/dialogue/audio.zip -d /tmp/dialogue/audio
          find /tmp/dialogue/audio -type f -name '*.m4a' -exec cp {} /tmp/dialogue/input.m4a \;
          gh api repos/Deutsch-online/gapmedia-video-automation/actions/artifacts/13088336285/zip > /tmp/dialogue/first.zip
          unzip -q /tmp/dialogue/first.zip -d renders/hf-dialogue
      - name: Generate one genuine audio-conditioned take using included quota only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,shutil,subprocess
          from gradio_client import Client,handle_file
          token=os.environ['HF_TOKEN']
          client=Client('multimodalart/ltx2-audio-to-video',token=token)
          records=[]
          for n in range(4,5):
              req=urllib.request.Request('https://huggingface.co/api/spaces/zero-gpu/quota',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as r:q=json.load(r)
              remaining=q.get('current')
              if not isinstance(remaining,(int,float)) or remaining<115:raise RuntimeError('Included quota insufficient; no paid fallback')
              audio=f'/tmp/dialogue/round-{n+1}.wav'
              subprocess.run(['ffmpeg','-v','error','-y','-ss',str(n*12),'-i','/tmp/dialogue/input.m4a','-t','12','-ar','24000','-ac','1',audio],check=True)
              prompt='Warm hand-painted 2D storybook animation with original recorded German audio. Two adult friends stand on a sunny European cobblestone street outside the same medical practice. Throughout all twelve seconds preserve the reference background: buildings, trees, plants, pavement, clinic door and green medical cross stay visible. Fixed camera, continuous single take, preserve exact character sizes and screen positions. The woman on the LEFT in yellow cardigan speaks at 0-2 seconds. The man on the RIGHT in blue jacket answers at 2-5 seconds. The woman repeats at 6-9 seconds. The man praises briefly at 11 seconds. Only one speaker moves their lips at a time, the listener listens with closed mouth. Gentle supportive gestures, subtle nods, stable expressive eyes, restrained mouth movement. Clean uninterrupted illustrated scene, blank surfaces, natural clothing.'
              rec={'round':n+1,'model':'multimodalart/ltx2-audio-to-video','declared_gpu_seconds':85,'included_quota_before':remaining,'paid_route':False,'seed':2191+n,'status':'started'}
              records.append(rec)
              try:
                  result=client.predict(handle_file('ai-cast/hf-dialogue/duo.png'),handle_file(audio),prompt,'white background, empty background, blank studio, background disappearing, scene transition, cutaway, subtitles, captions, text, letters, typography, writing, watermark, logos, lower thirds, garbled symbols, deformed eyes, flicker, face distortion, huge mouth, simultaneous speaking, scene cuts, extra fingers',12.0,2191+n,api_name='/generate')
                  video=result[0]
                  if isinstance(video,dict):video=video.get('video',video).get('path') if isinstance(video.get('video',video),dict) else video.get('video')
                  shutil.copyfile(video,f'renders/hf-dialogue/round-{n+1:02d}.mp4')
                  rec['status']='generated'
              except Exception as e:
                  rec['status']='failed';rec['error']=str(e)[:1800];raise
              finally:open('renders/hf-dialogue/receipts.json','w').write(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-original-dialogue-five-scenes
          path: renders/hf-dialogue/
          retention-days: 7

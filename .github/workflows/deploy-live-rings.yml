name: Deploy Live Rings Studio on free CPU
on:
  push:
    branches: [main]
    paths:
      - live-rings/**
      - .github/workflows/deploy-live-rings.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-rings-free-hosting
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test ranking and private panel
        working-directory: live-rings
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2' cryptography
      - name: Deploy on explicitly free CPU-basic
        working-directory: live-rings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy.py

name: Assemble reviewed Aryana motion on CPU without additional GPU spending
on:
  push:
    branches: [delivery/aryana-hf-20261029]
    paths: [aryana-hosting/assembly-request.json]
permissions:
  contents: write
concurrency:
  group: aryana-motion-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check mediapipe==0.10.32 opencv-python-headless==5.0.0.93
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -c "import urllib.request; urllib.request.urlretrieve('https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task', '/tmp/aryana-face-landmarker.task')"
      - name: Assemble and verify the reviewed motion joins
        env:
          MPLCONFIGDIR: /tmp/aryana-mpl
        run: python aryana-hosting/assemble-motion-release.py
      - name: Save the verified release on its isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add aryana-hosting/motion-release
          git commit -m 'Stage reviewed sixty-second Aryana video with sparse natural blinks'
          git pull --rebase origin delivery/aryana-hf-20261029
          git push origin HEAD:delivery/aryana-hf-20261029
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aryana-reviewed-motion
          path: aryana-hosting/motion-release
          retention-days: 3

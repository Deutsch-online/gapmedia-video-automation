name: Verify one usable lightweight speaking take within included quota
on:
  push:
    branches: [codex/light-breath-production]
    paths: [.github/workflows/light-breath-proof.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model client and CPU media tools
        run: |
          pip install pillow gradio_client 'huggingface_hub>=0.34'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: recovery-preview-and-preserved-source
          run-id: 42612659924
          github-token: ${{ github.token }}
          path: renders
      - name: Reuse the HD take and create the next real light take
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAID_FALLBACK: 'off'
          PYTHONUNBUFFERED: '1'
        run: |
          PYTHONPATH=ai-cast python - <<'PY'
          import json,hashlib,os,base64,subprocess
          from pathlib import Path
          from PIL import Image
          from gradio_client import handle_file
          import shots,cinematic_budget as budget,cinematic_speech as speech,cinematic_design as design
          state=json.loads(Path('.cinematic-series-state.json').read_text())
          plan=state['pending']['plan'];assert plan['episode']==20
          root=Path('renders/cinematic-series-cache/e0020-original-cast-realistic-v1')
          print('LIGHT_START_QUOTA='+json.dumps(budget.preflight()),flush=True)
          old_hash=speech.audio_sha(root/'00.mp4')
          os.environ['CINEMATIC_CACHED_ONLY']='on'
          speech.ensure_clip(root/'00.png',root/'00.aligned.wav',root/'00.mp4',plan['scenes'][0]['motion'],20*1009,backend_name='longcat-light')
          os.environ.pop('CINEMATIC_CACHED_ONLY')
          assert speech.audio_sha(root/'00.mp4')==old_hash
          print('HIGH_TAKE_REUSED_WITHOUT_GENERATION=true',flush=True)
          scene=plan['scenes'][1];seed=20*1009+11
          budget.set_scene(20,1)
          ref=Path('public/ai-cast/wg-chaos/characters.png')
          prompt=design.still_prompt(plan,scene)
          if not (root/'01.png').exists():
              def still():
                  return shots.first_working(shots.KONTEXT[:1],{'input_image':handle_file(str(ref)),
                    'prompt':prompt,'seed':seed,'randomize_seed':False,'guidance_scale':2.5,'steps':24},'light recovery still')
              result=budget.run_gpu(still,required_seconds=120)
              Image.open(result).convert('RGB').save(root/'01.png')
              ref_hash=hashlib.sha256(ref.read_bytes()*2).hexdigest()
              (root/'01.sig').write_text(design.image_signature(ref_hash,prompt,seed))
          try:
              speech.ensure_clip(root/'01.png',root/'01.aligned.wav',root/'01.mp4',scene['motion'],seed,backend_name='longcat-light')
              print('LIGHT_TAKE_PASSED='+json.dumps(speech.probe(root/'01.mp4')),flush=True)
              subprocess.run(['ffmpeg','-v','error','-y','-ss','2','-i',str(root/'01.mp4'),'-frames:v','1','-vf','scale=540:-1','/tmp/light-proof.jpg'],check=True)
              print('LIGHT_FRAME_BASE64='+base64.b64encode(Path('/tmp/light-proof.jpg').read_bytes()).decode(),flush=True)
          finally:
              print('LIGHT_END_QUOTA='+json.dumps(budget.preflight()),flush=True)
              journal=Path('renders/cinematic-series-cache/budgets')/(os.environ['GITHUB_RUN_ID']+'-1.json')
              if journal.exists():print('LIGHT_LEDGER='+journal.read_text().replace('\n',''),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-light-recovery-assets
          path: |
            renders/cinematic-series-cache/e0020-original-cast-realistic-v1/
            renders/cinematic-series-cache/budgets/
          retention-days: 30

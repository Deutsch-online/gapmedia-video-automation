name: Veo test (one short clip, manual)
# Owner approved one short test on 2026-10-10. One 4 s clip with Veo 3.1 Lite from the approved boss picture; it may bill the Google account.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  veo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: One Veo clip (log goes to the file, the key is never printed)
        run: mkdir -p ai-cast/veo-test && node scripts/veo-test.mjs 2>&1 | tee ai-cast/veo-test/log.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Keep the result in the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ai-cast/veo-test
          git diff --staged --quiet || git commit -m "veo test: result"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

name: Die Suppe (Hugging Face phone call, manual)

# Owner request 2026-10-07: "Was macht Opa?" built here because the Google Vids limit is used up. Manual only: free ZeroGPU quota first, then the
# PRO quota; PAID_FALLBACK stays off (no extra cost); no lip-sync (the girl narrates). Sent to the owner's bot chat only, in three formats.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Paid-credit guard in USD for this run (the free and PRO GPU quotas are used first)"
        required: false
        default: "1.00"
        type: string

concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  suppe:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --quiet gradio_client pillow 'huggingface_hub>=0.34'
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation
      - name: Restore the Suppe shots
        uses: actions/cache/restore@v4
        with:
          path: renders/series-shots
          key: series-shots-su-${{ github.run_id }}
          restore-keys: |
            series-shots-su-
      - name: Build and deliver the episode
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAID_FALLBACK: "off"      # owner, 2026-10-05: no extra cost, only the free and the PRO GPU quota
          # real lip-sync for the shots where the visible character speaks (LongCat-Video-Avatar on a ZeroGPU Space)
          LIPSYNC: "on"
        run: node suppe-build.mjs
      - name: Keep the Suppe shots for the next render
        if: always()
        uses: actions/cache/save@v4
        with:
          path: renders/series-shots
          key: series-shots-su-${{ github.run_id }}
      - name: Contact sheet of the finished stills (so the pictures can be checked even when the quota stops the run)
        if: always()
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw
          fs = sorted(glob.glob("renders/series-shots/**/*.png", recursive=True), key=lambda f: (len(os.path.basename(f)), f))
          fs = [f for f in fs if not os.path.basename(f).startswith("ref-")]
          if fs:
              W, H, cols = 288, 512, 6
              rows = (len(fs) + cols - 1) // cols
              sh = Image.new("RGB", (cols * W, rows * H), "#222")
              d = ImageDraw.Draw(sh)
              for i, f in enumerate(fs):
                  sh.paste(Image.open(f).convert("RGB").resize((W, H)), ((i % cols) * W, (i // cols) * H)); d.text(((i % cols) * W + 8, (i // cols) * H + 8), os.path.basename(f), fill="#FFF")
              os.makedirs("ai-cast/contact", exist_ok=True); sh.save("ai-cast/contact/suppe-stills.jpg", quality=88); print("stills:", len(fs))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ai-cast/contact
          git diff --staged --quiet || git commit -m "suppe: stills sheet"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Measure the finished videos (QC report with numbers and a contact sheet)
        if: success()
        run: bash scripts/qc-renders.sh "renders/suppe/$(date -u +%F)"
      - name: Keep the contact sheet
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ai-cast/contact qc
          git diff --staged --quiet || git commit -m "suppe: contact sheet"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

name: Complete the one owner-authorized final clip
on:
  push:
    branches: [main]
    paths: [.cinematic-paid-final-trigger.json]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing media tools and verify the one-call paid scope
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts>=7.2,<8' gradio_client 'pillow==12.3.0' 'huggingface_hub>=0.34'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core
          python -m unittest discover -s tests -p test_paid_episode_completion.py -v
      - uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: protected-final-e23-${{ github.run_id }}
          restore-keys: |
            cinematic-series-v2-43701348347-1
      - name: Complete only the last signed-plan clip and deliver both private outputs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          PAID_FALLBACK: 'off'
          FREE_FIRST: 'off'
          PYTHONUNBUFFERED: '1'
        run: python ai-cast/paid_episode_completion.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-final-completion-${{ github.run_id }}
          path: |
            renders/cinematic-series/
            renders/cinematic-series-cache/budgets/
            .cinematic-paid-final-request.json
          retention-days: 30

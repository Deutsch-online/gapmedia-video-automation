name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="سرگرمی پروفایل به‌روز شد و آنلاین بررسی شد.\n\nپنل موبایل و کمپیوتر:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=52\n\nنمای TikTok LIVE Studio (1080×1920):\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=52\n\nرمز همان رمز قبلی است.\n\nتنظیم زمان عکس در پنل:\n• بخش «مدت ماندن عکس بیننده» اضافه شد.\n• خودکار: تازه‌وارد60 ثانیه و فرد فعال180 ثانیه پس از آخرین فعالیت.\n• زمان دلخواه: مدت تازه‌وارد و مدت پس از فعالیت را جدا از5 تا3600 ثانیه تنظیم کنید.\n• «ذخیرهٔ زمان عکس» یا دکمهٔ اصلی «ذخیرهٔ تنظیمات» را بزنید. تنظیم پس از بازکردن دوبارهٔ پنل و بازیابی سرور حفظ می‌شود.\n• با ذخیره، زمان عکس‌های فعلی نیز بر اساس زمان ورود/آخرین فعالیت تنظیم می‌شود؛ هر فعالیت زمان فرد فعال را تمدید می‌کند.\n\nکارت‌ها و ورود:\n• کارت خالیِ معمولی روی اسکرین دیده نمی‌شود؛ فقط کارت افراد اطراف جایگاه دیده می‌شود.\n• کارت تازه‌وارد از کنار جایگاه با چرخش سه‌بعدی وارد می‌شود و تا پایان زمان تعیین‌شده می‌ماند.\n• اگر خانه‌ها پر باشند، فرد فعالِ منتظر جای فرد بی‌فعالیت را می‌گیرد؛ افراد فعال برای تازه‌وارد بی‌فعالیت حذف نمی‌شوند.\n\nجایگاه و نمایش دو طرف:\n• نفر واقعیِ فعال وسط و روی کارت تاج قرار می‌گیرد؛ نمایش خودکارِ دو طرف روشن می‌ماند.\n• با فعال‌شدن نفر دوم، فقط یک طرف به فرد واقعی تبدیل می‌شود؛ نفر سوم طرف دیگر را می‌گیرد.\n• شخصیت‌های نمایشی و امتیازهای آن‌ها وارد حساب یا تاریخچهٔ افراد واقعی نمی‌شوند.\n• رتبه‌ها با امتیاز تغییر می‌کنند؛ مساوی‌شدن تاج را عوض نمی‌کند. تغییر رتبه واکنش5ثانیه‌ایِ متفاوت با موشن، صدا و شکلک مثبت دارد و تزئین پروفایل با فعالیت رشد می‌کند.\n\nشروع خودکار و کنترل دستی مدت/توقف/ادامهٔ دور حفظ شده‌اند. جدول فعالیت زنده هنگام توقف تایمر هم واکنش دارد؛ امتیاز مسابقهٔ زمان‌دار هنگام اجرای تایمر ثبت می‌شود.\nامتیاز: لایک1، کامنت10، هر کوین گیفت10.\n\nتست بدون لایف: زمان دلخواه را ذخیره کنید، «تست ورود تازه» و بعد «تست کامنت» را بزنید. با یک فرد واقعی باید دو شخصیت نمایشیِ اطراف همچنان امتیاز و موشن داشته باشند."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

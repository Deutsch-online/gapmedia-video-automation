name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="سرگرمی پروفایل به‌روز شد و آنلاین بررسی شد.\n\nپنل موبایل و کمپیوتر:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=51\n\nنمای TikTok LIVE Studio (1080×1920):\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=51\n\nرمز همان رمز قبلی است.\n\nورود و صف:\n• عکس همهٔ تازه‌واردها به‌ترتیب در خانه‌های کارت دیده می‌شود و یک دقیقه کامل می‌ماند؛ پس از معرفی محو نمی‌شود.\n• لایک، کامنت یا گیفت، ماندن پروفایل را تا3 دقیقه پس از آخرین فعالیت تمدید می‌کند.\n• فرد بی‌فعالیت پس از پایان یک دقیقه حذف می‌شود.\n• اگر52 خانه پر باشد، فرد فعالِ منتظر فوراً جای قدیمی‌ترین فرد بی‌فعالیت را می‌گیرد. افراد فعال برای تازه‌وارد بی‌فعالیت حذف نمی‌شوند. اگر همه فعال باشند، صف حفظ می‌شود.\n\nرتبه و واکنش:\n• ترتیب جایگاه‌ها بر اساس امتیاز است؛ تاج بالاترین امتیاز را دارد و با مساوی‌شدن منتقل نمی‌شود.\n• بالا رفتن و پایین آمدن رتبه، واکنش5ثانیه‌ای با موشن، صدا و شکلک‌های مثبت مثل قدرت، شادی، انرژی و تشویق دارد. حرکت‌ها چندنوع هستند.\n• واکنش رتبه با تغییر امتیاز قطع نمی‌شود و پس از5ثانیه جمع می‌شود.\n• تزئینات پروفایل و کارت‌های برتر با افزایش امتیاز رشد می‌کنند؛ نور و ذرات دور قاب‌اند تا صورت واضح بماند.\n\nشروع خودکار، کنترل دستی مدت/شروع/توقف/ادامه، کارت بزرگِ تازه‌وارد زیر جدول و نمایش CROWN ARENA هنگام سکوت حفظ شده‌اند.\n\nامتیاز: لایک1، کامنت10، هر کوین گیفت10. جدول فعالیت زنده هنگام توقف تایمر هم واکنش دارد؛ امتیاز مسابقهٔ زمان‌دار هنگام اجرای تایمر ثبت می‌شود.\n\nنمایش زمان سکوت پس از20ثانیه فعال می‌شود، امتیازهای نمایشی افزایش می‌یابند و هر60ثانیه جایگاه عوض می‌شود. اولین فعالیت واقعی فوراً جدول واقعی را برمی‌گرداند و امتیاز نمایشی وارد تاریخچهٔ واقعی نمی‌شود.\n\nتست بدون لایف: «تست ورود تازه» را چند بار بزنید؛ عکس‌ها باید داخل کارت بمانند. سپس «تست کامنت» را برای دیدن رتبه و واکنش بزنید."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          origin='https://afgtakrun-live-crown-52.hf.space'
          def read_app(path):
              with urllib.request.urlopen(origin+path,timeout=30) as response:return response.read()
          for attempt in range(120):
              try:
                  health=json.loads(read_app('/health'))
                  if health.get('build')=='7544031a30f4d3745c67b9ebb55eb411cce06bc2':break
              except Exception:pass
              time.sleep(10)
          else:raise RuntimeError('Expected bubble68 deployment is not ready')
          html=read_app('/fun/control?v=68').decode()
          for element in ['profileTestTab','profilePreviewDialog','repeatProfilePreview','growProfilePreview','closeProfilePreview']:
              if ('id="'+element+'"') not in html:raise RuntimeError('Missing deployed preview control: '+element)
          css=read_app('/portrait.css?v=68').decode()
          if 'body.test-only' not in css or '.profile-preview-dialog' not in css:raise RuntimeError('Updated bold preview styles missing')
          state=json.loads(read_app('/api/state'))['state']
          if state['admission']['entryMode']!='comment' or state['admission']['minCoins']!=0:raise RuntimeError('Free play enforcement missing')
          if 'policyArchive' in state:raise RuntimeError('Private policy archive exposed')
          if b'QUIZ_BANK' not in read_app('/question-bank.mjs'):raise RuntimeError('Question bank missing')
          if b'welcome' not in read_app('/welcome-scripts.mjs'):raise RuntimeError('Welcome variety missing')
          manifest=json.loads(read_app('/narration-manifest.json'))
          if len(manifest)!=20:raise RuntimeError('Expected20 narrator clips')
          print('CROWN68_RESOURCES_VERIFIED '+json.dumps({'build':health['build'],'clips':len(manifest)}))
          text="نسخه68 — حباب‌های سرگرمی\n\nپنل:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=68\n\nنمای TikTok LIVE Studio:\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=68\n\nتست خصوصی:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?tab=test&v=68\n\nرمز قبلی حفظ است. پنل و منبع Browser/Link در Studio را رفرش کنید.\n\n• سه جایگاه دایره‌ای و تا12حباب پایین؛ امتیاز داخل حباب و پایین عکس، دور از صورت است.\n• وقتی تعداد کم است حباب‌ها بزرگ‌ترند؛ در شلوغی فقط غیرفعال‌ها کوچک می‌شوند. فضای اضافه در انتظار می‌ماند.\n• فعالیت واقعی: هر لایک1، هر کوین گیفت1و پاسخ درست10امتیاز. ورود رایگان است؛ درخواست صوتی گیفت، لایک یا فالو وجود ندارد. جایزهٔ نقدی یا قابل‌تبدیل وجود ندارد.\n• مرحله1: یک کوین یا100لایک؛ مرحله2: ده کوین یا500لایک. تا8مرحله، با نور، حرکت و تزیین بیشتر.\n• تازه‌وارد بدون فعالیت60ثانیه می‌ماند. هر فعالیت60ثانیه حرکت را تمدید می‌کند؛ سپس60ثانیه فریز و از رقابت خارج می‌شود؛ پس از120ثانیه بدون فعالیت حذف می‌شود. خروج فقط در صورت دریافت رویداد آن قابل تشخیص است.\n• فارسی/انگلیسی از گزینهٔ «زبان نمایش و گوینده»؛ انتخاب ذخیره می‌شود و صفحه و صدا باهم تغییر می‌کنند.\n•221پرسش دوزبانه؛ یک پرسش تا حداقل یک ساعت تکرار نمی‌شود، حتی با شروع دور جدید.\n•240ترکیب خوش‌آمد در هر زبان؛ حداکثر هر30ثانیه یک فرد واقعی. عدد و علامت از نام گفتاری حذف می‌شود.\n• تصاویر نمایشی نام‌های انسانی متفاوت دارند و با برچسب PREVIEW از افراد واقعی جدا هستند؛ آمار ساختگی به حساب افراد واقعی اضافه نمی‌شود.\n• تست خصوصی برای صدا، موشن، مرحله‌ها و فریز، بدون تغییر بازی زنده.\n\nاتصال به سرور به‌تنهایی اثبات دریافت کمنت/لایک نیست. بخش عیب‌یابی تعداد رویدادهای همین اجرای سرور را نشان می‌دهد. این نسخه محدودیت TikTok یا سرویس دریافت رویداد را دور نمی‌زند و تضمین رفع اخطار قبلی نیست."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

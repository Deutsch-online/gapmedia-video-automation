name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="نسخه55 سرگرمی پروفایل منتشر و بررسی شد.\n\nپنل موبایل و کمپیوتر:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=55\n\nنمای TikTok LIVE Studio (1080×1920):\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=55\n\nرمز همان رمز قبلی است.\n\nمدیریت جایگاه‌ها:\n• در پنل، بخش «مدیریت جایگاه‌ها» کاربر مقام1،2 یا3 را انتخاب و «قرار بده» را بزنید؛ تغییر فوراً در اسکرین دیده می‌شود.\n• اگر فرد در جایگاه دیگری باشد، دو نفر جابه‌جا می‌شوند. امتیاز واقعی با تغییر جایگاه عوض نمی‌شود؛ برنده مسابقه طبق امتیاز واقعی است.\n• «حذف پروفایل» فرد را از نمایش و رقابت همین دور حذف می‌کند. تا «بازگرداندن کاربر» را نزنید، با ورود یا فعالیت دوباره ظاهر نمی‌شود. سابقه لایک و گیفت او حفظ می‌شود.\n• «بازگرداندن کاربر» پروفایل را برمی‌گرداند؛ امتیاز تازه با فعالیت تازه ثبت می‌شود.\n• «برگشت به چیدمان خودکار» همه جایگاه‌های دستی را آزاد می‌کند تا رتبه‌ها با فعالیت تغییر کنند.\n• این دکمه‌ها فوری‌اند و به ذخیره جداگانه نیاز ندارند.\n\nقاب و خوانایی:\n• هر سه جایگاه از همان فایل قاب لیگ فوتبال استفاده می‌کنند؛ عکس تمام قاب را پُر می‌کند و مربع داخلی ندارد.\n• نام و امتیاز بالاتر از لبه قاب و خوانا هستند.\n• کارت‌های زیر جایگاه بلندتر و شش‌ستونی شده‌اند. اگر بیش از24 نفر باشند، نما هر12ثانیه عوض می‌شود؛ ظرفیت52 نفر حفظ است.\n• زیر جایگاه فقط پروفایل‌ها برجسته‌اند؛ امتیاز فقط روی سه کارت جایگاه دیده می‌شود.\n\nکشور:\n• هنگام ورود به جایگاه، write your Country فقط30ثانیه دیده می‌شود؛ فعالیت عادی زمانش را تمدید نمی‌کند.\n• کاربر نام کشور، مخفف انگلیسی/لاتین، فارسی/عربی یا ایموجی پرچم را کامنت کند؛ نام کشور روی عکس و پرچم در نشان طلایی ظاهر می‌شود.\n• کشور از گفته خود کاربر ثبت می‌شود و با فعالیت و بازیابی حفظ می‌شود.\n• در پایان، برنده همراه پیام فالو و علامت مثبت معرفی می‌شود.\n\nزمان عکس:\n• در «مدت ماندن عکس بیننده»، خودکار60ثانیه برای تازه‌وارد و180ثانیه پس از آخرین فعالیت است.\n• حالت دلخواه: دو زمان را جداگانه از5 تا3600ثانیه تنظیم و «ذخیرهٔ زمان عکس» را بزنید. هر فعالیت زمان فرد فعال را تمدید می‌کند.\n• تازه‌وارد از کنار جایگاه با چرخش وارد می‌شود؛ فرد فعال منتظر می‌تواند جای فرد بی‌فعالیت را بگیرد.\n• با یک فرد واقعی، نمایش دو طرف ادامه دارد؛ شخصیت‌های نمایشی وارد امتیاز و تاریخچه واقعی نمی‌شوند.\n\nتایمر دستی و شروع خودکار دور بعد حفظ است؛ مدت فعلی شما تغییر نکرده. جدول فعالیت زنده هنگام توقف هم واکنش دارد، اما امتیاز مسابقه هنگام اجرای تایمر ثبت می‌شود.\nامتیاز: لایک1، کامنت10، هر کوین گیفت10.\nموسیقی و صدای کارت جداگانه قابل کنترل‌اند.\n\nبرای دریافت نسخه تازه، پنل را رفرش و دکمه «رفرش نمای لایف» را بزنید.\nتست بدون لایف: «تست ورود تازه» و «تست کامنت»؛ سپس مدیریت جایگاه‌ها را امتحان کنید."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

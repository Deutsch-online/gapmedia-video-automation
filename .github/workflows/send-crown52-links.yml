name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="نسخهٔ نهایی لیگ فوتبال آماده و تست شد.\n\nپنل کنترل:\nhttps://afgtakrun-live-crown-52.hf.space/league/control?v=40\n\nنمای مخصوص TikTok LIVE Studio، کاملاً بی‌صدا:\nhttps://afgtakrun-live-crown-52.hf.space/league/screen?studio=1&v=40\n\nمنبع لینک قدیمی بازی را حذف و همین منبع را جایگزین کنید تا صدای پنجرهٔ قدیمی باقی نماند. اندازه: 1080 × 1920، سپس Fit to screen.\n\n• شروع لیگ و دور بعد خودکار است.\n• انتخاب تیم با عدد 1 تا 12، نام یا مخفف باشگاه؛ هر کامنت معتبر 10 امتیاز.\n• یک Rose برابر 10 امتیاز؛ هر کوین گیفت 10 امتیاز به تیم انتخاب‌شدهٔ همان کاربر اضافه می‌کند.\n• هنگام سکوت، نمایش خودکار تیم‌ها امتیاز و برنده نشان می‌دهد؛ امتیازهای واقعی محفوظ‌اند و با بازگشت بیننده بازی واقعی ادامه می‌یابد.\n• شمارندهٔ کامنت، لایک و گیفت در پنل اضافه شده است.\n• موسیقی، صدای مصنوعی کارت‌ها و گوینده فعلاً همگی غیرفعال‌اند.\n\nاتصال لایف @familydramaaf دوباره برقرار شد؛ ورود واقعی دریافت شد.\n\nبا همان رمز پنل وارد شوید؛ تنظیمات با دکمهٔ ذخیره ثبت می‌شوند."
          result=call('sendMessage',{'chat_id':chat,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_DELIVERED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

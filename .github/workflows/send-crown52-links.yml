name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Update owner private guide after verified battle deployment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error
          origin='https://afgtakrun-live-crown-52.hf.space'
          expected='4548c68a35cd069727d6a9f914e55a9877e7b75b'
          def read(path):
              with urllib.request.urlopen(origin+path,timeout=30) as r:return r.read()
          for attempt in range(120):
              try:
                  health=json.loads(read('/health'))
                  if health.get('build')==expected and health.get('arenaVersion')==78:break
              except Exception:pass
              time.sleep(10)
          else:raise RuntimeError('Expected profile battle build is not ready')
          state=json.loads(read('/api/state'))['state']
          if state['fun']['profileRound'].get('gameMode')!='battle':raise RuntimeError('Question-free mode missing')
          arena=state['fun'].get('arena78',{})
          if len(arena.get('bots',[]))!=8:raise RuntimeError('Eight-character arena missing')
          if any('pairs' in arena or 'seen' in arena for _ in [0]):raise RuntimeError('Internal hit receipts exposed')
          if any(p.get('photoIndex') in [1,2,4] for p in arena['bots']):raise RuntimeError('Uncurated photograph still active')
          html=read('/fun/control?v=78').decode()
          if 'id="profileTestTab"' not in html:raise RuntimeError('Test tab missing')
          if b'testArenaRound' not in read('/game.mjs'):raise RuntimeError('Isolated arena test missing')
          if b'mountArenaFire' not in read('/arena-fire.mjs'):raise RuntimeError('Flowing fire renderer missing')
          if b'element-ice' not in read('/arena-battle.css'):raise RuntimeError('Element rings missing')
          photo=read('/arena-portraits/01.jpg')
          if not photo.startswith(b'\xff\xd8'):raise RuntimeError('Photographic avatar missing')
          manifest=json.loads(read('/narration-manifest.json'))
          if len(manifest)!=122:raise RuntimeError('Named voice clips missing')
          if any(x.get('natural_profile')!=70 for x in manifest.values()):raise RuntimeError('Unexpected voice profile')
          if state['admission']['entryMode']!='comment' or state['admission']['minCoins']!=0:raise RuntimeError('Free entry missing')
          if 'policyArchive' in state:raise RuntimeError('Private archive exposed')
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          chat=os.environ.get('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:data=json.load(r)
              except urllib.error.HTTPError as exc:raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':raise RuntimeError('Private owner chat required')
          text="نسخه 78 — نبرد حباب‌ها و جایگاه‌های آتشین\n\nپنل:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=78\n\nنمای TikTok LIVE Studio:\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=78\n\nتست خصوصی:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?tab=test&v=78\n\nرمز قبلی حفظ است. پنل را یک‌بار رفرش کنید؛ نمایش Studio نیز تازه می‌شود.\n\n• سؤال‌ها فعلاً از نمایش و گوینده حذف شده‌اند. ۸ شخصیت بازی با نام طبیعی و عکس پرترهٔ واقعی حضور دارند؛ ۳ جایگاه و ۵ حباب پایین. این شخصیت‌ها آمار واقعی بیننده/لایک/گیفت نیستند.\n• هر فرد شمارهٔ ثابت دارد؛ پس از حذف، شماره آزاد و قابل استفاده برای تازه‌وارد است. ورود تازه و شخصیت جایگزین از صفر شروع می‌کند.\n• با کمنتِ شماره، هدف انتخاب می‌شود؛ اعداد لاتین، فارسی و عربی پذیرفته‌اند. 0 حالت خودکار است. بدون هدف دستی، فقط نزدیک‌ترین فرد با امتیاز بالاتر هدف می‌شود؛ نفر اول هدف پایین‌ترِ خودکار ندارد.\n• هر لایک ۱ امتیاز بازی و ۱ ضربه؛ هر کوین ۱۰۰ امتیاز بازی و ۲۰ ضربه. بنابراین یک Rose یک‌کوینی ۲۰ ضربه دارد. کمنت متمایز ۱۰ امتیاز و ۱ ضربه دارد. گیفت زنجیره‌ای پس از رسید نهایی حساب می‌شود.\n• هر ۱۰۰ ضربهٔ همان مهاجم به همان هدف تا ۱ امتیاز منتقل می‌کند. ضربه‌های دو نفر مخلوط نمی‌شود. موجودی منفی نمی‌شود و لایک/کوین واقعی هرگز کم نمی‌شود.\n• فعالیت تازه دفاع می‌سازد. ۱۰۰ ضربهٔ برگشتی معمولاً ۱ امتیاز؛ هنگام حملهٔ همزمان دو نفر یا بیشتر، ۰٫۵ امتیاز دارد. تعداد ضربهٔ دسته‌ای با ×N نشان داده می‌شود؛ ذرات تزئینی ضربهٔ اضافه نیستند.\n• ورود واقعی به جایگاه از ۱۰۰ امتیاز است؛ بیشترین امتیاز واجد شرط، مقام اول را می‌گیرد. بدون فعالیت، صرف ورود جایگاه نمی‌دهد.\n• مقام اول ۳ دقیقه، دوم ۲ دقیقه، سوم ۱ دقیقه؛ زمان دیده می‌شود. با بلوک ۱۰۰ لایک یا یک کوین، مهلت جایگاه تمدید می‌شود. تازه‌وارد ۳۰ ثانیه فرصت آرام دارد؛ پس از آن حداکثر دو شخصیت در هر نوبت به فردی که مهلتش رسیده حمله می‌کنند. توقف، تایمرها را متوقف می‌کند.\n• پایان دور امتیاز بازی همه را صفر می‌کند. سابقهٔ مستقل لایکرها و گیفترها محفوظ می‌ماند. زمان دور و کلید شروع خودکار زیر کنترل میزبان است.\n\nنمایش:\nمقام اول: طلا + یخ + آتش با شعلهٔ موج‌دار و فوران؛ دوم: طلا + یخ؛ سوم: طلا. حلقه‌ها دور دایره‌اند. امتیاز بیشتر، حباب بزرگ‌تر و تزئین قوی‌تر می‌دهد؛ صورت و نوشته‌ها پوشیده نمی‌شوند.\n\nدر تب تست، «تست رقابت ۸ شخصیت و امتیاز»: ۸ شخصیت، ۱۰۰ لایک، یک گل، پایان دور و صفرشدن را در یک وضعیت جدا امتحان کنید. این تست به لایف رویداد یا امتیاز ساختگی نمی‌فرستد و صدای پولی تولید نمی‌کند.\n\nگوینده طبیعی انگلیسی/فارسی، با نام و تنوع بیشتر؛ هیچ پیام عمومیِ بی‌نام جایگزین تمام‌شدن سهمیه نمی‌شود. کمنت و فعالیت واقعی اولویت دارند. موسیقی یا بلندی صدا خودکار زیاد نشده است.\n\nسرگرمی رایگان، بدون جایزهٔ نقدی و بدون درخواست گیفت، لایک یا فالو. دریافت فعالیت واقعی همچنان به اتصال TikTok بستگی دارد."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN78_GUIDE_UPDATED '+json.dumps({'build':health['build'],'clips':len(manifest),'message_id':result['message_id'],'destination_type':'private'}))
          PY

name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="نسخهٔ تازهٔ سرگرمی پروفایل منتشر و آنلاین بررسی شد.\n\nپنل موبایل و کمپیوتر:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=47\n\nنمای TikTok LIVE Studio (1080×1920):\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=47\n\nرمز همان رمز قبلی است.\n\nتایمر دستی:\n• زمان دور را وارد کنید و «اعمال زمان» بزنید؛ پیش‌فرض180 ثانیه است.\n• «شروع» و «توقف/ادامه»؛ هنگام توقف، امتیاز دور ثابت است.\n• «از نو» امتیاز همان دور را پاک و تایمر را آماده می‌کند؛ تاریخچهٔ حامیان حفظ می‌شود.\n• «اعلام برنده» دور را همان لحظه تمام می‌کند.\n• دور بعد فقط با دکمهٔ شروع آغاز می‌شود.\n\nسه نفر برتر هر دور وسط52 کارت دیده می‌شوند: نفر اول بالاتر با تاج طلایی، نفر دوم چپ و نفر سوم راست با جام و مدال. جایگاه‌ها زنده تغییر می‌کنند. برترین گیفتر، لایکر و کامنت‌گذار نشان ویژه دارند.\n\nامتیازها: لایک1، کامنت10، هر کوین گیفت10. رتبه‌ها فقط با امتیاز همان دور محاسبه می‌شوند.\n\n12 حرکت ترکیبی متفاوت، رد نور، ذرات طلایی، برق، یخ و روبان نوری؛ فعالیت بیشتر باعث تزئین و واکنش بیشتر می‌شود. عکس اصلی واضح و نام‌ها روی نوار خوانا هستند.\n\nمدت پروفایل: فرد فعال3 دقیقه پس از آخرین فعالیت؛ تازه‌وارد بدون فعالیت1 دقیقه؛ خروج تأییدشده30 ثانیه. خروج همیشه از سویTikTok گزارش نمی‌شود.\n\nتست بدون لایف: شروع تایمر، تست ورود تازه و تست کامنت در پنل. موسیقی و صدای کارت کنترل مستقل دارند."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="نسخهٔ تازه منتشر و آنلاین تست شد.\n\nپنل:\nhttps://afgtakrun-live-crown-52.hf.space/league/control?v=45\n\nنمای TikTok LIVE Studio:\nhttps://afgtakrun-live-crown-52.hf.space/league/screen?studio=1&v=45\n\nتغییرات:\n• موسیقی اصلی با یک قطعهٔ فوتبالی شاد و هیجانی از ElevenLabs جایگزین شد. برای پخش آن، کلید Music / موسیقی پس‌زمینه را روشن کنید؛ حالت خاموش/روشن انتخابی شما حفظ شده است.\n• هر12 عکس واقعاً عوض شد و عکس‌های شادی گل و حالت‌های اکشن بازیکن‌ها جای تصاویر قبلی را گرفتند.\n• کارت‌ها6 حرکت چندمرحله‌ای متفاوت دارند و در جای ثابتشان حرکت می‌کنند.\n• صدای کاغذیِ پیوسته با حرکت هماهنگ است و زمان‌بندی تکراری تیک‌تیک حذف شد.\n• حباب‌های نشان باشگاه در دیمو برگشتند.\n• تازه‌واردها5 ثانیه نمایش داده می‌شوند؛ پروفایل بزرگ‌تر و نام سفید و برجسته است.\n• فهرست و سابقهٔ لایکرها و گیفترها حفظ می‌شود. زمان لیگ همان زمان ذخیره‌شده در پنل است.\n\nفرمان رفرش نمای لایف ارسال شد. دکمهٔ «رفرش نمای لایف» در پنل هم برقرار است. اگر صفحه‌ای هنوز قدیمی است، آن را یک‌بار با لینک بالا باز کنید. همان رمز پنل برقرار است."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="تب سرگرمی پروفایل منتشر و تست شد.\n\nپنل موبایل و کمپیوتر:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=46\n\nنمای TikTok LIVE Studio (1080×1920):\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=46\n\nرمز همان رمز قبلی است.\n\n• 52 کارت، ورود با یک زوم و برگشت به جایگاه؛ صف هنگام پر بودن.\n• 8 طرح و 7 سطح تزئین، حرکت و ذرات با افزایش فعالیت.\n• هر لایک 1، هر کامنت 10 و هر کوین گیفت 10 امتیاز.\n• تایمر نمایان 3 دقیقه؛ بالاترین امتیاز همان دور LIVE WINNER می‌شود. نتیجه 10 ثانیه نمایش داده می‌شود و دور بعد خودکار آغاز می‌شود.\n• پروفایل فعال: 3 دقیقه پس از آخرین فعالیت؛ تازه‌وارد بدون فعالیت: 1 دقیقه.\n• خروج تأییدشده: حذف پس از30 ثانیه. TikTok همیشه خروج فرد را گزارش نمی‌کند؛ سکوت به معنی خروج حساب نمی‌شود.\n• صداهای کارت فوتبالی و کنترل مستقل موسیقی حفظ شد.\n• تست بدون لایف: دکمهٔ تست ورود تازه و تست کامنت در پنل.\n\nلیگ فوتبال جدا باقی است:\nhttps://afgtakrun-live-crown-52.hf.space/league/control?v=46\nhttps://afgtakrun-live-crown-52.hf.space/league/screen?studio=1&v=46"
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

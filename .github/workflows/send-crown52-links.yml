name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="سرگرمی پروفایل به‌روز شد و آنلاین بررسی شد.\n\nپنل موبایل و کمپیوتر:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=48\n\nنمای TikTok LIVE Studio (1080×1920):\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=48\n\nرمز همان رمز قبلی است.\n\n• ورود تازه فقط در نوار زیر کارت‌ها زوم می‌شود؛ هیچ بلور یا پرده‌ای روی جدول و سه نفر برتر نمی‌افتد.\n• پس از معرفی، عکس تازه‌وارد در کارت محو می‌شود. با لایک، کامنت یا گیفت، همان شماره دوباره روشن می‌شود. شمارهٔ قبلی تا زمان آزادبودن حفظ می‌شود.\n• ورودها به ترتیب1 تا52 است؛ پس از52 از ابتدا می‌چرخد و شماره‌های اشغال‌شده را رد می‌کند. هنگام پر بودن، افراد در صف می‌مانند.\n• سه نفر برتر هر دور وسط جدول هستند: نفر اول بالاتر با تاج طلایی؛ دوم چپ و سوم راست با جام و مدال.\n• تاج فقط وقتی جابه‌جا می‌شود که فرد دیگری امتیاز بیشتری بگیرد؛ امتیاز مساوی تاج را جابه‌جا نمی‌کند.\n• امتیاز هر کارت و سه نفر برتر با شمارش رو به بالا، نور و علامت افزایش نمایش داده می‌شود.\n\nامتیاز همان دور: هر لایک1، هر کامنت10، هر کوین گیفت10. نشان ویژهٔ برترین گیفتر، لایکر و کامنت‌گذار حفظ شده است.\n\nتایمر دستی: مدت را وارد و «اعمال زمان» بزنید؛ سپس «شروع». «توقف/ادامه» از همان ثانیه است. هنگام توقف امتیاز دور ثابت می‌ماند. «از نو» امتیاز دور را پاک می‌کند و «اعلام برنده» دور را تمام می‌کند. دور بعد خودکار شروع نمی‌شود.\n\nعکس فعال3 دقیقه پس از آخرین فعالیت؛ تازه‌وارد بدون فعالیت1 دقیقه؛ خروج تأییدشده30 ثانیه. TikTok همیشه خروج فرد را گزارش نمی‌کند.\n\nتست بدون لایف: شروع تایمر، تست ورود تازه، سپس تست کامنت. کنترل موسیقی جدا از صدای کارت است."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          origin='https://afgtakrun-live-crown-52.hf.space'
          def read_app(path):
              with urllib.request.urlopen(origin+path,timeout=30) as response:return response.read()
          for attempt in range(120):
              try:
                  health=json.loads(read_app('/health'))
                  if health.get('build')=='7802db1a6c823a139c321469f30950a4f9a62b44':break
              except Exception:pass
              time.sleep(10)
          else:raise RuntimeError('Expected profile62 deployment is not ready')
          html=read_app('/fun/control?v=62').decode()
          for element in ['profileTestTab','profilePreviewDialog','repeatProfilePreview','growProfilePreview','closeProfilePreview']:
              if ('id="'+element+'"') not in html:raise RuntimeError('Missing deployed preview control: '+element)
          css=read_app('/portrait.css?v=62').decode()
          if 'body.test-only' not in css or '.profile-preview-dialog' not in css:raise RuntimeError('Updated bold preview styles missing')
          print('CROWN62_TEST_TAB_RESOURCES_VERIFIED '+json.dumps({'build':health['build'],'preview_controls':5,'bold_stats':True}))
          text="نسخه62 — تب جداگانه تست لایف\n\nپنل:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=62\n\nتب تست مستقیم:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?tab=test&v=62\n\nنمای TikTok LIVE Studio — 1080×1920:\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=62\n\nرمز همان رمز قبلی است. پنل را رفرش کنید و «تست لایف» را بزنید.\n\nدکمه‌های تست:\n• صدای گوینده با انتخاب فارسی یا انگلیسی\n• 100،500 و1000 لایک\n• گیفت100 و1000 کوین\n• تکرار شمارش از صفر و افزایش آمار نمونه\n• بخش «تست موشن، دیزاین و تازه‌وارد»:8 حرکت،6 دیزاین و ورود پروفایل\n• برگشت به پنل قبلی\n\nتست‌ها بدون اتصال TikTok کار می‌کنند و فقط داخل صفحه آزمایش نمایش داده می‌شوند. روی امتیاز، سابقه، افراد و تنظیمات بازی زنده اثر ندارند. زبان صدای تست مستقل است؛ زبان گوینده واقعی را در بخش صدای پنل انتخاب کنید که خودکار ذخیره می‌شود.\n\nنمایش و صدا:\n• متن نام و آمار خوانا و ثابت است؛ تصویر و قاب حرکت می‌کنند.\n• آمار بزرگ با1K،3K و12.5K کوتاه می‌شود؛ مقدار کامل حفظ است.\n• گوینده واقعی ElevenLabs برای فارسی و انگلیسی؛ فایل‌های تست آماده‌اند و هر بار زدن دکمه هزینه تولید تازه ندارد.\n• تشکر لایک100،500 و1000 و گیفت واقعی: لایکر سمت چپ و گیفتر سمت راست تاج9ثانیه دیده می‌شوند و سپس جایگاه‌ها بازمی‌گردند.\n• دعوت حمایت، فالو و فعالیت با زبان انتخاب‌شده، با رعایت قطع صدا و صحبت میزبان.\n\nآمار واقعی فقط از داده دریافتی TikTok است؛ داده ناموجود «—» است. پیش‌نمایش آمار، نمونه است. اتصال واقعی برای دریافت خودکار رویدادها لازم است و این تب محدودیت سرویس اتصال TikTok را رفع نمی‌کند.\n\nیک صفحه24نفره، صف انتظار، سابقه حمایت‌کنندگان و زمان فعلی بازی حفظ شده‌اند. برای نمای قدیمی، «رفرش نمای لایف» یا Refresh منبع Link/Browser در Studio را بزنید."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

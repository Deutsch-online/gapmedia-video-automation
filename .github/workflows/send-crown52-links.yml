name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          origin='https://afgtakrun-live-crown-52.hf.space'
          def read_app(path):
              with urllib.request.urlopen(origin+path,timeout=30) as response:return response.read()
          for attempt in range(120):
              try:
                  health=json.loads(read_app('/health'))
                  if health.get('build')=='ac06f4a762fee951447bc1501ef407739f926f04':break
              except Exception:pass
              time.sleep(10)
          else:raise RuntimeError('Expected bubble76 deployment is not ready')
          html=read_app('/fun/control?v=76').decode()
          for element in ['profileTestTab','profilePreviewDialog','repeatProfilePreview','growProfilePreview','closeProfilePreview']:
              if ('id="'+element+'"') not in html:raise RuntimeError('Missing deployed preview control: '+element)
          css=read_app('/portrait.css?v=76').decode()
          if 'body.test-only' not in css or '.profile-preview-dialog' not in css:raise RuntimeError('Updated bold preview styles missing')
          state=json.loads(read_app('/api/state'))['state']
          if state['admission']['entryMode']!='comment' or state['admission']['minCoins']!=0:raise RuntimeError('Free play enforcement missing')
          if 'policyArchive' in state:raise RuntimeError('Private policy archive exposed')
          if b'QUIZ_BANK' not in read_app('/question-bank.mjs'):raise RuntimeError('Question bank missing')
          if b'welcome' not in read_app('/welcome-scripts.mjs'):raise RuntimeError('Welcome variety missing')
          manifest=json.loads(read_app('/narration-manifest.json'))
          if len(manifest)!=40:raise RuntimeError('Expected40 narrator clips')
          print('CROWN76_RESOURCES_VERIFIED '+json.dumps({'build':health['build'],'clips':len(manifest)}))
          if b'QuizNarrator' not in read_app('/quiz-narrator.mjs'):raise RuntimeError('Interactive narrator missing')
          if b'testQuizNarrator' not in read_app('/game.mjs'):raise RuntimeError('Private narrator tests missing')
          if not health.get('naturalVoiceOnly'):raise RuntimeError('Natural voice policy missing')
          if any(x.get('natural_profile')!=70 for x in manifest.values()):raise RuntimeError('Old voice previews')
          if b'quiz-answer-people' not in read_app('/game.mjs'):raise RuntimeError('Answer photos missing')
          if b'PHOTO_QUEST_BANK' not in read_app('/photo-quest.mjs'):raise RuntimeError('Photo Quest missing')
          if 'id="profileGameMode"' not in html:raise RuntimeError('Game mode control missing')
          if b'QUIZ_PLAY_ORDER' not in read_app('/free-play.mjs'):raise RuntimeError('Varied quiz order missing')
          if b'activity-frame-orbit' not in read_app('/game.mjs'):raise RuntimeError('Activity frames missing')
          if b'SEAT_POINTS=100' not in read_app('/crown-rules.mjs'):raise RuntimeError('Confirmed crown rules missing')
          if b'vaporizeProfile' not in read_app('/bubble-battle.mjs'):raise RuntimeError('Expiry effect missing')
          text="نسخه76 — حمله، دفاع، انفجار و تاج‌های مرحله‌ای\n\nپنل:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=76\n\nنمای TikTok LIVE Studio:\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=76\n\nتست خصوصی:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?tab=test&v=76\n\nپنل و منبع Studio را رفرش کنید. رمز قبلی حفظ است.\n\nقانون نهایی:\n• ورود خودکار به جایگاه:100امتیاز؛ ورود به‌تنهایی تاج نمی‌دهد.\n• هر لایک1امتیاز، هر کوین100امتیاز؛ یک گل1کوینی=100لایک.\n• پاسخ درست10، اشتباه0با دلگرمی. کمنت عادی حملهٔ نمایشی دارد ولی امتیاز اضافهٔ پرسش نمی‌گیرد.\n• نرخ جدید هدیه برای رویدادهای بعد از به‌روزرسانی است؛ امتیازهای قبلی بازنویسی نمی‌شوند. مقدار کوین واقعی جدا حفظ می‌شود.\n\nتاج — بر اساس فعالیت واقعی شخص، بالاترین سطح اعمال می‌شود:\n•200لایک یا10کوین: نقره‌ای.\n•1000لایک یا100کوین: طلایی.\n•2000لایک یا500کوین: یخی/اژدهایی.\n• معیار گیفت، ارزش مجموع کوین‌هاست، نه تعداد هدیه‌ها.\n• تاج فقط برای فرد فعال است؛ عکس نمایشی جایگاه تاج واقعی نمی‌گیرد. نشستن در جایگاه با100امتیاز می‌تواند بدون تاج باشد.\n\nرقابت:\n• با کمنت، لایک و هدیهٔ واقعی، تیرهای نورانی و ستاره‌ای به رقیب می‌رسد؛ تا ادامهٔ فعالیت تمدید می‌شود.\n• نفر اول و دوم با فعالیت تازه دفاع می‌کنند؛ تیر برمی‌گردد و مهاجم عقب می‌رود.\n• نوار POWER از فاصلهٔ امتیازها محاسبه می‌شود. در خالی شدن نیرو یا افت جایگاه، انفجار موضعی و کوچک‌شدن کوتاه پروفایل دیده می‌شود.\n• تصاحب جایگاه فقط با امتیاز بالاتر است؛ نمایش تصاحبِ بدون تاج از تاجِ کسب‌شده جداست. ضربه، امتیاز واقعی رقیب را حذف نمی‌کند.\n• با پایان مهلت حضور، عکس همان شخص به دود تبدیل و محو می‌شود؛ بقیه صفحه تار نمی‌شود. ارتقا از حباب به جایگاه، خروج یا دودشدن حساب نمی‌شود.\n• حملهٔ تاریخی/تکراری بازپخش نمی‌شود. بعد از قطع فعالیت، شلیک‌ها خاموش می‌شوند.\n\nنمایش و تست:\nسؤال‌های دانشی قبلی حالت اصلی‌اند؛ بخش بزرگ Build Your Photo حذف شده، حباب تازه‌وارد کوچک است و با فعالیت رشد می‌کند. تایمر6دقیقه‌ای، تنظیمات و سابقه حفظ‌اند. سؤال تا یک ساعت تکرار نمی‌شود.\n\nدر تب تست: «تست حمله و دفاع»، حمله، دفاع، تصاحب، پایان زمان و دود، یک گل و100لایک؛ همچنین «تست تاج‌های نقره، طلا و یخ». این دکمه‌ها به کاربران/امتیازهای واقعی لایف چیزی اضافه نمی‌کنند و اعتبار ElevenLabs مصرف نمی‌کنند.\n\nورود رایگان و بدون جایزه؛ بدون درخواست گیفت، لایک یا فالو. صدای طبیعی ذخیره‌شده پس از سهمیه ادامه دارد؛ خواندن اختصاصی سؤال تازه تا تجدید سهمیه محدود است. صدای رباتی جایگزین نمی‌شود. دریافت رویداد به اتصال واقعی TikTok وابسته است."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

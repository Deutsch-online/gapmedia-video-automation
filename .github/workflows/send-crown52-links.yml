name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Update owner private guide after verified battle deployment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error
          origin='https://afgtakrun-live-crown-52.hf.space'
          expected='f10a593af8dba2e03829d33ce6dcf6589dc98438'
          def read(path):
              with urllib.request.urlopen(origin+path,timeout=30) as r:return r.read()
          health=json.loads(read('/health'))
          if health.get('build')!=expected or health.get('castleVersion')!=80 or not health.get('castleEnabled'):raise RuntimeError('Expected castle build not ready')
          state=json.loads(read('/api/state'))['state']
          castle=state['fun']['castle80']
          if not castle.get('enabled') or 'receipts' in castle:raise RuntimeError('Castle state invalid')
          if b'testCastle80' not in read('/game.mjs'):raise RuntimeError('Private test missing')
          if b'castle-map' not in read('/castle-ui.mjs'):raise RuntimeError('Renderer missing')
          if not read('/castle-board.png').startswith(b'\x89PNG'):raise RuntimeError('Board missing')
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          chat=os.environ.get('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:data=json.load(r)
              except urllib.error.HTTPError as exc:raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':raise RuntimeError('Private owner chat required')
          text="نسخه 80 — CASTLE CLASH LIVE\nنبرد سه قلعه با عکس شرکت‌کنندگان\n\nپنل:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=80\n\nنمای TikTok LIVE Studio:\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=80\n\nتست خصوصی:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?tab=test&v=80\n\nرمز قبلی حفظ است. پنل و منبع Studio را یک‌بار رفرش کنید.\n\n• اولین کمنت 1 حمله، 2 دفاع یا 3 کمک: ورود به تیم متعادل و ثبت انتخاب. اعداد فارسی و عربی نیز پذیرفته‌اند.\n• RED / BLUE / GREEN یا نام فارسی رنگ برای انتخاب تیم؛ تغییر تیم کاربر فعال از دور بعد اعمال می‌شود.\n• ۸ ثانیه تصمیم و ۲ ثانیه اجرای نبرد. آخرین انتخاب معتبر جای قبلی را می‌گیرد؛ تکرار کمنت قدرت اضافه نمی‌سازد.\n• حمله به تیم پیشتاز است؛ دفاع ضربه را می‌گیرد؛ کمک نیرو را ترمیم یا دفاع را تقویت می‌کند. عکس‌ها، سپر، پرتابه و پیام حمایت بر اساس نتیجه واقعی بازی نمایش داده می‌شود.\n• قدرت تیم به نسبت نقش‌ها محاسبه می‌شود تا تعداد بیشتر به‌تنهایی برنده نسازد.\n• بیشترین پیشرفت تصرف برنده است؛ تساوی واقعی مشترک است. جوایز Defender / Team Player / Best Move از دفاع، کمک و ضربه مؤثر محاسبه می‌شوند.\n• زمان دور ۶۰، ۹۰ یا ۱۲۰ ثانیه؛ شروع/ادامه، توقف، دور بعد، ریست و شروع خودکار در پنل.\n• ورود رایگان است. گیفت نتیجه نبرد را قوی‌تر نمی‌کند. لایک کمک دفاعی محدود دارد؛ آمار واقعی لایکر و گیفتر جدا حفظ می‌شود.\n• در نبود بازیکن، شخصیت‌های GAME CREW بازی را نشان می‌دهند؛ این‌ها بیننده یا آمار واقعی لایف نیستند.\n\nتست بدون لایف:\nدر تب Test، تست Castle Clash را بزنید؛ ورود، نقش 1/2/3، دفاع، کمک، توقف و پایان دور را امتحان کنید. تست جداست و به لایف امتیاز ساختگی نمی‌فرستد.\n\nنمای عمودی 9:16، نقشه تازه، عکس‌ها، تاج متغیر و افکت‌های حمله/دفاع/کمک اضافه شده‌اند. تنظیمات صدا حفظ است. بازی قبلی از منو قابل انتخاب است.\n\nتست بازی تأیید دریافت کمنت واقعی TikTok نیست. وضعیت اتصال واقعی در بخش اتصال پنل است؛ محدودیت سرویس دریافت رویداد مستقل از بازی است."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CASTLE80_GUIDE_UPDATED '+json.dumps({'build':health['build'],'message_id':result['message_id'],'destination_type':'private'}))
          PY

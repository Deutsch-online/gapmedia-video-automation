name: Send Crown52 panel and Studio screen links to owner Telegram
on:
  push:
    branches: [codex/live-crown52-hosting]
    paths:
      - .github/workflows/send-crown52-links.yml
permissions:
  contents: read
jobs:
  send:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver requested links to private bot conversation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          if not bot:raise RuntimeError('Telegram bot credential not configured')
          chat=os.getenv('TELEGRAM_REVIEW_CHAT_ID') or '7993801735'
          def call(method,payload):
              req=urllib.request.Request('https://api.telegram.org/bot'+bot+'/'+method,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('Telegram HTTP '+str(exc.code)) from None
              except Exception:
                  raise RuntimeError('Telegram request failed') from None
              if not data.get('ok'):raise RuntimeError('Telegram delivery failed')
              return data['result']
          if call('getChat',{'chat_id':chat}).get('type')!='private':
              raise RuntimeError('Private owner chat required')
          text="نسخه58: جایگاه بزرگ‌تر، آمار واقعی صفحه و دعوت به فالو\n\nپنل موبایل و کمپیوتر:\nhttps://afgtakrun-live-crown-52.hf.space/fun/control?v=58\n\nنمای TikTok LIVE Studio (1080×1920):\nhttps://afgtakrun-live-crown-52.hf.space/fun/screen?studio=1&v=58\n\nرمز همان رمز قبلی است.\n\nسه نفر برتر:\n• کارت‌ها بلندتر شده‌اند؛ تاج، قاب لیگ، عکس کامل و پرچم حفظ شده‌اند.\n• زیر عکس سه آمار جدا دیده می‌شود: PAGE LIKES / FOLLOWERS / FOLLOWING.\n• این عددها فقط از اطلاعات واقعی صفحه که TikTok همراه کاربر می‌فرستد خوانده می‌شوند. آمار ناموجود «—» است؛ صفرِ واقعی0 نشان داده می‌شود.\n• لایکِ بازی به تعداد لایک کل صفحه اضافه نمی‌شود؛ تعداد فالووینگ، لایک‌های داده‌شده و لایک‌های دریافت‌شده با هم اشتباه نمی‌شوند.\n• وقتی عدد واقعی برای اولین بار برسد یا کاربر وارد کارت جدید شود، شمارنده طی حدود1.8ثانیه از0 تا همان مقدار بالا می‌رود و می‌ایستد. این، انیمیشن تعداد موجود است.\n• اگر اطلاعات تازه افزایش واقعی نشان بدهد، همان تغییر جداگانه متحرک می‌شود.\n• دکمه‌نمای صورتی + FOLLOW THIS STAR و قلب‌های شناور از دیگران می‌خواهند فرد واقعی را فالو کنند. روی کارت‌های نمایشی، BE THE NEXT STAR دیده می‌شود.\n• اعداد جایگاه و امتیاز مسابقه مستقل از آمار صفحه‌اند.\n\nیک صفحه و صف:\n• همه در یک صفحه ثابت، حداکثر24کاربر واقعی؛ بقیه در صف انتظار.\n• فرد فعالِ منتظر جای فرد بی‌فعالیت را می‌گیرد. اگر همه فعال باشند، صف منتظر می‌ماند.\n• خروجی که TikTok گزارش کند فوراً از کارت و صف حذف می‌شود. همه خروج‌ها گزارش نمی‌شوند؛ در این حالت زمان بی‌فعالیتی تنظیم‌شده در پنل ملاک حذف است.\n• سابقه امتیاز، لایک و گیفت حفظ می‌شود.\n\nکنترل میزبان:\n• «مدیریت جایگاه‌ها»: برای مقام1،2یا3 کاربر انتخاب و «قرار بده» را بزنید؛ انتخاب فردِ جایگاه دیگر، دو نفر را جابه‌جا می‌کند.\n• «حذف پروفایل»، «بازگرداندن کاربر» و «برگشت به چیدمان خودکار» فوری‌اند.\n• تغییر دستی جایگاه، امتیاز واقعی را عوض نمی‌کند؛ برنده با امتیاز مسابقه تعیین می‌شود.\n\nزمان و کشور:\n• «مدت ماندن عکس بیننده»: خودکار60ثانیه برای تازه‌وارد و180ثانیه پس از آخرین فعالیت؛ حالت دلخواه5تا3600ثانیه با «ذخیرهٔ زمان عکس».\n• تایمر، مدت فعلی و شروع خودکار دور بعد حفظ شده‌اند.\n• write your Country فقط30ثانیه دیده می‌شود. نام کشور، مخفف لاتین، فارسی، عربی یا ایموجی پرچم پذیرفته می‌شود.\n\nنمایش خودکار:\n• سه چهره ساختگی متفاوت با لباس سبز، کت سفید و کت زرشکی و افکت‌های جایگاه دیده می‌شوند. امتیاز نمایشی وارد سابقه واقعی نمی‌شود.\n• با یک فرد واقعی، نمایش دو طرف ادامه دارد.\n\nصدا:\n• گوینده زن Sarah از ElevenLabs فعال است؛ موسیقی و افکت کارت جدا هستند.\n• متن‌های تکراری ذخیره می‌شوند؛ سقف روزانه تبدیل متن5000نویسه است. صدای0 درخواست تازه نمی‌فرستد؛ تنظیم فعلی موسیقی حفظ می‌شود.\n• نمونه:\nhttps://afgtakrun-live-crown-52.hf.space/narrator-preview.mp3?v=58\n\nپنل را رفرش کنید و «رفرش نمای لایف» را بزنید. اگر پنجره محلی Studio هنوز نسخه قدیم را دارد، Refresh همان منبع Link/Browser را بزنید."
          result=call('editMessageText',{'chat_id':chat,'message_id':2833,'text':text,'link_preview_options':{'is_disabled':True}})
          print('CROWN52_LINKS_UPDATED '+json.dumps({'message_id':result['message_id'],'destination_type':'private'}))
          PY

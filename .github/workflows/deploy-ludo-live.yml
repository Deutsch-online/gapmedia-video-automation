name: Deploy Ludo LIVE integrated panel on free CPU
on:
  push:
    branches: [main]
    paths:
      - live-ludo/**
      - .github/workflows/deploy-ludo-live.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ludo-live-free-hosting
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test panel authentication and shared state
        working-directory: live-ludo
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2' cryptography
      - name: Deploy only on explicitly free CPU-basic
        working-directory: live-ludo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy.py

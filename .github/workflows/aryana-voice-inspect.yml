name: Inspect the existing Aryana ElevenLabs connection
on:
  push:
    branches: [delivery/aryana-hf-20261029]
    paths: [aryana-hosting/voice-inspect-request.json]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
      - name: Inspect names and runtime status without revealing or changing credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EULERSTREAM_API_KEY: ${{ secrets.EULERSTREAM_API_KEY || secrets.EULER_STREAM_API_KEY || secrets.EULER_API_KEY || secrets.TIKTOK_SIGN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,hmac,hashlib,urllib.request
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          assert api.whoami()['name']=='afgtakrun'
          result={'github_signing_key_present':bool(os.getenv('EULERSTREAM_API_KEY')),'github_key_names_present':[name for name in ['ELEVENLABS_API_KEY','ELEVEN_API_KEY','ELEVENLABS_KEY','ELEVEN_LABS_API_KEY'] if os.getenv(name)],'spaces':{}}
          for repo in ['afgtakrun/aryana-live-studio','afgtakrun/aryana-live-lipsync']:
           secret_names=list(api.get_space_secrets(repo))
           variables=api.get_space_variables(repo)
           result['spaces'][repo]={'signing_secret_names':[name for name in secret_names if 'euler' in name.lower()],'elevenlabs_secret_names':[name for name in secret_names if 'eleven' in name.lower()],'elevenlabs_variable_names':[name for name in variables if 'eleven' in name.lower()],'voice_provider':variables['ARYANA_VOICE_PROVIDER'].value if 'ARYANA_VOICE_PROVIDER' in variables else None}
          key=hmac.new(os.environ['TELEGRAM_BOT_TOKEN'].encode(),b'aryana-admin-v1:afgtakrun/aryana-live-studio',hashlib.sha256).hexdigest()
          base='https://afgtakrun-aryana-live-studio.hf.space'
          def call(path,data=None):
           req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers={'x-aryana-key':key,'content-type':'application/json'})
           with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          state=call('/api/state')
          result['runtime']={name:state.get('capabilities',{}).get(name) for name in ['voiceProvider','voiceConfigured','voiceClone','liveLipSync','noEngagementRequests']}
          result['receiver_diagnostics']={k:v for k,v in state.get('live',{}).items() if k!='username'};result['connection']=state['connection'];result['quick_reactions']=state.get('quickReactions');result['preparation']={name:state.get(name) for name in ['livePreparation','entertainment','voiceArchive','lastError','voiceEngine','lipSync','programModelStatus','conversationStatus','queue']}
          selected=next((os.getenv(name) for name in ['ELEVENLABS_API_KEY','ELEVEN_API_KEY','ELEVENLABS_KEY','ELEVEN_LABS_API_KEY'] if os.getenv(name)),None)
          if selected:
           try:
            req=urllib.request.Request('https://api.elevenlabs.io/v1/user/subscription',headers={'xi-api-key':selected})
            with urllib.request.urlopen(req,timeout=25) as response:subscription=json.load(response)
            result['elevenlabs_account']={'authenticated':True,'remaining_characters':max(0,subscription.get('character_limit',0)-subscription.get('character_count',0))}
           except Exception as error:result['elevenlabs_account']={'authenticated':False,'error_type':type(error).__name__,'http_status':getattr(error,'code',None)}
          try:
           from huggingface_hub import hf_hub_download
           repo='afgtakrun/aryana-live-private-state'
           assert api.repo_info(repo,repo_type='dataset').private
           variables=api.get_space_variables('afgtakrun/aryana-live-studio')
           config=json.load(open(hf_hub_download('afgtakrun/aryana-live-studio','src/lipsync-config.json',repo_type='space',token=os.environ['HF_TOKEN'])))
           scope=hashlib.sha256(':'.join(['voice-bank-v1',variables['ELEVENLABS_VOICE_ID'].value,variables['ELEVENLABS_MODEL_ID'].value,config['revision'],config['reference_sha256']]).encode()).hexdigest()
           index=json.load(open(hf_hub_download(repo,'voice-bank/'+scope+'/index.json',repo_type='dataset',token=os.environ['HF_TOKEN'])))
           assert index['scope']==scope
           verified=0
           for clip in index['clips']:
            if not clip['group'].startswith('quick:'):continue
            for kind,path,expected in [('audio','voice-audio/'+clip['audio'][7:],clip['audioSha']),('video','voice-video/'+scope+'/'+clip['video'][7:],clip['videoSha'])]:
             local=hf_hub_download(repo,path,repo_type='dataset',token=os.environ['HF_TOKEN'])
             with open(local,'rb') as stream:assert hashlib.sha256(stream.read()).hexdigest()==expected
            verified+=1
           result['private_media_verified']={'clips':verified,'audio_and_video_hashes_match':True,'reference_sha256':config['reference_sha256'],'server_restarted':False}
          except Exception as error:result['private_media_verification_error']=type(error).__name__
          print('ARYANA_EXISTING_VOICE '+json.dumps(result),flush=True)
          PY

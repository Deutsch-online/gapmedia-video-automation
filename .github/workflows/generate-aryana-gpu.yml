name: Generate bounded Aryana PRO GPU previews from included allowance
on:
  push:
    branches: [delivery/aryana-hf-20261029]
    paths: [aryana-hosting/gpu-request.json]
permissions:
  contents: write
concurrency:
  group: aryana-included-gpu-previews
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check gradio_client==2.0.0
      - name: Generate at most three candidates with allowance guard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: python aryana-hosting/generate-gpu-candidates.py
      - name: Save preview candidates on isolated delivery branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add aryana-hosting/gpu-candidates
          if ! git diff --cached --quiet; then
            git commit -m 'Stage bounded Aryana GPU preview candidates for visual review'
            git pull --rebase origin delivery/aryana-hf-20261029
            git push origin HEAD:delivery/aryana-hf-20261029
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aryana-gpu-candidates
          path: aryana-hosting/gpu-candidates
          retention-days: 3

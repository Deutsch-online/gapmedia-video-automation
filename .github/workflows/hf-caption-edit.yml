name: Shorten existing private video captions
on:
  push:
    branches: [codex/hf-dialogue-60s]
    paths: [.hf-caption-edit.json]
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Edit the two confirmed Telegram video captions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {telegramConfig,verifyDelivery} from './lib/telegram.mjs';
          const tg=telegramConfig(process.env);
          const verified=await verifyDelivery({token:tg.token,chatId:tg.reviewChatId,requirePrivate:true});
          if(!verified.ok||verified.chat?.type!=='private')throw Error('Private destination not verified');
          const state=JSON.parse(fs.readFileSync('.hf-dialogue-telegram-delivery.json','utf8'));
          const captions={instagram:'Beim Arzt: fünf Sätze. #DeutschLernen #Alltagsdeutsch',tiktok:'Arzttermin: Sag es richtig! #DeutschLernen #LearnGerman'};
          const receipts=[];
          for(const platform of ['instagram','tiktok']){
            const message_id=state.platforms[platform].message_id;
            const response=await fetch('https://api.telegram.org/bot'+tg.token+'/editMessageCaption',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:tg.reviewChatId,message_id,caption:captions[platform]})});
            const result=await response.json();
            if(!result.ok&&!String(result.description).includes('message is not modified'))throw Error(platform+': '+result.description);
            if(result.ok&&result.result?.caption!==captions[platform])throw Error('Caption confirmation mismatch');
            receipts.push({platform,message_id,caption:captions[platform],confirmed:true});
          }
          fs.writeFileSync('caption-edit-receipts.json',JSON.stringify(receipts,null,2));
          console.log(JSON.stringify(receipts));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: short-caption-edit-receipts
          path: caption-edit-receipts.json
          retention-days: 14

name: Social learning and independent watchdog
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/social-watchdog.yml, scripts/social-watchdog.mjs]
permissions:
  contents: read
  actions: read
concurrency:
  group: social-learning-watchdog
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/social-watchdog.json
            .cache/platform-research
          key: social-watchdog-v2-${{ github.run_id }}
          restore-keys: social-watchdog-v2-
      - name: Refresh daily public platform guidance independently of video quota
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'ai-cast')
          from cinematic_readiness import platform_research,berlin_day
          print(json.dumps(platform_research(berlin_day(),Path('.cache/platform-research'))))
          PY
      - name: Monitor accounts and report operational blockers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/social-watchdog.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .cache/social-watchdog.json
            .cache/platform-research
          key: social-watchdog-v2-${{ github.run_id }}

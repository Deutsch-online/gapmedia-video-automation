name: Review exact-step face quality without delivery
on:
  push:
    branches: [codex/rental-story-45s]
    paths: [.rental-quality-preview-request.json]
permissions:
  contents: read
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing media tools
        run: |
          python -m pip install 'pillow>=11,<13' 'edge-tts>=7.2,<8' gradio_client 'huggingface_hub>=0.34'
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Check all production safeguards
        run: |
          python -m unittest discover -s tests -p 'test_cinematic_*.py'
          python -m unittest discover -s tests -p test_wan2gp_backend.py
      - uses: actions/cache/restore@v4
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-quality-preview-${{ github.run_id }}
          restore-keys: |
            cinematic-series-v2-quality-preview-
            cinematic-series-v2-rental-voices-
      - name: Render three real review takes with exact steps and no delivery
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAID_FALLBACK: 'off'
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import importlib.util, json, copy, shutil
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('series','ai-cast/cinematic-series.py')
          series=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(series)
          import cinematic_budget as budget
          config=series.load_json(series.CONFIG)
          state=series.load_json(series.STATE)
          plan=series.load_json('ai-cast/rental-warning-45s.json')
          plan['research_source']=state['pending']['plan']['research_source']
          history=state['history']
          status=Path('renders/face-quality-preview-status.json')
          status.parent.mkdir(exist_ok=True)
          try:
              series.validate_plan(plan,16,history,config)
              # All nine complete voices must fit before the first GPU request.
              series.prepare_narration(plan,Path('renders/cinematic-series-cache/e0016'),config,history)
              print('Metadata-only allowance preflight: '+json.dumps(budget.preflight()),flush=True)
              preview=copy.deepcopy(plan)
              preview['scenes']=preview['scenes'][:3]
              preview_cache=Path('renders/cinematic-series-cache/preview-e0016')
              preview_cache.mkdir(parents=True,exist_ok=True)
              for i in range(3):
                  for suffix in ('.mp3','.audio.sig'):
                      shutil.copyfile(Path('renders/cinematic-series-cache/e0016')/f'{i:02}{suffix}',preview_cache/f'{i:02}{suffix}')
              video=series.render(preview,config,preview=True,history=history)
              status.write_text(json.dumps({'status':'rendered-for-review','path':video,'duration_seconds':15,'paid_authorized':False,'delivered':False,'eye_and_lip_review':'pending'}))
          except Exception as exc:
              status.write_text(json.dumps({'status':'blocked','reason':series.provider_error(exc),'paid_authorized':False,'delivered':False}))
              raise
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: renders/cinematic-series-cache
          key: cinematic-series-v2-quality-preview-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-step-face-review
          path: |
            renders/face-quality-preview-status.json
            renders/cinematic-series/preview-e0016/*.mp4
            renders/cinematic-series/preview-e0016/contact.jpg
            renders/cinematic-series/preview-e0016/quality.json
            renders/cinematic-series-cache/e0016/narration-timing.json
          retention-days: 7

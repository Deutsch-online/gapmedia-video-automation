name: Daily GapMedia video delivery

# Runs in GitHub's cloud. The computer may be off.
#
# This used to fire on four exact single-minute crons (30 6/7 * * *, 0 15/16
# * * *) and gate on which one matched. On 2026-09-06 the 08:30 Berlin run
# never fired at all. The fix at the time assumed telegram.yml's much more
# frequent "*/5 * * * *" cron was proof GitHub delivers a frequent schedule
# reliably, and switched this workflow to "*/15 * * * *" polling a 30-minute
# window instead of one exact minute.
#
# That assumption did not hold up. Checked against real run history
# (2026-08-26 through 2026-09-08, both this workflow and telegram.yml):
# neither cron fires anywhere near its configured interval — actual gaps
# between runs range from under an hour to over 30 hours, regardless of
# whether the cron says every 5 minutes or every 15. GitHub's own docs say
# a scheduled run "may be delayed during periods of high load," which in
# practice means a 30-minute window has no real guarantee of ever seeing a
# poll land inside it: of ~40 sampled runs of THIS workflow across 13 days,
# only 2 ever fell inside a delivery window — on 2026-09-06 the morning
# batch was silently missed entirely and only the evening one happened to
# land, at 17:28, two minutes before that window would have closed too.
#
# Two independent fixes, not one:
# 1. The delivery windows below are open-ended (from the threshold time
# until the next one), not 30 minutes wide, so it no longer matters
# how late a poll arrives — only that at least one arrives before the
# next threshold, which the observed gaps satisfy far more often than
# they satisfy a 30-minute window.
# 2. The deployed Cloudflare Telegram Worker pushes a versioned touch to
# .trigger-daily-dispatch at 08:30 and 17:00 Europe/Berlin. It owns timezone
# handling and idempotency in KV, then this workflow applies its normal gate,
# fires this workflow through the `push` trigger below — an ordinary
# commit, not a workflow-dispatch API call, because the GitHub App
# connected to this repo has "contents: write" but not "actions: write"
# (confirmed live 2026-09-08: an actual workflow_dispatch call 403s,
# "Resource not accessible by integration," on both the MCP tool and a
# raw REST call; a plain push with the same credential does not). Every
# push through that path runs through the exact same time+dedup gate as
# a schedule-triggered run (see the default case below), so it is always
# safe to fire early, late, or extra — it just no-ops outside a
# threshold or after today's batch already shipped. An explicit
# workflow_dispatch with morning/evening/all bypasses the gate, for a
# manual backfill or test — that one still needs someone with actual
# Actions access to fire it from the GitHub UI or a CLI with a real PAT.
#
# The schedule trigger stays as a free, harmless second chance — GitHub is
# not reliable, but it is not zero, either.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".trigger-daily-dispatch"
  workflow_dispatch:
    inputs:
      batch:
        description: "auto = respect the real Berlin time + dedup gate (safe to call anytime); morning/evening/all force that batch immediately, skipping the gate"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening
          - all

concurrency:
  group: gapmedia-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    # German A1 is the only active production lane for now. This repository
    # variable is intentionally opt-in: unless the owner explicitly sets it
    # to true, scheduled/tutorial renders remain paused without deleting the
    # workflow or its delivery history.
    if: ${{ vars.GAPMEDIA_TUTORIALS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore delivery memory
        uses: actions/cache@v4
        with:
          path: |
            .telegram-sent.json
            .content-history.json
            .content-registry.json
            .daily-batch-sent.json
            .daily-delivery-progress.json
          key: scheduled-delivery-${{ github.run_id }}
          restore-keys: scheduled-delivery-

      - name: Check the Berlin delivery gate
        id: gate
        shell: bash
        run: |
          local_date="$(TZ=Europe/Berlin date '+%Y-%m-%d')"
          local_hm="$(TZ=Europe/Berlin date '+%H:%M')"
          echo "Berlin local time: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"

          already_sent() {
            [ -f .daily-batch-sent.json ] && grep -q "\"$1\"" .daily-batch-sent.json
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.batch }}" != "auto" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=${{ inputs.batch }}" >> "$GITHUB_OUTPUT"
            echo "date=$local_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          morning_due=false
          evening_due=false
          if [[ "$local_hm" > "08:30" || "$local_hm" == "08:30" ]] && ! already_sent "$local_date-morning"; then
            morning_due=true
          fi
          if [[ "$local_hm" > "17:00" || "$local_hm" == "17:00" ]] && ! already_sent "$local_date-evening"; then
            evening_due=true
          fi

          if [ "$morning_due" = true ] && [ "$evening_due" = true ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=all" >> "$GITHUB_OUTPUT"
            echo "date=$local_date" >> "$GITHUB_OUTPUT"
          elif [ "$morning_due" = true ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=morning" >> "$GITHUB_OUTPUT"
            echo "date=$local_date" >> "$GITHUB_OUTPUT"
          elif [ "$evening_due" = true ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=evening" >> "$GITHUB_OUTPUT"
            echo "date=$local_date" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "Before today's first threshold, or today's batch(es) already delivered — skipping."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          path: ~/.cache/whisper
          key: whisper-medium-v1
      - name: Install Persian narration quality gate
        if: steps.gate.outputs.go == 'yes'
        run: python -m pip install --disable-pip-version-check --quiet openai-whisper

      - name: System packages for video rendering
        if: steps.gate.outputs.go == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation

      - name: Narrated, or silent by request
        id: voicemode
        if: steps.gate.outputs.go == 'yes'
        run: |
          if [ -f .silent-render ]; then
            echo "voice=off" >> "$GITHUB_OUTPUT"
            echo "::warning::.silent-render is present — building music-only videos with no narration."
          else
            echo "voice=on" >> "$GITHUB_OUTPUT"
          fi

      - name: Free local TTS (pocket-tts)
        if: steps.gate.outputs.go == 'yes' && steps.voicemode.outputs.voice == 'on'
        run: |
          python -m pip install --disable-pip-version-check --quiet pocket-tts
          python - <<'PYEOF'
          import os, pathlib
          from huggingface_hub import snapshot_download
          root = pathlib.Path(snapshot_download("mehdi-hf/pocket-tts-farsi"))
          cfg = next(root.rglob("farsi.yaml"))
          voice = next(root.rglob("example_voice.wav"))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"POCKET_TTS_FARSI_CONFIG={cfg}\n")
              fh.write(f"POCKET_TTS_VOICE={voice}\n")
          print("pocket-tts model ready:", cfg)
          PYEOF

      - name: Produce and send the scheduled pair
        id: produce
        if: steps.gate.outputs.go == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: ${{ steps.voicemode.outputs.voice }}
          REQUIRE_VOICE: ${{ steps.voicemode.outputs.voice }}
          # Narrated deliveries must pass the ASR quality gate. When the
          # owner deliberately commits .silent-render, this resolves to off.
          NARRATION_QC: ${{ steps.voicemode.outputs.voice }}
          # Keep the scheduled lane on a free engine; paid MiniMax credit has
          # previously stopped a whole batch when its balance ran out.
          TTS_ENGINE: "edge"
          GERMAN_WORD_ENGINE: "edge"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ASR_MODEL: "medium"
          # Keep the cycle's own diagnosis inside the outer shell ceiling.
          # Without this, bash killed it first and the actual visual/provider
          # cause was buried in a partial log.
          DAILY_ATTEMPT_MINUTES: "32"
          DAILY_CYCLE_DEADLINE_MINUTES: "34"
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          batch="${{ steps.gate.outputs.batch }}"
          date="${{ steps.gate.outputs.date }}"
          progress_file=".daily-delivery-progress.json"

          slot_done() {
            node -e '
              const fs = require("fs");
              const [file, date, batch, slot] = process.argv.slice(1);
              try {
                const state = JSON.parse(fs.readFileSync(file, "utf8"));
                process.exit(state?.[date]?.[batch]?.includes(slot)? 0 : 1);
              } catch { process.exit(1); }
            ' "$progress_file" "$date" "$batch" "$1"
          }

          mark_done() {
            node -e '
              const fs = require("fs");
              const [file, date, batch, slot] = process.argv.slice(1);
              let state = {};
              try { state = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
              state[date]??= {};
              const prior = Array.isArray(state[date][batch])? state[date][batch] : [];
              state[date][batch] = [...new Set([...prior, slot])];
              const dates = Object.keys(state).sort();
              while (dates.length > 60) delete state[dates.shift()];
              fs.writeFileSync(file, JSON.stringify(state, null, 2));
            ' "$progress_file" "$date" "$batch" "$1"
          }

          failed=0
          run_slot() {
            local slot="$1"
            if slot_done "$slot"; then
              echo "✓ $slot was already delivered in this $batch batch; resuming only the missing format."
              return 0
            fi
            echo "▶ Producing $slot"
            if timeout --preserve-status 35m node daily-cycle.mjs --only "$slot"; then
              mark_done "$slot"
              echo "✓ $slot delivered and checkpointed."
            else
              echo "::error::$slot did not complete. Its sibling format will still be attempted; a later run will resume only this missing format."
              failed=1
            fi
          }

          case "${{ steps.gate.outputs.batch }}" in
            morning)
              run_slot tiktok
              run_slot instagram
              ;;
            evening)
              run_slot ai-tiktok
              run_slot ai-instagram
              ;;
            all)
              run_slot tiktok
              run_slot instagram
              run_slot ai-tiktok
              run_slot ai-instagram
              ;;
            *)
              echo "Unknown batch: ${{ steps.gate.outputs.batch }}" >&2
              exit 1
              ;;
          esac

          if [ "$failed" -eq 0 ]; then
            echo "complete=yes" >> "$GITHUB_OUTPUT"
          else
            echo "complete=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Record delivery marker
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const date = process.argv[1];
            let progress = {};
            try { progress = JSON.parse(fs.readFileSync(".daily-delivery-progress.json", "utf8")); } catch {}
            const REQUIRED = { morning: ["tiktok", "instagram"], evening: ["ai-tiktok", "ai-instagram"] };
            const add = [];
            for (const [name, slots] of Object.entries(REQUIRED)) {
              const done = new Set(progress?.[date]?.[name] || []);
              if (slots.every((s) => done.has(s))) add.push(`${date}-${name}`);
            }
            let existing = [];
            try { existing = JSON.parse(fs.readFileSync(".daily-batch-sent.json", "utf8")); } catch {}
            const merged = [...new Set([...existing,...add])].slice(-60);
            fs.writeFileSync(".daily-batch-sent.json", JSON.stringify(merged, null, 2));
          ' "${{ steps.gate.outputs.date }}"

      - name: Persist delivery memory to git
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- .content-history.json .content-registry.json .daily-batch-sent.json .daily-delivery-progress.json .telegram-sent.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily: record today's ${{ steps.gate.outputs.batch }} send(s)"
          if git push; then
            echo "delivery memory pushed"
          else
            echo "push rejected, retrying once after rebase"
            git pull --rebase --autostash
            if git push; then
              echo "delivery memory pushed after retry"
            else
              echo "::error::today's delivery memory could not be pushed — a later poll or tomorrow's rotation may resend/repeat what just went out."
              node -e '
                const token = process.env.TELEGRAM_BOT_TOKEN, chatId = process.env.TELEGRAM_CHAT_ID;
                if (!token ||!chatId) process.exit(0);
                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                  method: "POST", headers: { "content-type": "application/json" },
                  body: JSON.stringify({ chat_id: chatId, text: "⚠ حافظهٔ ارسال امروز ذخیره نشد — ممکن است ویدیویی تکراری ارسال شود. نیاز به بررسی دستی." }),
                }).catch(() => {});
              '
                exit 1
              fi
            fi

      - name: Mark incomplete delivery for retry
        if: steps.gate.outputs.go == 'yes' && steps.produce.outputs.complete!= 'yes'
        run: |
          echo "::warning::One or more native formats were not delivered. Completed formats were checkpointed; the next trigger will resume only the missing format."

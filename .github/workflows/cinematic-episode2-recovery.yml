name: Recover completed cinematic episode 2
on:
  push:
    branches: [main]
    paths: [ai-cast/recover-cinematic-episode2.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: gapmedia-lesson
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: cinematic-series-38892001615
          run-id: 38892001615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: renders/cinematic-series
      - name: Repair known AAC tail and deliver once without rebuilding
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: python ai-cast/recover-cinematic-episode2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-episode2
          path: |
            renders/cinematic-series/**/e*-cinematic-fa-de.mp4
            renders/cinematic-series/**/quality.json
            renders/cinematic-series/**/delivery-receipt.json
          retention-days: 14

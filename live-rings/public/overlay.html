<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خروجی شفاف حلقه</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent!important;overflow:hidden;width:100%;height:100%}#scene{position:absolute;width:1080px;height:1920px;transform-origin:top left;direction:rtl}#ring{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;z-index:2}#winner-profile{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:1}#winner-profile img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}#winner-name{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:30px;max-width:330px;padding:5px 14px;border-radius:18px;background:#101522c9;color:#fff;font:20px Tahoma;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#wall{position:absolute;bottom:60px;left:40px;right:40px;z-index:3;color:white;font:16px Tahoma}.activity-group{margin-top:20px}.group-label{display:block;text-align:center;color:#f0d59e;font-size:16px;margin-bottom:16px;text-shadow:0 1px 5px #000}.fan-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.gift-group .fan-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.fan{min-width:0;display:flex;align-items:center;gap:7px;padding:8px;border-radius:15px;background:#101521ce;border:1px solid #94826266}.profile-frame{position:relative;display:flex;flex:none;padding:3px;border-radius:50%;border:1px solid #aa8ccb}.fan img,.fan .initial{width:42px;height:42px;object-fit:cover;border-radius:50%;background:#453a51;display:grid;place-items:center}.fan .text{min-width:0;flex:1;font-size:13px}.fan .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fan small{display:block;white-space:nowrap;font-size:12px;color:#e5c78f;margin-top:4px}.fan.gift{border-color:#caa75d;background:#362411d9}.fan.gift .profile-frame{border-color:#ffd371;box-shadow:0 0 12px #ffcd6d80;animation:shine 2.5s ease-in-out infinite}.fan.champion{border:2px solid #ffe28a;background:#473313dc}.fan.champion .profile-frame{border:2px solid #ffe18c;box-shadow:0 0 18px #ffc34b;animation:shine 1.8s ease-in-out infinite}.crown{position:absolute;top:-23px;left:50%;transform:translateX(-50%);font:29px Georgia;color:#ffdc66;text-shadow:0 0 10px #ffae26;z-index:3}#demo,#offline{position:absolute;top:15px;font:15px Tahoma;padding:6px 12px;border-radius:8px;background:#171925b0;z-index:4}#demo{left:15px;color:#f0cf8a}#offline{right:15px;color:#e7a8a8}[hidden]{display:none!important}@keyframes shine{50%{filter:brightness(1.2);box-shadow:0 0 20px #ffdc75b0}}
#wall{top:50%;bottom:auto;left:auto;right:20px;width:252px;transform:translateY(-50%)}#wall[data-side="left"]{left:20px;right:auto}.activity-group{margin-top:14px}.group-label{font-size:15px;margin-bottom:14px}.fan-grid,.gift-group .fan-grid{display:flex;flex-direction:column;gap:10px}.fan{height:78px;padding:10px 12px;gap:13px;border-radius:20px;background:linear-gradient(120deg,rgba(215,235,255,.15),rgba(15,24,39,.23));border:1px solid rgba(235,245,255,.32);box-shadow:inset 0 1px 0 #ffffff28,0 6px 16px #00000022;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.fan .profile-frame{width:52px;height:52px;border:0;padding:0;box-shadow:none!important;animation:none;overflow:visible}.fan img,.fan .initial{width:52px;height:52px;position:relative;z-index:1}.profile-ring{position:absolute;width:96px;height:96px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none}.fan .text{font-size:16px}.fan small{font-size:14px}.fan.gift{background:linear-gradient(125deg,#ffe9a82b,#291c112f);border-color:#eacb7a77}.fan.champion{background:linear-gradient(125deg,#ffdc6d33,#34241a30);border:1px solid #ffdf8b99}.fan.champion .profile-frame{border:0}.crown{z-index:4;top:-25px;font-size:29px} </style></head><body><div id="scene"><div id="winner-profile" hidden><img id="winner-avatar" alt=""><span id="winner-name"></span></div><canvas id="ring" width="1080" height="1920"></canvas><div id="wall"></div><div id="demo" hidden>آزمایشی</div><div id="offline" hidden>دریافت رویداد قطع است</div></div><script type="module" src="/overlay.js"></script></body></html>

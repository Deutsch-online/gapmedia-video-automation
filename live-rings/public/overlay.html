<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خروجی شفاف حلقه</title><style>html,body{margin:0;background:transparent!important;overflow:hidden;width:1080px;height:1920px}canvas{position:absolute;inset:0}#wall{position:absolute;bottom:80px;left:50px;right:50px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font:18px Tahoma;color:white}.fan{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:40px;background:rgba(13,16,26,.82);border:1px solid rgba(235,199,121,.5)}.fan img,.fan .initial{width:50px;height:50px;object-fit:cover;border-radius:50%;background:#453a51;display:grid;place-items:center}.fan small{display:block;font-size:14px;color:#e5c78f}#demo{position:absolute;top:15px;left:15px;font:16px Tahoma;color:#f0cf8a;background:#171925b0;border-radius:8px;padding:6px 12px}#offline{position:absolute;top:15px;right:15px;font:16px Tahoma;color:#e7a8a8;background:#171925b0;border-radius:8px;padding:6px 12px}#wall{display:block}.activity-group{width:100%;margin-top:24px}.group-label{display:block;text-align:center;color:#f0d59e;font-size:16px;margin-bottom:22px;text-shadow:0 1px 5px black}.fan-grid{display:flex;justify-content:center;flex-wrap:wrap;gap:16px}.profile-frame{position:relative;display:inline-flex;padding:4px;border-radius:50%;border:1px solid #aa8ccb}.fan.gift{border-color:#ffd37b;background:linear-gradient(130deg,#362411eb,#151524de)}.fan.gift .profile-frame{border:2px solid #ffd371;box-shadow:0 0 18px #ffcd6da0;animation:shine 2.5s ease-in-out infinite}.fan.champion{border:2px solid #ffe28a;background:linear-gradient(130deg,#4a3514ed,#22192ced)}.fan.champion .profile-frame{border:3px solid #ffe18c;box-shadow:0 0 28px #ffc34bd9;animation:shine 1.8s ease-in-out infinite}.crown{position:absolute;top:-32px;left:50%;transform:translateX(-50%);font:40px Georgia;color:#ffdc66;text-shadow:0 0 16px #ffae26;z-index:3}@keyframes shine{50%{filter:brightness(1.3);box-shadow:0 0 30px #ffdc75ce}} </style></head><body><canvas id="ring" width="1080" height="1920"></canvas><div id="wall"></div><div id="demo" hidden>آزمایشی</div><div id="offline" hidden>دریافت رویداد قطع است</div><script type="module" src="/overlay.js"></script></body></html>
